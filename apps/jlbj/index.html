<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今岭笔记</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <script src="pinyin-pro.min.js"></script>
    <script src="supabase.min.js"></script>
    <style>
        :root {
            --bg: #1a1a2e;
            --border: #8b7fa8;
            --text: #e6e6f0;
            --highlight: #9b86bd;
            --muted: #7a7a8c;
            --overlay-bg: rgba(26, 26, 46, 0.9);
            --panel-bg: #232339;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .top-bar {
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-group {
            flex: 1;
        }

        input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        input::placeholder {
            color: var(--muted);
        }

        /* Contenteditable div 样式 */
        .form-content {
            min-height: 120px;
            max-height: 400px;
            overflow-y: auto;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 16px;
            width: 100%;
            outline: none;
            font-family: inherit;
            padding: 10px;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .form-content:empty::before {
            content: attr(placeholder);
            color: var(--muted);
            pointer-events: none;
        }

        .form-content:focus {
            border-color: var(--highlight);
        }

        .form-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0;
            border-radius: 4px;
        }

        .form-content.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .btn-icon {
            cursor: pointer;
            color: var(--muted);
            font-size: 20px;
            user-select: none;
            transition: all 0.3s ease;
            padding: 4px 8px;
            border: 1px solid transparent;
            position: relative;
        }

        .btn-icon:hover {
            color: var(--highlight);
            border-color: var(--border);
            box-shadow: 0 0 10px rgba(155, 134, 189, 0.3);
        }

        .btn-icon:active {
            transform: scale(0.95);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--muted);
            transition: background-color 0.3s ease;
            margin-right: 8px;
            cursor: help;
        }

        /* 编辑面板遮罩 */
        #panelOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background-color: var(--overlay-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out;
        }

        #panelOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        .panel {
            width: 90%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 20px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        #panelOverlay.active .panel {
            transform: scale(1) translateY(0);
        }

        /* 全局加载遮罩 */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            background: rgba(26, 26, 46, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            color: var(--highlight);
            font-size: 16px;
        }

        #loadingOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(155, 134, 189, 0.2);
            border-top-color: var(--highlight);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .form-row {
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 12px;
            color: var(--highlight);
            margin-bottom: 5px;
            display: block;
        }

        .form-input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--highlight);
            outline: none;
        }

        textarea.form-input {
            min-height: 120px;
            max-height: 60vh;
            resize: vertical;
            overflow-y: auto;
            line-height: 1.5;
        }

        .btn-save {
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 20px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-save::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(155, 134, 189, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-save:hover:not(:disabled) {
            background: var(--border);
            color: var(--bg);
            border-color: var(--highlight);
            box-shadow: 0 0 12px rgba(155, 134, 189, 0.4);
        }

        .btn-save:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-save:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 0 8px rgba(155, 134, 189, 0.3);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--muted);
        }

        /* 取消按钮样式 */
        .btn-cancel {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            padding: 8px 20px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            color: var(--text);
            border-color: var(--border);
            box-shadow: 0 0 10px rgba(139, 127, 168, 0.3);
        }

        .btn-cancel:active {
            transform: translateY(1px);
        }

        /* 删除按钮样式（面板中） */
        .btn-danger {
            background: transparent;
            color: #c47a9f;
            border: 1px solid transparent;
            padding: 8px 20px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s ease;
            float: right;
        }

        .btn-danger:hover {
            color: #e8a0bf;
            border-color: #c47a9f;
            box-shadow: 0 0 10px rgba(196, 122, 159, 0.4);
        }

        .btn-danger:active {
            transform: translateY(1px);
        }

        .list-item {
            padding: 15px 0;
            border-bottom: 1px solid #3a3a4a;
            cursor: pointer;
            transition: color 0.2s;
        }

        .list-item:hover {
            color: var(--highlight);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .title {
            font-size: 16px;
            transition: color 0.2s;
        }

        .tag {
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--muted);
            padding: 2px 6px;
            text-transform: uppercase;
        }

        .content {
            display: none;
            margin-top: 10px;
            color: #c0c0d0;
            font-size: 14px;
            padding-left: 12px;
            border-left: 2px solid var(--border);
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .list-item.expanded .content {
            display: block;
        }

        .list-item.expanded .title {
            color: var(--highlight);
        }

        .btn-delete {
            float: right;
            font-size: 12px;
            color: #c47a9f;
            margin-top: 10px;
            border: 1px solid transparent;
            background: none;
            cursor: pointer;
            display: none;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            color: #e8a0bf;
            border-color: #c47a9f;
            box-shadow: 0 0 10px rgba(196, 122, 159, 0.4);
        }

        .btn-delete:active {
            transform: translateY(1px);
        }

        .list-item.expanded .btn-delete {
            display: inline-block;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--highlight);
        }

        /* WEBAPP 小程序容器样式 */
        .webapp-container {
            margin: 15px 0;
            padding: 15px;
            background: rgba(155, 134, 189, 0.05);
            border: 1px dashed var(--border);
            border-radius: 4px;
            position: relative;
            min-height: 40px;
        }

        .webapp-container.webapp-active {
            background: rgba(155, 134, 189, 0.08);
            border-style: solid;
            border-color: var(--highlight);
            box-shadow: 0 0 8px rgba(155, 134, 189, 0.2);
            padding: 0;
            /* 移除内边距，让内容完全控制自己的空间 */
        }

        .webapp-container::before {
            content: 'Mini App';
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--bg);
            padding: 0 8px;
            font-size: 11px;
            color: var(--highlight);
            letter-spacing: 0.5px;
            z-index: 1;
        }

        /* WEBAPP 内容隔离包装器 */
        .webapp-isolate {
            /* 重置所有继承的样式 */
            all: initial;

            /* 重新设置必要的基础样式 */
            display: block;
            position: relative;

            /* 确保使用标准盒模型 */
            box-sizing: border-box;

            /* 重置字体和文本样式 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #000;

            /* 重置背景 */
            background: #fff;

            /* 确保内容可见 */
            overflow: auto;

            /* 1:1 显示 - 不缩放 */
            width: 100%;
            min-height: 40px;
        }

        /* 重置 WEBAPP 内部所有元素的样式继承 */
        .webapp-isolate * {
            all: unset;
            display: revert;
            box-sizing: border-box;
        }

        /* 恢复常用 HTML 元素的默认样式 */
        .webapp-isolate div,
        .webapp-isolate span,
        .webapp-isolate p,
        .webapp-isolate a,
        .webapp-isolate button,
        .webapp-isolate input,
        .webapp-isolate textarea,
        .webapp-isolate select,
        .webapp-isolate img,
        .webapp-isolate canvas,
        .webapp-isolate svg {
            all: revert;
            box-sizing: border-box;
        }

        /* 密码输入弹窗 */
        #passwordOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3000;
            background-color: var(--overlay-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out;
        }

        #passwordOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 删除确认弹窗 */
        #confirmOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3000;
            background-color: var(--overlay-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out;
        }

        #confirmOverlay.active {
            opacity: 1;
            visibility: visible;
        }

        .password-panel {
            width: 90%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 20px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        #passwordOverlay.active .password-panel,
        #confirmOverlay.active .password-panel {
            transform: scale(1) translateY(0);
        }

        .password-title {
            font-size: 14px;
            color: var(--highlight);
            margin-bottom: 15px;
        }

        .password-input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .password-input:focus {
            border-color: var(--highlight);
            outline: none;
        }

        .password-buttons {
            display: flex;
            gap: 10px;
        }

        .password-btn {
            flex: 1;
            background: var(--panel-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .password-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(155, 134, 189, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .password-btn:hover {
            background: var(--border);
            color: var(--bg);
            border-color: var(--highlight);
            box-shadow: 0 0 12px rgba(155, 134, 189, 0.4);
        }

        .password-btn:hover::before {
            left: 100%;
        }

        .password-btn:active {
            transform: translateY(1px);
            box-shadow: 0 0 8px rgba(155, 134, 189, 0.3);
        }

        .password-btn.cancel {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
        }

        .password-btn.cancel:hover {
            color: var(--text);
            border-color: var(--border);
            box-shadow: 0 0 10px rgba(139, 127, 168, 0.3);
        }

        .password-btn.cancel::before {
            display: none;
        }

        .password-btn.delete {
            background: transparent;
            color: #c47a9f;
            border: 1px solid transparent;
        }

        .password-btn.delete:hover {
            color: #e8a0bf;
            border-color: #c47a9f;
            box-shadow: 0 0 10px rgba(196, 122, 159, 0.4);
        }

        .password-btn.delete::before {
            display: none;
        }

        .password-error {
            color: #c47a9f;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        /* 搜索匹配高亮下划线样式 */
        .search-highlight {
            text-decoration: underline;
            text-decoration-color: var(--highlight);
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
            color: var(--highlight);
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <div id="status-dot" class="status-dot" title="连接中..."></div>
            <div class="input-group">
                <input type="text" id="search" placeholder="> 输入关键词或简拼..." autofocus autocomplete="off"
                    name="search-field">
            </div>
            <div class="btn-icon" onclick="togglePanel()" title="Add New Entry">[ + ]</div>
        </div>
        <div id="results"></div>
    </div>

    <!-- 编辑面板遮罩 -->
    <div id="panelOverlay" onclick="handleOverlayClick(event)">
        <div class="panel" id="addPanel">
            <!-- 隐藏的诱饵输入框，防止浏览器自动填充 -->
            <input type="text" style="position:absolute;top:-9999px;left:-9999px;" tabindex="-1" autocomplete="off">
            <input type="password" style="position:absolute;top:-9999px;left:-9999px;" tabindex="-1"
                autocomplete="new-password">
            <div style="color: var(--muted); font-size: 12px; margin-bottom: 12px;">
                数据编辑面板
                <span id="lastModifiedDisplay" style="float: right; color: var(--muted); font-size: 10px;"></span>
            </div>
            <div class="form-row">
                <label class="form-label">> 标题</label>
                <input type="text" id="newTitle" class="form-input" placeholder="例如: 前厅开早流程" autocomplete="off">
            </div>
            <div class="form-row">
                <label class="form-label">> 分类</label>
                <input type="text" id="newTag" class="form-input" placeholder="例如: 笔记, 流程, 资料" autocomplete="off">
            </div>
            <div class="form-row">
                <label class="form-label">> 内容详情 (支持粘贴图片)</label>
                <div id="newContent" class="form-content" contenteditable="true" placeholder="在此输入详细配方或流程... (直接粘贴图片)">
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn-save" id="btnSave" onclick="saveData()">[ 保存 ]</button>
                <button class="btn-cancel" onclick="togglePanel()">[ 取消 ]</button>
                <button class="btn-danger" id="btnDelete" onclick="deleteCurrentItem()">[ 删除 ]</button>
            </div>
        </div>
    </div>

    <!-- 全局加载遮罩 -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">正在处理...</div>
    </div>

    <!-- 密码输入弹窗 -->
    <div id="passwordOverlay" onclick="handlePasswordOverlayClick(event)">
        <div class="password-panel">
            <div class="password-title">请输入密码</div>
            <!-- 隐藏的诱饵输入框，防止浏览器自动填充 -->
            <input type="text" style="position:absolute;top:-9999px;left:-9999px;" tabindex="-1" autocomplete="off">
            <input type="password" style="position:absolute;top:-9999px;left:-9999px;" tabindex="-1"
                autocomplete="new-password">
            <input type="password" id="passwordInput" class="password-input" placeholder="输入密码以继续..." autocomplete="off"
                name="password-field" />
            <div class="password-error" id="passwordError">密码错误！</div>
            <div class="password-buttons">
                <button class="password-btn cancel" onclick="closePasswordDialog()">取消</button>
                <button class="password-btn" onclick="confirmPassword()">确认</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="confirmOverlay" onclick="handleConfirmOverlayClick(event)">
        <div class="password-panel">
            <div class="password-title">确认删除</div>
            <div style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">此操作无法撤销，确认要永久删除此条目吗？</div>
            <div class="password-buttons">
                <button class="password-btn cancel" onclick="closeConfirmDialog()">取消</button>
                <button class="password-btn delete" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script>
        // 防止脚本重复执行
        if (window.__jlbjInitialized) {
            console.warn('⚠️ 今岭笔记应用已初始化，跳过重复执行');
        } else {
            window.__jlbjInitialized = true;
            // 所有初始化代码都在这个 else 块中

            // ==================== 拼音工具（只声明一次） ====================
            const PinyinUtil = {
                isAvailable() { return typeof pinyinPro !== 'undefined'; },
                generate(text) {
                    if (!text || !this.isAvailable()) return { pinyin: '', initial: '' };
                    const pinyin = pinyinPro.pinyin(text, { toneType: 'none', type: 'array' }).join('');
                    const initial = pinyinPro.pinyin(text, { pattern: 'first', toneType: 'none' }).replace(/\s+/g, '');
                    return { pinyin, initial };
                },
                match(text, keyword) {
                    if (!text) return false;
                    const lowerText = text.toLowerCase();
                    const lowerKey = keyword.toLowerCase();
                    if (lowerText.includes(lowerKey)) return true;
                    if (this.isAvailable()) {
                        const { pinyin, initial } = this.generate(text);
                        return pinyin.toLowerCase().includes(lowerKey) || initial.toLowerCase().includes(lowerKey);
                    }
                    return false;
                }
            };

            // ==================== 配置 ====================
            const CONFIG = {

                TABLE_NAME: 'sop_items',
                DEFAULT_TAG: 'MISC',
                PASSWORD: '654321'
            };

            // 防止重复初始化 - 使用 window 对象存储实例
            if (!window.__jlbjSupabaseClient) {
                window.__jlbjSupabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
            }
            const supabase = window.__jlbjSupabaseClient;

            // ==================== WEBAPP 小程序配置 ====================
            const WEBAPP_PARSER = {
                REGEX: /\[WEBAPP\]([\s\S]*?)\[\/WEBAPP\]/g,
                UNIQUE_PREFIX: 'webapp_'
            };
            const WEBAPP_INSTANCES = new Map(); // 存储小程序实例的清理函数

            let db = [];
            let editingId = null;
            let passwordResolve = null;

            // ==================== 加载遮罩控制 ====================
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');

            function showLoading(msg = '正在处理...') {
                loadingText.textContent = msg;
                loadingOverlay.classList.add('active');
                document.getElementById('btnSave').disabled = true;
                document.getElementById('btnDelete').disabled = true;
            }
            function hideLoading() {
                loadingOverlay.classList.remove('active');
                document.getElementById('btnSave').disabled = false;
                document.getElementById('btnDelete').disabled = false;
            }

            // ==================== DOM & 初始化 ====================
            const DOM = {};
            function initDOM() {
                DOM.input = document.getElementById('search');
                DOM.results = document.getElementById('results');
                DOM.overlay = document.getElementById('panelOverlay');
                DOM.panel = document.getElementById('addPanel');
                DOM.newTag = document.getElementById('newTag');
                DOM.newTitle = document.getElementById('newTitle');
                DOM.newContent = document.getElementById('newContent');
                DOM.lastModifiedDisplay = document.getElementById('lastModifiedDisplay');

                // 添加粘贴事件监听
                if (DOM.newContent) {
                    DOM.newContent.addEventListener('paste', handlePaste);
                }
            }

            // ==================== 图片粘贴处理 ====================
            function handlePaste(e) {
                const items = e.clipboardData && e.clipboardData.items;
                if (!items) return;

                let hasImage = false;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        hasImage = true;
                        const blob = items[i].getAsFile();
                        processImage(blob);
                        e.preventDefault();
                        break;
                    }
                }

                if (!hasImage) {
                    // 强制转为纯文本
                    e.preventDefault();
                    const text = e.clipboardData.getData('text/plain');
                    document.execCommand('insertText', false, text);
                }
            }

            function processImage(blob) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    const imgHtml = `<img src="${base64}"><div><br></div>`;
                    document.execCommand('insertHTML', false, imgHtml);
                };
                reader.readAsDataURL(blob);
            }

            function formatDate(dateString) {
                if (!dateString) return '';
                const d = new Date(dateString);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }

            async function initDB() {
                // 1. 立即建立实时订阅（并行，不阻塞）
                setupRealtimeSubscription();

                // 2. 先立即显示缓存数据（无 loading 遮罩）
                const cachedData = localStorage.getItem('jlbj_cache');
                if (cachedData) {
                    try {
                        db = JSON.parse(cachedData);
                        render(db);
                        console.log('✓ 已加载缓存数据');
                    } catch (e) {
                        console.warn('缓存解析失败:', e);
                    }
                }

                // 3. 后台静默获取最新数据
                try {
                    const { data, error } = await supabase
                        .from(CONFIG.TABLE_NAME)
                        .select('id, tag, title, info, created_at, updated_at')
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    // 更新数据和缓存
                    db = data || [];
                    localStorage.setItem('jlbj_cache', JSON.stringify(db));
                    localStorage.setItem('jlbj_cache_time', Date.now().toString());

                    // 重新渲染（保持搜索状态）
                    filterAndRender();
                    console.log('✓ 数据已更新');
                } catch (e) {
                    console.warn('后台数据加载失败:', e.message);
                    // 如果没有缓存且加载失败，显示错误
                    if (!cachedData) {
                        DOM.results.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;">加载失败，请刷新重试</div>';
                    }
                }
            }

            let realtimeChannel = null;

            function setupRealtimeSubscription() {
                // 如果已存在订阅，先取消
                if (realtimeChannel) {
                    supabase.removeChannel(realtimeChannel);
                }

                console.log('正在建立实时连接...');

                // 创建新的订阅通道
                realtimeChannel = supabase
                    .channel('jlbj_db_changes')
                    .on(
                        'postgres_changes',
                        {
                            event: '*', // 监听所有事件 (INSERT, UPDATE, DELETE)
                            schema: 'public',
                            table: CONFIG.TABLE_NAME
                        },
                        (payload) => {
                            console.log('📢 收到实时数据变更:', payload);
                            const { eventType, new: newRecord, old: oldRecord } = payload;

                            switch (eventType) {
                                case 'INSERT':
                                    handleRealtimeInsert(newRecord);
                                    break;
                                case 'UPDATE':
                                    handleRealtimeUpdate(newRecord);
                                    break;
                                case 'DELETE':
                                    handleRealtimeDelete(oldRecord);
                                    break;
                            }
                        }
                    )
                    .subscribe((status) => {
                        console.log(`📡 实时服务状态: ${status}`);
                        const indicator = document.getElementById('status-dot');

                        if (status === 'SUBSCRIBED') {
                            console.log('✓ 实时同步已就绪，正在监听数据变化...');
                            if (indicator) {
                                indicator.style.background = '#4caf50'; // 绿色
                                indicator.title = "实时同步在线";
                            }
                        } else if (status === 'CHANNEL_ERROR') {
                            console.error('✗ 实时连接发生错误');
                            if (indicator) {
                                indicator.style.background = '#f44336'; // 红色
                                indicator.title = "连接错误 - 请刷新重试";
                            }
                        } else if (status === 'CLOSED') {
                            if (indicator) {
                                indicator.style.background = '#7a7a8c'; // 灰色
                                indicator.title = "连接断开";
                            }
                        }
                    });
            }

            // ==================== 搜索过滤工具 ====================
            function filterAndRender() {
                const searchKey = DOM.input.value.trim();
                if (searchKey) {
                    const filtered = db.filter(i => {
                        const titleMatch = PinyinUtil.match(i.title, searchKey);

                        // 移除WEBAPP块后再搜索内容
                        const contentWithoutWebapp = i.info.replace(WEBAPP_PARSER.REGEX, '');
                        const infoMatch = contentWithoutWebapp && contentWithoutWebapp.toLowerCase().includes(searchKey.toLowerCase());

                        return titleMatch || infoMatch;
                    });
                    render(filtered, true, searchKey);
                } else {
                    render(db, false, '');
                }
            }

            /**
             * 高亮匹配的文本
             * @param {string} text - 原始文本
             * @param {string} keyword - 搜索关键词
             * @returns {string} 带高亮标记的HTML
             */
            function highlightText(text, keyword) {
                if (!keyword || !text) return text;

                const lowerText = text.toLowerCase();
                const lowerKey = keyword.toLowerCase();

                // 1. 尝试直接文本匹配
                let index = lowerText.indexOf(lowerKey);
                if (index !== -1) {
                    const before = text.substring(0, index);
                    const match = text.substring(index, index + lowerKey.length);
                    const after = text.substring(index + lowerKey.length);
                    return `${before}<span class="search-highlight">${match}</span>${after}`;
                }

                // 2. 尝试拼音全拼匹配
                if (PinyinUtil.isAvailable()) {
                    const { pinyin, initial } = PinyinUtil.generate(text);

                    // 全拼匹配
                    const pinyinIndex = pinyin.toLowerCase().indexOf(lowerKey);
                    if (pinyinIndex !== -1) {
                        // 计算匹配的字符位置
                        let currentPinyinLength = 0;

                        for (let i = 0; i < text.length; i++) {
                            const charPinyin = pinyinPro.pinyin(text[i], { toneType: 'none' });
                            if (currentPinyinLength + charPinyin.length > pinyinIndex) {
                                // 找到起始字符
                                let matchLength = 1;
                                let tempPinyinLength = currentPinyinLength + charPinyin.length;

                                // 计算需要高亮多少个字符
                                for (let j = i + 1; j < text.length && tempPinyinLength < pinyinIndex + lowerKey.length; j++) {
                                    const nextCharPinyin = pinyinPro.pinyin(text[j], { toneType: 'none' });
                                    tempPinyinLength += nextCharPinyin.length;
                                    matchLength++;
                                }

                                const before = text.substring(0, i);
                                const match = text.substring(i, i + matchLength);
                                const after = text.substring(i + matchLength);
                                return `${before}<span class="search-highlight">${match}</span>${after}`;
                            }
                            currentPinyinLength += charPinyin.length;
                        }
                    }

                    // 3. 简拼匹配
                    const initialIndex = initial.toLowerCase().indexOf(lowerKey);
                    if (initialIndex !== -1) {
                        const matchLength = lowerKey.length;
                        const before = text.substring(0, initialIndex);
                        const match = text.substring(initialIndex, initialIndex + matchLength);
                        const after = text.substring(initialIndex + matchLength);
                        return `${before}<span class="search-highlight">${match}</span>${after}`;
                    }
                }

                return text;
            }

            // 处理实时插入
            function handleRealtimeInsert(newItem) {
                // 避免重复添加
                if (db.find(item => item.id === newItem.id)) return;
                db.unshift(newItem);
                filterAndRender();
            }

            // 处理实时更新
            function handleRealtimeUpdate(updatedItem) {
                const index = db.findIndex(item => item.id === updatedItem.id);
                if (index !== -1) {
                    db[index] = updatedItem;
                    filterAndRender();
                }
            }

            // 处理实时删除
            function handleRealtimeDelete(deletedItem) {
                const index = db.findIndex(item => item.id === deletedItem.id);
                if (index !== -1) {
                    db.splice(index, 1);
                    filterAndRender();
                }
            }

            // ==================== WEBAPP 小程序解析和执行引擎 ====================

            /**
             * 解析单个 WEBAPP 块
             * @param {string} webappCode - WEBAPP块内的代码
             * @param {number} itemId - 所属笔记条目的ID
             * @param {number} blockIndex - 该条目中的第几个WEBAPP块
             * @returns {object} 解析后的结构化对象
             */
            function parseWebappBlock(webappCode, itemId, blockIndex) {
                const uniqueId = `${WEBAPP_PARSER.UNIQUE_PREFIX}${itemId}_${blockIndex}`;

                let html = '', css = '', js = '';

                // 提取 <style> 标签
                const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
                let styleMatch;
                while ((styleMatch = styleRegex.exec(webappCode)) !== null) {
                    css += styleMatch[1] + '\n';
                }

                // 提取 <script> 标签
                const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
                let scriptMatch;
                while ((scriptMatch = scriptRegex.exec(webappCode)) !== null) {
                    js += scriptMatch[1] + '\n';
                }

                // 移除style和script后，剩余的就是HTML
                html = webappCode
                    .replace(styleRegex, '')
                    .replace(scriptRegex, '')
                    .trim();

                return {
                    id: uniqueId,
                    html: html,
                    css: css,
                    js: js,
                    itemId: itemId,
                    blockIndex: blockIndex
                };
            }

            /**
             * 处理内容字符串，解析所有WEBAPP块
             * @param {string} content - 原始内容
             * @param {number} itemId - 笔记条目ID
             * @returns {object} { renderedContent, webappBlocks }
             */
            function processContentWithWebapps(content, itemId) {
                const webappBlocks = [];
                let blockIndex = 0;

                // 替换所有WEBAPP块为占位符，并收集解析结果
                const renderedContent = content.replace(WEBAPP_PARSER.REGEX, (match, webappCode) => {
                    const parsed = parseWebappBlock(webappCode, itemId, blockIndex);
                    webappBlocks.push(parsed);
                    blockIndex++;

                    // 返回占位容器
                    return `<div class="webapp-container" data-webapp-id="${parsed.id}"></div>`;
                });

                return { renderedContent, webappBlocks };
            }

            /**
             * 重写HTML中的ID，避免冲突
             * @param {string} html - 原始HTML
             * @param {string} scopeId - 唯一的作用域ID
             * @returns {object} { html, idMap } - 处理后的HTML和ID映射表
             */
            function rewriteHtmlIds(html, scopeId) {
                const idMap = {}; // 原始ID -> 新ID 的映射

                const processedHtml = html.replace(/\bid\s*=\s*["']([^"']+)["']/gi, (match, originalId) => {
                    const newId = `${scopeId}_${originalId}`;
                    idMap[originalId] = newId;
                    return `id="${newId}"`;
                });

                return { html: processedHtml, idMap };
            }

            /**
             * 处理CSS作用域隔离
             * @param {string} css - 原始CSS代码
             * @param {string} scopeId - 唯一的作用域ID
             * @returns {string} 带作用域前缀的CSS
             */
            function scopeCss(css, scopeId) {
                if (!css.trim()) return '';

                // 为每个选择器添加作用域前缀（限定到 .webapp-isolate 内部）
                const scopedCss = css.replace(/([^{}]+)\s*{/g, (match, selector) => {
                    // 跳过 @media, @keyframes 等规则
                    if (selector.trim().startsWith('@')) {
                        return match;
                    }

                    // 为每个逗号分隔的选择器添加前缀
                    const selectors = selector.split(',').map(s => {
                        s = s.trim();
                        // 特殊处理：body/html -> 直接替换为隔离容器
                        if (s === 'body' || s === 'html') {
                            return `.webapp-isolate[data-webapp-scope="${scopeId}"]`;
                        }
                        // 其他选择器：添加 .webapp-isolate 前缀
                        return `.webapp-isolate[data-webapp-scope="${scopeId}"] ${s}`;
                    }).join(', ');

                    return `${selectors} {`;
                });

                return scopedCss;
            }

            /**
             * 在隔离作用域中执行JavaScript
             * @param {string} jsCode - JavaScript代码
             * @param {string} scopeId - 作用域ID
             * @param {object} idMap - ID映射表
             * @param {HTMLElement} containerElement - 容器DOM元素
             */
            function executeIsolatedJs(jsCode, scopeId, idMap, containerElement) {
                if (!jsCode.trim()) return;

                // 重写代码中的 getElementById 调用
                let rewrittenJs = jsCode;

                // 替换 document.getElementById('xxx') 为新ID
                Object.keys(idMap).forEach(oldId => {
                    const regex = new RegExp(`getElementById\\s*\\(\\s*['"\`]${oldId}['"\`]\\s*\\)`, 'g');
                    rewrittenJs = rewrittenJs.replace(regex, `getElementById('${idMap[oldId]}')`);
                });

                // 创建隔离的执行环境
                try {
                    // 使用Function构造器创建闭包，限制全局污染
                    const isolatedFunction = new Function(
                        'container',
                        'scopeId',
                        `
            // 创建局部作用域的 $ 查询函数（可选）
            const $ = (selector) => container.querySelector(selector);
            const $$ = (selector) => container.querySelectorAll(selector);

            // 执行用户代码
            ${rewrittenJs}
            `
                    );

                    // 异步执行，避免阻塞主渲染
                    setTimeout(() => {
                        isolatedFunction(containerElement, scopeId);
                    }, 0);

                } catch (error) {
                    console.error(`[WEBAPP ${scopeId}] 执行错误:`, error);
                    containerElement.innerHTML += `<div style="color:#c47a9f;padding:10px;border:1px solid #c47a9f;margin-top:10px;">⚠ 小程序执行失败: ${error.message}</div>`;
                }
            }

            /**
             * 注册WEBAPP实例的清理函数
             */
            function registerWebappCleanup(scopeId, cleanupFn) {
                WEBAPP_INSTANCES.set(scopeId, { cleanup: cleanupFn });
            }

            /**
             * 清理特定WEBAPP实例
             */
            function cleanupWebapps(listItemElement) {
                const webappBlocks = JSON.parse(listItemElement.dataset.webappBlocks || '[]');

                webappBlocks.forEach(block => {
                    const instance = WEBAPP_INSTANCES.get(block.id);
                    if (instance && instance.cleanup) {
                        instance.cleanup();
                    }
                    WEBAPP_INSTANCES.delete(block.id);
                });
            }

            /**
             * 执行列表项中的所有WEBAPP
             * @param {HTMLElement} listItemElement - list-item元素
             */
            function executeWebapps(listItemElement) {
                const webappBlocks = JSON.parse(listItemElement.dataset.webappBlocks || '[]');
                if (!webappBlocks.length) return;

                webappBlocks.forEach(block => {
                    const container = listItemElement.querySelector(`[data-webapp-id="${block.id}"]`);
                    if (!container) return;

                    // 1. 处理HTML（ID重写）
                    const { html, idMap } = rewriteHtmlIds(block.html, block.id);

                    // 2. 创建隔离容器和包装器
                    container.setAttribute('data-webapp-scope', block.id);
                    container.className = 'webapp-container webapp-active';

                    // 创建隔离包装器，确保 1:1 显示
                    const isolateWrapper = document.createElement('div');
                    isolateWrapper.className = 'webapp-isolate';
                    isolateWrapper.setAttribute('data-webapp-scope', block.id); // 添加作用域属性
                    isolateWrapper.innerHTML = html;

                    // 清空容器并添加隔离包装器
                    container.innerHTML = '';
                    container.appendChild(isolateWrapper);

                    // 3. 注入作用域CSS（应用到隔离包装器内部）
                    if (block.css) {
                        const styleId = `style_${block.id}`;
                        let styleElement = document.getElementById(styleId);

                        if (!styleElement) {
                            styleElement = document.createElement('style');
                            styleElement.id = styleId;
                            document.head.appendChild(styleElement);
                        }

                        // CSS 作用域限定到 .webapp-isolate 内部
                        const scopedCssContent = scopeCss(block.css, block.id);
                        styleElement.textContent = scopedCssContent;
                    }

                    // 4. 执行隔离的JavaScript（传入隔离包装器作为容器）
                    executeIsolatedJs(block.js, block.id, idMap, isolateWrapper);

                    // 5. 注册清理函数
                    registerWebappCleanup(block.id, () => {
                        // 移除style标签
                        const styleElement = document.getElementById(`style_${block.id}`);
                        if (styleElement) styleElement.remove();

                        // 清空容器
                        container.innerHTML = '';
                        container.className = 'webapp-container';
                    });
                });
            }

            // ==================== 渲染函数 ====================
            // ==================== 渲染函数 ====================
            function render(list, showDate = false, searchKeyword = '') {
                if (!list.length) {
                    DOM.results.innerHTML = '<div style="color:var(--muted);padding-top:20px;">暂无数据</div>';
                    return;
                }

                // 第一步：生成基础HTML结构（带WEBAPP占位符）
                DOM.results.innerHTML = list.map(item => {
                    const { renderedContent, webappBlocks } = processContentWithWebapps(item.info, item.id);

                    // 高亮列表编号（如 1. 2. 3.）
                    const highlightedContent = renderedContent.replace(/(^|\n)(\d+)\./g, '$1<span style="color:var(--highlight);">$2.</span>');

                    // 将webappBlocks存储到元素的dataset中，供后续使用
                    const webappData = JSON.stringify(webappBlocks.map(b => ({
                        id: b.id,
                        html: b.html,
                        css: b.css,
                        js: b.js
                    })));

                    return `
        <div class="list-item" onclick="toggleExpand(this)" data-webapp-blocks='${webappData.replace(/'/g, '&apos;')}'>
            <div class="item-header">
                <span class="title">${searchKeyword ? highlightText(item.title, searchKeyword) : item.title}</span>
                <div>
                    ${showDate ? `<span style="font-size:12px;color:var(--muted);margin-right:8px;">${formatDate(item.created_at)}</span>` : ''}
                    <span class="tag">${item.tag || 'MISC'}</span>
                </div>
            </div>
            <div class="content" onclick="event.stopPropagation()">${highlightedContent}
                <button class="btn-delete" onclick="editItem(${item.id})">[ 编辑 ]</button>
            </div>
        </div>`;
                }).join('');
            }

            function toggleExpand(el) {
                const wasExpanded = el.classList.contains('expanded');
                el.classList.toggle('expanded');

                // 如果是展开操作，执行WEBAPP
                if (!wasExpanded) {
                    executeWebapps(el);
                } else {
                    // 收起时清理WEBAPP
                    cleanupWebapps(el);
                }
            }

            // ==================== 密码弹窗控制 ====================
            function showPasswordDialog() {
                return new Promise((resolve) => {
                    passwordResolve = resolve;
                    const overlay = document.getElementById('passwordOverlay');
                    const input = document.getElementById('passwordInput');
                    const error = document.getElementById('passwordError');

                    input.value = '';
                    error.style.display = 'none';
                    overlay.classList.add('active');
                    setTimeout(() => input.focus(), 100);
                });
            }

            function closePasswordDialog() {
                const overlay = document.getElementById('passwordOverlay');
                overlay.classList.remove('active');
                if (passwordResolve) {
                    passwordResolve(null);
                    passwordResolve = null;
                }
            }

            function confirmPassword() {
                const input = document.getElementById('passwordInput');
                const error = document.getElementById('passwordError');
                const password = input.value.trim();

                if (password === CONFIG.PASSWORD) {
                    // 先保存 resolve 引用
                    const resolveFunc = passwordResolve;
                    passwordResolve = null;

                    // 关闭弹窗
                    const overlay = document.getElementById('passwordOverlay');
                    overlay.classList.remove('active');

                    // 执行 resolve
                    if (resolveFunc) {
                        resolveFunc(password);
                    }
                } else {
                    // 显示错误状态
                    error.style.display = 'block';
                    input.value = '';
                    input.focus();

                    // 添加输入框抖动动画
                    input.style.animation = 'shake 0.3s';
                    setTimeout(() => {
                        input.style.animation = '';
                    }, 300);
                }
            }

            function handlePasswordOverlayClick(e) {
                if (e.target === document.getElementById('passwordOverlay')) {
                    closePasswordDialog();
                }
            }

            // 密码输入框回车键监听
            document.addEventListener('DOMContentLoaded', () => {
                const passwordInput = document.getElementById('passwordInput');
                if (passwordInput) {
                    passwordInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            confirmPassword();
                        } else if (e.key === 'Escape') {
                            closePasswordDialog();
                        }
                    });
                }
            });

            // ==================== 删除确认弹窗控制 ====================
            let confirmResolve = null;

            function showConfirmDialog() {
                return new Promise((resolve) => {
                    confirmResolve = resolve;
                    const overlay = document.getElementById('confirmOverlay');
                    overlay.classList.add('active');
                });
            }

            function closeConfirmDialog() {
                const overlay = document.getElementById('confirmOverlay');
                overlay.classList.remove('active');
                if (confirmResolve) {
                    confirmResolve(false);
                    confirmResolve = null;
                }
            }

            function confirmDelete() {
                const resolveFunc = confirmResolve;
                confirmResolve = null;

                const overlay = document.getElementById('confirmOverlay');
                overlay.classList.remove('active');

                if (resolveFunc) {
                    resolveFunc(true);
                }
            }

            function handleConfirmOverlayClick(e) {
                if (e.target === document.getElementById('confirmOverlay')) {
                    closeConfirmDialog();
                }
            }

            // ==================== 面板控制 ====================
            function togglePanel() {
                const active = DOM.overlay.classList.contains('active');
                if (active) {
                    DOM.overlay.classList.remove('active');
                    setTimeout(() => { if (!DOM.overlay.classList.contains('active')) clearForm(); }, 300);
                } else {
                    DOM.overlay.classList.add('active');
                    DOM.newTag.focus();
                }
            }
            window.handleOverlayClick = e => { if (e.target === DOM.overlay) togglePanel(); };
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && DOM.overlay.classList.contains('active')) togglePanel(); });

            function clearForm() {
                editingId = null;
                DOM.newTag.value = '';
                DOM.newTitle.value = '';
                DOM.newContent.innerHTML = '';
                DOM.lastModifiedDisplay.textContent = '';
            }

            // ==================== 保存与删除（乐观更新 + 实时同步） ====================
            async function saveData() {
                const tag = DOM.newTag.value.trim().toUpperCase();
                const title = DOM.newTitle.value.trim();
                const content = DOM.newContent.innerHTML.trim();
                if (!title || !content || content === '<br>') { alert('标题和内容不能为空'); return; }

                const pwd = await showPasswordDialog();
                if (!pwd) return;

                showLoading(editingId ? '正在更新...' : '正在保存...');

                try {
                    // 添加超时控制
                    const timeoutPromise = new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('请求超时')), 15000)
                    );

                    let promise;
                    if (editingId) {
                        promise = supabase
                            .from(CONFIG.TABLE_NAME)
                            .update({ tag: tag || CONFIG.DEFAULT_TAG, title, info: content })
                            .eq('id', editingId);
                    } else {
                        promise = supabase
                            .from(CONFIG.TABLE_NAME)
                            .insert([{ tag: tag || CONFIG.DEFAULT_TAG, title, info: content }]);
                    }

                    const { error } = await Promise.race([promise, timeoutPromise]);

                    if (error) throw error;

                    // 成功后仅关闭面板和遮罩，数据更新交给实时监听器处理
                    // localStorage缓存更新也交给实时监听器处理（如果需要严格一致性）
                    // 但为了体验流畅，这里只需关闭UI，等待数据自动刷新

                    hideLoading();
                    togglePanel();
                    clearForm();
                    DOM.input.focus();
                } catch (err) {
                    hideLoading();
                    alert('保存失败: ' + err.message + '\n\n请检查网络连接后重试');
                }
            }

            function editItem(id) {
                const item = db.find(i => i.id === id);
                if (!item) return;
                DOM.newTag.value = item.tag || '';
                DOM.newTitle.value = item.title;
                DOM.newContent.innerHTML = item.info;
                DOM.lastModifiedDisplay.textContent = formatDate(item.updated_at || item.created_at) ? `最后更新: ${formatDate(item.updated_at || item.created_at)}` : '';
                editingId = id;
                DOM.overlay.classList.add('active');
                DOM.newTag.focus();
            }

            async function deleteCurrentItem() {
                if (!editingId) { alert('没有正在编辑的条目'); return; }

                const confirmed = await showConfirmDialog();
                if (!confirmed) return;

                const pwd = await showPasswordDialog();
                if (!pwd) return;

                showLoading('正在删除...');

                try {
                    const timeoutPromise = new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('请求超时')), 15000)
                    );

                    const deletePromise = supabase
                        .from(CONFIG.TABLE_NAME)
                        .delete()
                        .eq('id', editingId);

                    const { error } = await Promise.race([deletePromise, timeoutPromise]);

                    if (error) throw error;

                    // 成功后仅关闭面板，数据更新交给实时监听器
                    hideLoading();
                    togglePanel();
                    clearForm();
                } catch (err) {
                    hideLoading();
                    alert('删除失败: ' + err.message + '\n\n请检查网络连接后重试');
                }
            }

            // ==================== 其他辅助函数 ====================
            function setupTextareaAutoResize() {
                const textarea = DOM.newContent;
                const minHeight = 120;
                const maxHeight = window.innerHeight * 0.6;
                const resize = () => {
                    textarea.style.height = 'auto';
                    textarea.style.height = Math.max(minHeight, Math.min(textarea.scrollHeight, maxHeight)) + 'px';
                };
                textarea.addEventListener('input', resize);
                resize();
            }

            function setupSearch() {
                DOM.input.addEventListener('input', () => filterAndRender());
            }

            function init() {
                initDOM();
                initDB();
                setupSearch();
            }

            // Expose critical functions to window scope for HTML onclick handlers
            window.saveData = saveData;
            window.togglePanel = togglePanel;
            window.deleteCurrentItem = deleteCurrentItem;
            window.editItem = editItem;
            window.toggleExpand = toggleExpand;
            window.handlePasswordOverlayClick = handlePasswordOverlayClick;
            window.closePasswordDialog = closePasswordDialog;
            window.confirmPassword = confirmPassword;
            window.handleConfirmOverlayClick = handleConfirmOverlayClick;
            window.closeConfirmDialog = closeConfirmDialog;
            window.confirmDelete = confirmDelete;
            window.handleOverlayClick = handleOverlayClick;

            // 监听 DOM 加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        } // 结束 else 块（防止重复初始化）
    </script>
</body>

</html>
