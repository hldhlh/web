        function renderLocations(availableLocs = null) {
            let locsSource = availableLocs || new Set(getAllLocations());
            const locs = ['全部', ...[...locsSource].sort((a, b) => a.localeCompare(b, 'zh'))];

            // 如果当前选中的定位在可用列表中消失了，自动重置为“全部”
            if (state.currentLocation !== '全部' && !locsSource.has(state.currentLocation)) {
                state.currentLocation = '全部';
            }

            document.getElementById('locationList').innerHTML = locs.map(l =>
                `<button class="loc-btn ${l === state.currentLocation ? 'active' : ''}" onclick="filterLoc('${l}')">${l}</button>`
            ).join('');
        }

        window.filterLoc = cat => {
            state.currentLocation = cat;
            renderProducts(); // renderProducts 会处理 renderLocations 的更新
        };

        function renderTags(availableTags = null) {
            let tagsSource = availableTags || new Set(state.products.flatMap(p => p.tags || []).filter(t => t && t.trim()));
            const allTags = [...tagsSource].sort((a, b) => a.localeCompare(b, 'zh'));

            // 自动清理不再可用的已选标签
            if (state.activeTags.size > 0) {
                state.activeTags.forEach(tag => {
                    if (!tagsSource.has(tag)) state.activeTags.delete(tag);
                });
            }

            const container = document.getElementById('tagFilterList');
            const titles = document.querySelectorAll('.filter-section-title');

            if (allTags.length === 0) {
                container.style.display = 'none';
                if (titles[0]) titles[0].style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            if (titles[0]) titles[0].style.display = 'flex';
            container.innerHTML = allTags.map(tag => `
                <div class="tag-chip ${state.activeTags.has(tag) ? 'active' : ''}" onclick="toggleTagFilter('${tag}')">
                    ${tag}
                </div>
            `).join('');
        }

        window.toggleTagFilter = (tag) => {
            if (state.activeTags.has(tag)) state.activeTags.delete(tag);
            else state.activeTags.add(tag);
            renderProducts(); // renderProducts 会处理 renderTags 的更新
        };

        function renderProducts() {
            let base = [...state.products];

            // 1. 基础过滤 (搜索)
            if (state.searchQuery) {
                const q = state.searchQuery.toLowerCase();
                base = base.filter(p => {
                    const nameMatch = p.name.toLowerCase().includes(q);
                    const pinyinMatch = p.pinyin && p.pinyin.toLowerCase().includes(q);
                    const locMatch = p.location && p.location.toLowerCase().includes(q);
                    return nameMatch || pinyinMatch || locMatch;
                });
            }

            // 2. 交互式过滤响应 (定位按钮 受 搜索+已选标签 影响)
            let locContext = [...base];
            const activeTagsArray = Array.from(state.activeTags);
            if (activeTagsArray.length > 0) {
                locContext = locContext.filter(p => p.tags && activeTagsArray.every(t => p.tags.includes(t)));
            }
            const availableLocs = new Set(locContext.map(p => (p.location || '').trim()).filter(l => l));
            renderLocations(availableLocs);

            // 3. 标签显示逻辑：始终显示所有可用的标签 (定位不影响标签显示)
            const availableTags = new Set(base.flatMap(p => p.tags || []).filter(t => t && t.trim()));
            renderTags(availableTags);

            // 4. 最终显示的商品列表
            let f = [...locContext];
            if (state.currentLocation !== '全部') {
                f = f.filter(p => (p.location || '').trim() === state.currentLocation.trim());
            }

            // 5. 排序逻辑
            if (state.sortBy === 'location') {
                f.sort((a, b) => {
                    const locA = (a.location || '').trim();
                    const locB = (b.location || '').trim();
                    return locA.localeCompare(locB, 'zh') || a.name.localeCompare(b.name, 'zh');
                });
            } else {
                f.sort((a, b) => {
                    const tA = (a.tags && a.tags[0]) || 'zzzz';
                    const tB = (b.tags && b.tags[0]) || 'zzzz';
                    return tA.localeCompare(tB, 'zh') || a.name.localeCompare(b.name, 'zh');
                });
            }

            document.getElementById('productList').innerHTML = f.map(p => {
                const qty = state.orders[p.id]?.qty || '';
                const tagsHtml = (p.tags || []).map(t => `<span class="tag-badge">${t}</span>`).join('');
                const historyLabel = getHistoryLabel(p.last_purchased_date);
                const historyBadgeHtml = historyLabel ? `<span class="history-badge"><i class="fas fa-history"></i> ${historyLabel}</span>` : '';
                const prediction = state.predictions[p.id];
                const predictionHtml = prediction && !qty ? getPredictionHintHtml(p, prediction) : '';
                const qtyPlaceholder = '0';
                return `
                <div class="product-card" data-id="${p.id}" 
                    onmousedown="startLongPress(${p.id}, event)" 
                    onmouseup="cancelLongPress()" 
                    onmouseleave="cancelLongPress()"
                    ontouchstart="startLongPress(${p.id}, event)" 
                    ontouchmove="cancelLongPress()"
                    ontouchend="cancelLongPress()" 
                    ontouchcancel="cancelLongPress()">
                    <div style="flex:1;">
                        <div style="font-weight:700;font-size:17px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
                            ${p.name}
                            <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                                ${tagsHtml}
                                ${historyBadgeHtml}
                            </div>
                        </div>
                        <div class="product-location-tag">
                            <i class="fas fa-location-arrow"></i> ${p.location}
                        </div>
                        ${predictionHtml}
                    </div>
                    <div id="wrapper-${p.id}" class="qty-control">
                        <button class="icon-btn" style="width:32px;height:32px;background:none;" onclick="updateQty(${p.id}, -1)">−</button>
                        <input type="number" class="card-input-small" style="width:50px;text-align:center;background:none;padding:0;" value="${qty}" placeholder="${qtyPlaceholder}" onchange="onQtyChange(${p.id}, this.value)">
                        <button class="icon-btn" style="width:32px;height:32px;background:none;" onclick="updateQty(${p.id}, 1)">+</button>
                    </div>
                    <span style="margin-left:8px;font-size:14px;color:var(--text-sub);min-width:20px;">${p.unit || '斤'}</span>
                </div>`;
            }).join('');
        }



        function setupRealtime() {
            setGlobalSyncStatus('connecting');

            // 创建统一的实时订阅通道
            const channel = sb.channel('realtime_sync', {
                config: {
                    broadcast: { self: false } // 不接收自己发送的消息
                }
            });

            // 监听购物车变化
            channel.on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'jlhcdh_cart'
            }, async (payload) => {
                const now = Date.now();

                // 如果在跳过时间窗口内，忽略此事件（自己的操作触发的）
                if (now < state.skipRealtimeUntil) {
                    console.log('📦 跳过自己的实时事件');
                    return;
                }

                console.log('📦 收到远程购物车变化:', payload.eventType, payload.new || payload.old);
                showReceiving();

                // 获取变化数据的日期
                const changedDate = payload.new?.order_date || payload.old?.order_date;
                const changedProductId = payload.new?.product_id || payload.old?.product_id;

                // 只有当变化的日期匹配当前选择的日期时，才处理
                if (changedDate === state.currentDate) {
                    // 增量更新：只更新变化的商品，不重新加载整个列表
                    if (payload.eventType === 'UPDATE' && payload.new) {
                        // 更新本地状态
                        if (state.orders[changedProductId]) {
                            state.orders[changedProductId].qty = parseFloat(payload.new.quantity);
                            state.orders[changedProductId].purchased = payload.new.is_purchased;
                        }

                        // 更新 cartItems 状态
                        const cartItem = state.cartItems.find(item => item.id === changedProductId);
                        if (cartItem) {
                            cartItem.qty = parseFloat(payload.new.quantity);
                            cartItem.is_purchased = payload.new.is_purchased;
                        }

                        // 增量更新首页 UI（产品卡片）
                        const qtyInput = document.querySelector(`.product-card[data-id="${changedProductId}"] input`);
                        if (qtyInput && document.activeElement !== qtyInput) {
                            qtyInput.value = payload.new.quantity;
                        }

                        // 增量更新核对页 UI（聚合列表）
                        const checkbox = document.getElementById(`check-${changedProductId}`);
                        if (checkbox) {
                            checkbox.checked = payload.new.is_purchased;
                            const aggItem = checkbox.closest('.agg-item');
                            if (aggItem) {
                                aggItem.classList.toggle('checked', payload.new.is_purchased);
                                // 更新数量显示
                                const qtySpan = aggItem.querySelector('.agg-qty');
                                if (qtySpan) qtySpan.textContent = payload.new.quantity;
                                const qtyInputAgg = aggItem.querySelector('.qty-control input');
                                if (qtyInputAgg && document.activeElement !== qtyInputAgg) {
                                    qtyInputAgg.value = payload.new.quantity;
                                }
                            }
                        }

                        // 更新底部计数
                        updateFooter();
                    } else {
                        // INSERT 或 DELETE 需要重新加载
                        await fetchCart();
                        renderProducts();
                        if (document.getElementById('ordersPage').classList.contains('active')) {
                            fetchDayData();
                        }
                    }
                }

                // 日历标记始终更新
                await refreshCalendarMarkers();
            });

            // 监听产品变化
            channel.on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'jlhcdh_products'
            }, async (payload) => {
                const now = Date.now();

                // 如果在跳过时间窗口内，忽略此事件
                if (now < state.skipRealtimeUntil) {
                    console.log('🏷️ 跳过自己的产品变更事件');
                    return;
                }

                console.log('🏷️ 收到远程产品变化:', payload.eventType, payload.new || payload.old);
                showReceiving();

                const changedProductId = payload.new?.id || payload.old?.id;

                if (payload.eventType === 'UPDATE' && payload.new && !payload.new.is_deleted) {
                    // 增量更新：更新本地产品数据
                    const productIndex = state.products.findIndex(p => p.id === changedProductId);
                    if (productIndex > -1) {
                        // 保留 pinyin 字段和 last_purchased_date 字段，更新其他字段
                        const oldPinyin = state.products[productIndex].pinyin;
                        const oldLastPurchasedDate = state.products[productIndex].last_purchased_date;
                        state.products[productIndex] = {
                            ...payload.new,
                            last_purchased_date: oldLastPurchasedDate,
                            pinyin: oldPinyin || (window.pinyinPro ? window.pinyinPro.pinyin(payload.new.name, { pattern: 'first', toneType: 'none' }).replace(/\s/g, '') : '')
                        };

                        // 获取产品卡片
                        const card = document.querySelector(`.product-card[data-id="${changedProductId}"]`);
                        if (card) {
                            // 更新名称
                            const nameEl = card.querySelector('.product-name') || card.querySelector('div[style*="font-weight:700"]');
                            if (nameEl) nameEl.childNodes[0].textContent = payload.new.name + ' ';

                            // 更新单位
                            const unitEl = card.querySelector('span[style*="margin-left:8px"]');
                            if (unitEl) unitEl.textContent = payload.new.unit || '斤';
                        }

                        // 更新核对页中的名称
                        const aggName = document.querySelector(`.agg-item #check-${changedProductId}`)?.closest('.agg-item')?.querySelector('.agg-name');
                        if (aggName) aggName.textContent = payload.new.name;

                        // 如果有定位或标签变化，可能需要重新过滤列表
                        if (state.currentLocation !== '全部' || state.activeTags.size > 0) {
                            // 延迟一小会儿刷新，避免频繁抖动
                            clearTimeout(window.renderTimer);
                            window.renderTimer = setTimeout(renderProducts, 300);
                        }
                    } else {
                        // 以前不在本地活跃列表中（之前已被软删，现从回收站恢复），需重新获取商品数据并刷新列表
                        await fetchProducts();
                        renderProducts();
                        renderLocations();
                        renderTags();
                        if (document.getElementById('adminPage').classList.contains('active')) {
                            renderAdminTable();
                        }
                    }

                    // 管理后台如果打开则刷新
                    if (document.getElementById('adminPage').classList.contains('active')) {
                        renderAdminTable();
                    }
                } else {
                    // INSERT 或 DELETE 需要完全重新加载
                    await fetchProducts();
                    renderProducts();
                    renderLocations();
                    renderTags();
                    if (document.getElementById('adminPage').classList.contains('active')) {
                        renderAdminTable();
                    }
                }
            });

            // 监听历史订单变化
            channel.on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'jlhcdh_orders'
            }, async (payload) => {
                console.log('📋 订单数据变化:', payload.eventType);
                showReceiving();
                await refreshCalendarMarkers();
                // 如果变化的日期是当前选择的日期，重新加载
                if (document.getElementById('ordersPage').classList.contains('active')) {
                    await fetchCart();
                    fetchDayData();
                }
            });

            // --- 中国区网络专项优化：快速响应降级 ---
            // 如果 3秒内 实时订阅没变成 SUBSCRIBED，直接先行启动 HTTP 轮询，不让用户等待
            state.realtimeConnectTimer = setTimeout(() => {
                if (!state.realtimeConnected) {
                    console.log('🌐 中国区网络检测：实时连接较慢，已先行启动 HTTP 稳健同步');
                    startPollingFallback();
                }
            }, 3000);

            // 订阅并监听连接状态
            channel.subscribe((status) => {
                console.log('🔌 实时连接状态:', status);
                if (status === 'SUBSCRIBED') {
                    if (state.realtimeConnectTimer) clearTimeout(state.realtimeConnectTimer);
                    state.realtimeConnected = true;
                    state.realtimeRetryCount = 0; // 连接成功，重置重试计数
                    setGlobalSyncStatus('online');
                    if (window.stopPollingFallback) stopPollingFallback();
                    console.log('✅ 实时订阅已建立');
                } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
                    if (state.realtimeConnectTimer) clearTimeout(state.realtimeConnectTimer);
                    state.realtimeConnected = false;
                    setGlobalSyncStatus('disconnected');

                    // 检查是否超过最大重试次数
                    if (state.realtimeRetryCount >= state.maxRealtimeRetries) {
                        console.log('⚠️ 已达到最大重试次数，自动切换至 HTTP 稳定轮询降级模式。');
                        if (window.startPollingFallback) startPollingFallback();
                        return;
                    }

                    state.realtimeRetryCount++;
                    console.log(`❌ 实时连接已断开，${state.realtimeRetryCount}/${state.maxRealtimeRetries} 次重试...`);

                    // 递增延迟重连 (5s, 10s, 15s...)
                    const retryDelay = 5000 * state.realtimeRetryCount;
                    setTimeout(() => {
                        if (!state.realtimeConnected) {
                            reconnectRealtime();
                        }
                    }, retryDelay);
                }
            });

            state.realtimeChannels.push(channel);
        }

        // --- HTTP 轮询备用方案（保护中国区网络阻断） ---
        let pollingInterval = null;
        window.startPollingFallback = function () {
            if (pollingInterval) return;
            state.pollingFallbackActive = true;
            setGlobalSyncStatus('polling');
            console.log('🔄 启动强制 8秒 HTTP 轮询同步机制');
            pollingInterval = setInterval(async () => {
                if (state.realtimeConnected) {
                    window.stopPollingFallback();
                    return;
                }
                const now = Date.now();
                if (now < state.skipRealtimeUntil) return;

                showReceiving();
                try {
                    await fetchCart();
                    if (document.getElementById('ordersPage').classList.contains('active')) {
                        fetchDayData();
                    } else if (document.getElementById('indexPage').classList.contains('active')) {
                        await fetchProducts();
                        await fetchOrderPredictions();
                        renderProducts();
                    }
                    await refreshCalendarMarkers();
                } catch (e) {
                    console.error('HTTP轮询同步失败', e);
                }
            }, 8000); // 8秒一次
        };

        window.stopPollingFallback = function () {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
                state.pollingFallbackActive = false;
                console.log('⏹️ WebSocket恢复，停用 HTTP 轮询');
            }
        };

        // 重新连接实时订阅
        async function reconnectRealtime(forceRetry = false) {
            // 如果是手动重试，重置计数器
            if (forceRetry) {
                state.realtimeRetryCount = 0;
            }

            console.log('🔄 正在重新连接...');
            setGlobalSyncStatus('connecting');

            // 移除旧订阅（静默处理错误）
            try {
                for (const ch of state.realtimeChannels) {
                    await sb.removeChannel(ch).catch(() => { });
                }
            } catch (e) {
                console.log('清理旧连接时出错（可忽略）:', e);
            }
            state.realtimeChannels = [];

            // 重新建立订阅
            setupRealtime();

            // 同时刷新所有数据
            await fetchProducts();
            await fetchCart();
            await fetchOrderPredictions();
            await refreshCalendarMarkers();
            renderProducts();
            renderLocations();
            renderTags();
        }

        // 给状态指示灯添加点击事件（点击重连）
        function setupStatusIndicatorClick() {
            document.querySelectorAll('.sync-status').forEach(el => {
                el.onclick = async () => {
                    if (!state.realtimeConnected || el.classList.contains('error') || el.classList.contains('disconnected')) {
                        showToast('正在重新连接...');
                        await reconnectRealtime(true); // 手动重试，重置计数器
                    } else {
                        showToast(el.title);
                    }
                };
            });
        }

        // 刷新日历标记的辅助函数
        async function refreshCalendarMarkers() {
            await fetchHistoryDates();
            if (state.fpIndex) state.fpIndex.redraw();
            if (state.fpOrders) state.fpOrders.redraw();
            // 在状态栏旁边显示一个小提示
            const statusEl = document.getElementById('syncStatus');
            if (statusEl) {
                statusEl.classList.add('receiving');
                setTimeout(() => statusEl.classList.remove('receiving'), 1000);
            }
        }

        function getLocalBusinessDate() {
            const n = new Date();
            const y = n.getFullYear();
            const m = String(n.getMonth() + 1).padStart(2, '0');
            const d = String(n.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getHistoryLabel(lastDateStr) {
            if (!lastDateStr) return '';
            const todayStr = getLocalBusinessDate();
            if (lastDateStr === todayStr) return '今天买过';
            const today = new Date(todayStr);
            const lastDate = new Date(lastDateStr);
            const diffTime = today.getTime() - lastDate.getTime();
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays === 1) return '昨天买过';
            if (diffDays === 2) return '前天买过';
            if (diffDays > 2) return `${diffDays}天前买过`;
            return '';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function updateSyncUI(id, s, isCheckbox = false) {
            const selector = isCheckbox ? `check-${id}` : `wrapper-${id}`;
            const el = document.getElementById(selector);
            if (!el) return;
            el.classList.remove('status-syncing', 'status-saved', 'status-error');
            if (s) el.classList.add(`status-${s}`);
        }

        function updateFooter() {
            const el = document.getElementById('selectedCount');
            if (el) el.innerText = Object.keys(state.orders).length;
        }

        // ========== 深色模式功能 ==========
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
            updateDarkModeIcon();
            showToast(isDark ? '已切换到深色模式' : '已切换到浅色模式');
        }

        function updateDarkModeIcon() {
            const btn = document.getElementById('darkModeBtn');
            if (btn) {
                const icon = btn.querySelector('i');
                if (document.body.classList.contains('dark-mode')) {
                    icon.className = 'fas fa-sun';
                } else {
                    icon.className = 'fas fa-moon';
                }
            }
        }

        function initDarkMode() {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-mode');
            }
            updateDarkModeIcon();
        }

        // ========== 批量全选/取消 ==========
        async function batchSelectAll() {
            if (state.cartItems.length === 0) {
                showToast('无订货项目');
                return;
            }

            const uncheckedItems = state.cartItems.filter(item => !item.is_purchased);
            if (uncheckedItems.length === 0) {
                showToast('所有项目已勾选');
                return;
            }

            state.skipRealtimeUntil = Date.now() + 10000;
            startSync();

            const progress = document.getElementById('batchProgress');
            let completed = 0;

            try {
                for (const item of uncheckedItems) {
                    await sb.from('jlhcdh_cart')
                        .update({
                            is_purchased: true,
                            updated_at: new Date().toISOString()
                        })
                        .eq('product_id', item.id)
                        .eq('order_date', state.currentDate);

                    // 更新本地状态
                    if (state.orders[item.id]) {
                        state.orders[item.id].purchased = true;
                    }
                    item.is_purchased = true;

                    completed++;
                    progress.style.width = `${(completed / uncheckedItems.length) * 100}%`;
                }

                renderSummary();
                progress.style.width = '0%';
                showToast(`已勾选 ${uncheckedItems.length} 项`);
                endSync();
            } catch (e) {
                console.error('批量勾选失败:', e);
                showToast('操作失败');
                progress.style.width = '0%';
                endSync(true);
            }
        }

        async function batchDeselectAll() {
            if (state.cartItems.length === 0) {
                showToast('无订货项目');
                return;
            }

            const checkedItems = state.cartItems.filter(item => item.is_purchased);
            if (checkedItems.length === 0) {
                showToast('所有项目已取消勾选');
                return;
            }

            state.skipRealtimeUntil = Date.now() + 10000;
            startSync();

            const progress = document.getElementById('batchProgress');
            let completed = 0;

            try {
                for (const item of checkedItems) {
                    await sb.from('jlhcdh_cart')
                        .update({
                            is_purchased: false,
                            updated_at: new Date().toISOString()
                        })
                        .eq('product_id', item.id)
                        .eq('order_date', state.currentDate);

                    // 更新本地状态
                    if (state.orders[item.id]) {
                        state.orders[item.id].purchased = false;
                    }
                    item.is_purchased = false;

                    completed++;
                    progress.style.width = `${(completed / checkedItems.length) * 100}%`;
                }

                renderSummary();
                progress.style.width = '0%';
                showToast(`已取消 ${checkedItems.length} 项`);
                endSync();
            } catch (e) {
                console.error('批量取消失败:', e);
                showToast('操作失败');
                progress.style.width = '0%';
                endSync(true);
            }
        }

        // ========== 导出订货单为图片 ==========
        async function exportOrderImage() {
            if (state.cartItems.length === 0) {
                showToast('无订货记录可导出');
                return;
            }

            showToast('正在生成图片...');

            // 准备导出内容
            const exportPreview = document.getElementById('exportPreview');
            const exportDate = document.getElementById('exportDate');
            const exportItems = document.getElementById('exportItems');
            const exportTime = document.getElementById('exportTime');

            // 格式化日期
            const dateObj = new Date(state.currentDate);
            const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            exportDate.textContent = `${state.currentDate} ${weekDays[dateObj.getDay()]}`;

            // 生成条目
            exportItems.innerHTML = state.cartItems.map(item => `
                <div class="export-item">
                    <span class="export-name">${item.name}</span>
                    <span class="export-qty">${item.qty} ${item.unit || '斤'}</span>
                </div>
            `).join('');

            // 生成时间
            const now = new Date();
            exportTime.textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            // 将容器移到可见位置
            exportPreview.style.left = '0';

            try {
                // 使用 html2canvas 生成图片
                const canvas = await html2canvas(exportPreview, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false
                });

                // 隐藏导出容器
                exportPreview.style.left = '-9999px';

                // 转换为图片并下载
                const link = document.createElement('a');
                link.download = `订货单_${state.currentDate}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('图片已保存');
            } catch (e) {
                console.error('导出失败:', e);
                exportPreview.style.left = '-9999px';
                showToast('导出失败');
            }
        }

        // 初始化时加载深色模式设置
        initDarkMode();

        init();
    </script>
</body>

</html>
