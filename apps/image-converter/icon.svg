<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>图片格式转换</title>
  <desc>两张交叠的极简图片卡片，表示图片格式转换</desc>

  <!-- App tile -->
  <rect x="7" y="7" width="86" height="86" rx="24" fill="#111111"/>

  <!-- Source image -->
  <rect x="34" y="22" width="46" height="43" rx="7" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Converted image -->
  <rect x="20" y="34" width="48" height="44" rx="7" fill="#FFFFFF"/>
  <circle cx="32" cy="46" r="4" fill="#111111"/>
  <path d="M25 70L36 57.5L44 65L52 56L63 70H25Z" fill="#111111"/>
</svg>
