<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记账</title>
  <!-- Supabase JS Library -->
  <script src="../vendor/supabase.min.js"></script>
  <script src="../network.js"></script>
  <style>
    :root {
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Light Theme Variables */
      --bg-color: #f6f8fa;
      --bg-card: rgba(255, 255, 255, 0.7);
      --bg-input: #f1f3f6;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: rgba(226, 232, 240, 0.6);
      --shadow-color: rgba(148, 163, 184, 0.08);
      --card-blur: 20px;

      /* Colors */
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --income: #10b981;
      --expense: #ef4444;
      --income-bg: rgba(16, 185, 129, 0.08);
      --expense-bg: rgba(239, 68, 68, 0.08);
      --public-color: #3b82f6;
      --public-bg: rgba(59, 130, 246, 0.08);
      --private-color: #8b5cf6;
      --private-bg: rgba(139, 92, 246, 0.08);
    }

    [data-theme="dark"] {
      /* Dark Theme Variables */
      --bg-color: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-input: #1f2937;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --border-color: rgba(37, 99, 235, 0.1);
      --shadow-color: rgba(0, 0, 0, 0.2);

      --primary: #f9fafb;
      --primary-hover: #e5e7eb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbars globally */
    ::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
      transition: background-color 0.4s ease, color 0.4s ease;
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    .app-layout {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Top Minimal Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.25rem;
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .btn-icon:hover {
      transform: scale(1.05);
      background: var(--bg-input);
    }

    /* Dashboard Card (Summary) */
    .dashboard {
      background: var(--bg-card);
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 2rem;
      box-shadow: 0 12px 30px var(--shadow-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.5rem;
    }

    .scope-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 2px 8px var(--shadow-color);
    }

    .time-selector {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .time-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      transition: all 0.2s ease;
      position: relative;
    }

    .time-btn.active {
      color: var(--text-primary);
      font-weight: 700;
    }

    .time-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0.4rem;
      right: 0.4rem;
      height: 2px;
      background: var(--text-primary);
      border-radius: 2px;
      animation: expandLine 0.2s ease forwards;
    }

    @keyframes expandLine {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

    .balance-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .balance-value {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0.2rem 0;
    }

    .summary-row {
      display: flex;
      width: 100%;
      justify-content: space-around;
      border-top: 1px solid var(--border-color);
      padding-top: 1.25rem;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .summary-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .summary-val {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .summary-val.income {
      color: var(--income);
    }

    .summary-val.expense {
      color: var(--expense);
    }

    /* Floating Action Button for Adding Transaction */
    .fab {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: var(--text-primary);
      color: var(--bg-color);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--shadow-color);
      transition: all 0.25s ease;
      z-index: 90;
    }

    .fab:hover {
      transform: translateX(-50%) scale(1.08) translateY(-2px);
      box-shadow: 0 12px 30px var(--shadow-color);
    }

    .fab:active {
      transform: translateX(-50%) scale(0.95);
    }

    /* Modal / Bottom Sheet Drawer */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--bg-card);
      width: 100%;
      max-width: 520px;
      border-radius: 32px 32px 0 0;
      padding: 2rem 1.5rem;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      border: 1px solid var(--border-color);
      border-bottom: none;
    }

    @media (min-width: 600px) {
      .modal-backdrop {
        align-items: center;
      }

      .modal-content {
        border-radius: 28px;
        border: 1px solid var(--border-color);
        transform: translateY(50px) scale(0.95);
        opacity: 0;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      }

      .modal-backdrop.active .modal-content {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .modal-backdrop.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Modal Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .amount-input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .amount-symbol {
      position: absolute;
      left: 0.5rem;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .amount-input {
      width: 100%;
      border: none;
      border-bottom: 2px solid var(--border-color);
      background: transparent;
      padding: 0.5rem 0.5rem 0.5rem 2.2rem;
      font-family: var(--font-display);
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .amount-input:focus {
      border-color: var(--text-primary);
    }

    /* Hide Chrome/Safari/Edge/Opera spin buttons */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Hide Firefox spin buttons */
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* Segmented selector */
    .segmented {
      display: flex;
      background: var(--bg-input);
      border-radius: 12px;
      padding: 2px;
    }

    .segmented-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .segmented-btn.active[data-type="expense"] {
      background: var(--expense-bg);
      color: var(--expense);
    }

    .segmented-btn.active[data-type="income"] {
      background: var(--income-bg);
      color: var(--income);
    }

    /* Category selection pill box */
    .category-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.25rem;
    }

    .category-pill {
      padding: 0.45rem 0.9rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
      color: var(--text-secondary);
    }

    .category-pill:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .category-pill.active {
      background: var(--text-primary);
      color: var(--bg-color);
      border-color: var(--text-primary);
    }

    .pill-icon {
      width: 14px;
      height: 14px;
      display: inline-flex;
    }

    .pill-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
    }



    .text-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .text-input:focus {
      border-color: var(--text-primary);
    }

    /* Custom Calendar Style */
    .calendar-dropdown {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      right: 0;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1rem;
      box-shadow: 0 -12px 30px var(--shadow-color), 0 12px 30px var(--shadow-color);
      z-index: 120;
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .calendar-month-year {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    .calendar-nav-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .calendar-nav-btn:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-primary);
      user-select: none;
    }

    .calendar-day:hover {
      background: var(--bg-card);
    }

    .calendar-day.other-month {
      color: var(--text-secondary);
      opacity: 0.25;
    }

    .calendar-day.selected {
      background: var(--text-primary);
      color: var(--bg-color);
      font-weight: 700;
    }

    .calendar-day.today {
      border: 1.5px solid var(--text-primary);
    }

    .calendar-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.8rem;
      border-top: 1px solid var(--border-color);
      padding-top: 0.6rem;
    }

    .calendar-footer-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .calendar-footer-btn:hover {
      background: var(--bg-card);
    }

    .btn-save {
      background: var(--text-primary);
      color: var(--bg-color);
      padding: 0.8rem;
      border-radius: 14px;
      border: none;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    /* Grouped Transaction List */
    .transactions-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding-bottom: 5rem;
    }

    .date-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .date-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      padding: 0 0.5rem;
      margin-top: 0.25rem;
      display: flex;
      justify-content: space-between;
    }

    .tx-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 0.85rem 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      position: relative;
      transition: all 0.2s;
      animation: animFadeIn 0.3s ease forwards;
    }

    .tx-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--shadow-color);
      border-color: rgba(0, 0, 0, 0.15);
    }

    .tx-item.deleting {
      opacity: 0;
      transform: scale(0.9) translateX(20px);
    }

    @keyframes animFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tx-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      background: var(--bg-input);
      flex-shrink: 0;
    }

    .tx-icon-box svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .tx-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }

    .tx-top-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tx-category {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .tx-note {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .tx-value {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .tx-value.income {
      color: var(--income);
    }

    .tx-value.expense {
      color: var(--text-primary);
    }

    .tx-del {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, color 0.2s;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .tx-item:hover .tx-del {
      opacity: 1;
    }

    .tx-del:hover {
      color: var(--expense);
      background: var(--expense-bg);
    }

    /* Minimalist Category Analysis drawer trigger */
    .analysis-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      border-bottom: 1px dashed var(--border-color);
      margin-top: -0.5rem;
    }

    .analysis-trigger:hover {
      color: var(--text-primary);
    }

    .analysis-trigger-title {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .analysis-drawer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0 0.5rem;
    }

    .analysis-drawer.active {
      max-height: 250px;
      margin-bottom: 0.5rem;
    }

    .analysis-bar-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .analysis-bar-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 500;
    }

    .analysis-progress-bg {
      height: 4px;
      background: var(--bg-input);
      border-radius: 2px;
      overflow: hidden;
    }

    .analysis-progress-fill {
      height: 100%;
      background: var(--text-primary);
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .empty-state-icon {
      width: 42px;
      height: 42px;
      opacity: 0.35;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1f2937;
      color: white;
      padding: 0.65rem 1.25rem;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      font-size: 0.8rem;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      background: var(--income);
    }

    .toast.error {
      background: var(--expense);
    }
  </style>
</head>

<body>
  <div class="app-layout">

    <!-- Top Navigation Header -->
    <header class="header">
      <a href="../../index.html" class="btn-icon" title="返回首页" style="text-decoration:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </a>
      <h1>记账</h1>
      <button id="theme-toggle-btn" class="btn-icon" title="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />

    const calDropdown = document.getElementById('calendar-dropdown');

    const calPrevBtn = document.getElementById('cal-prev-month');

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('app-theme') || 'light';

    }

    themeBtn.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme') || 'light';

    openModalBtn.addEventListener('click', () => {

    closeModalBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    // Custom Calendar Logic
    function syncCalendarFromInput() {
      if (dateInput.value) {
        calCurrentDate = new Date(dateInput.value + 'T00:00:00');
      } else {
        calCurrentDate = new Date();
      }
      renderCalendar();
    }

    // Toggle Calendar Dropdown
    dateInput.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = calDropdown.style.display === 'block';
      if (isOpen) {
        calDropdown.style.display = 'none';
      } else {
        calDropdown.style.display = 'block';
        syncCalendarFromInput();
      }
    });

    // Close calendar when clicking outside
    document.addEventListener('click', (e) => {
      if (!calDropdown.contains(e.target) && e.target !== dateInput) {
        calDropdown.style.display = 'none';
      }
    });

    calPrevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
      renderCalendar();
    });

    calNextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
      renderCalendar();
    });

    calTodayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const today = new Date();
      setSelectedDate(today);
      calDropdown.style.display = 'none';
    });

    function setSelectedDate(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      dateInput.value = `${yyyy}-${mm}-${dd}`;
      dateInput.dispatchEvent(new Event('change'));
    }

    function renderCalendar() {
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth(); // 0-indexed

      // Set Header Month Year
      calMonthYear.innerText = `${year}年${String(month + 1).padStart(2, '0')}月`;

      calDaysContainer.innerHTML = '';

      // First day of current month (0 is Sunday, 1 is Monday, etc.)
      const firstDayIndex = new Date(year, month, 1).getDay();
      const startDayOffset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

      // Total days in current month
      const totalDays = new Date(year, month + 1, 0).getDate();

      // Total days in previous month
      const prevTotalDays = new Date(year, month, 0).getDate();

      const today = new Date();
      const selected = dateInput.value ? new Date(dateInput.value + 'T00:00:00') : null;

      // 1. Previous month trailing days
      for (let i = startDayOffset - 1; i >= 0; i--) {
        const dayNum = prevTotalDays - i;
        const dayEl = createDayElement(dayNum, true);
        
        const d = new Date(year, month - 1, dayNum);
        dayEl.addEventListener('click', (e) => {
          e.stopPropagation();
          setSelectedDate(d);
          calDropdown.style.display = 'none';
        });

        calDaysContainer.appendChild(dayEl);
      }

      // 2. Current month days
      for (let i = 1; i <= totalDays; i++) {
        const dayEl = createDayElement(i, false);

        if (selected && selected.getFullYear() === year && selected.getMonth() === month && selected.getDate() === i) {
          dayEl.classList.add('selected');
        }

        if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === i) {
          dayEl.classList.add('today');
        }

        const d = new Date(year, month, i);
        dayEl.addEventListener('click', (e) => {
          e.stopPropagation();
          setSelectedDate(d);
          calDropdown.style.display = 'none';
        });

        calDaysContainer.appendChild(dayEl);
      }

      // 3. Next month leading days (to make 42 days total)
      const currentRenderedCount = startDayOffset + totalDays;
      const nextDaysCount = 42 - currentRenderedCount;

      for (let i = 1; i <= nextDaysCount; i++) {
        const dayEl = createDayElement(i, true);

        const d = new Date(year, month + 1, i);
        dayEl.addEventListener('click', (e) => {
          e.stopPropagation();
          setSelectedDate(d);
          calDropdown.style.display = 'none';
        });

        calDaysContainer.appendChild(dayEl);
      }
    }

    function createDayElement(num, isOtherMonth) {
      const div = document.createElement('div');
      div.className = 'calendar-day';
      if (isOtherMonth) {
        div.classList.add('other-month');
      }
      div.innerText = num;
      return div;
    }

    // Save Transaction Action
    async function saveTransaction() {
      const amount = parseFloat(amountInput.value);
      const date = dateInput.value;
      const desc = descInput.value.trim();

      if (isNaN(amount) || amount <= 0) {
        showToast('请输入有效金额！', 'error');
        amountInput.focus();
        return;
      }

      if (!date) {
        showToast('请选择日期！', 'error');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = editingTransactionId ? '修改中...' : '保存中...';

      const record = {
        type: selectedType,
        scope: 'private',
        amount: amount,
        date: date,
        category: selectedCategory,
        description: desc || null
      };

      let res;
      if (editingTransactionId) {
        res = await supabase.from('ledger_transactions').update(record).eq('id', editingTransactionId);
      } else {
        res = await supabase.from('ledger_transactions').insert([record]);
      }

      saveBtn.disabled = false;
      saveBtn.innerText = editingTransactionId ? '确认修改' : '确认保存';

      if (res.error) {
        showToast('操作失败: ' + res.error.message, 'error');
      } else {
        showToast(editingTransactionId ? '修改成功' : '记账成功', 'success');
        closeModal();
      }
    }

    saveBtn.addEventListener('click', saveTransaction);

    }

    // Formatting date headers dynamically (Today, Yesterday, Date)
    function formatDateHeader(dateStr) {
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);

      const toDateString = (d) => {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      };

      if (dateStr === toDateString(today)) {
        return '今天';
      } else if (dateStr === toDateString(yesterday)) {
        return '昨天';
      }

      // Return formatting "MM月DD日"
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parseInt(parts[1])}月${parseInt(parts[2])}日`;
      }
      return dateStr;
    }

    function isToday(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      const now = new Date();
      return date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate();
    }

    function isInCurrentWeek(dateStr) {
      const txDate = new Date(dateStr + 'T00:00:00');
      const now = new Date();
      const currentDay = now.getDay();
      const distanceToMonday = currentDay === 0 ? -6 : 1 - currentDay;
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() + distanceToMonday);
      startOfWeek.setHours(0, 0, 0, 0);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 7);
      return txDate >= startOfWeek && txDate < endOfWeek;
    }

    function isInCurrentMonth(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      const now = new Date();
      return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth();
    }

    function isInCurrentYear(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      const now = new Date();
      return date.getFullYear() === now.getFullYear();
    }

    // Calculate summaries, analytics, and update UI
    function renderApp() {
      // 1. Filtered records
      const filtered = transactions.filter(tx => {
        // Time filter
        if (currentTimeFilter === 'all') return true;
        if (currentTimeFilter === 'day') return isToday(tx.date);
        if (currentTimeFilter === 'week') return isInCurrentWeek(tx.date);
        if (currentTimeFilter === 'month') return isInCurrentMonth(tx.date);
        if (currentTimeFilter === 'year') return isInCurrentYear(tx.date);
        return true;
      });

      // 2. Compute sums
      let incomeSum = 0;
      let expenseSum = 0;

      filtered.forEach(tx => {
        const val = parseFloat(tx.amount);
        if (tx.type === 'income') {
          incomeSum += val;
        } else {
          expenseSum += val;
        }
      });

      const balance = incomeSum - expenseSum;

      // 3. Render dashboard values
      mainBalance.innerText = formatCNY(balance);
      mainIncome.innerText = formatCNY(incomeSum);
      mainExpense.innerText = formatCNY(expenseSum);

      // 4. Render category spending bars
      renderAnalytics(filtered);

      // 5. Render grouped transaction list
      renderList(filtered);
    }

    // Expense Share Analytics Drawer
    function renderAnalytics(list) {
      const expenses = list.filter(tx => tx.type === 'expense');
      const totalExpense = expenses.reduce((sum, tx) => sum + parseFloat(tx.amount), 0);

      if (totalExpense === 0) {
        analysisDrawer.innerHTML = '<div style="font-size:0.75rem;color:var(--text-secondary);text-align:center;padding:1.5rem 0;">该筛选下无支出分析</div>';
        return;
      }

      // Group
      const groups = {};
      expenses.forEach(tx => {
        const val = parseFloat(tx.amount);
        groups[tx.category] = (groups[tx.category] || 0) + val;
      });

      const sorted = Object.entries(groups).sort((a, b) => b[1] - a[1]);

      analysisDrawer.innerHTML = '';
      sorted.forEach(([catName, amt]) => {
        const pct = Math.round((amt / totalExpense) * 100);

        const row = document.createElement('div');
        row.className = 'analysis-bar-row';
        row.innerHTML = `
          <div class="analysis-bar-info">
            <span>${catName} (${pct}%)</span>
            <span>${formatCNY(amt)}</span>
          </div>
          <div class="analysis-progress-bg">
            <div class="analysis-progress-fill" style="width: 0%"></div>
          </div>
        `;

        analysisDrawer.appendChild(row);

        setTimeout(() => {
          const fill = row.querySelector('.analysis-progress-fill');
          if (fill) fill.style.width = `${pct}%`;
        }, 50);
      });
    }

    // Grouped List Rendering
    function renderList(list) {
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="9" x2="15" y2="9"></line>
              <line x1="9" y1="13" x2="15" y2="13"></line>
              <line x1="9" y1="17" x2="15" y2="17"></line>
            </svg>
            <p>还没有记录，点下方按钮开始吧</p>
          </div>
        `;
        return;
      }

      // Group by Date
      const dateGroups = {};
      list.forEach(tx => {
        const dateKey = tx.date;
        if (!dateGroups[dateKey]) {
          dateGroups[dateKey] = [];
        }
        dateGroups[dateKey].push(tx);
      });

      // Sort Date Keys descending
      const sortedDates = Object.keys(dateGroups).sort((a, b) => new Date(b) - new Date(a));

      sortedDates.forEach(dateStr => {
        const dateBox = document.createElement('div');
        dateBox.className = 'date-group';

        // Compute day's net sum
        let dayNet = 0;
        dateGroups[dateStr].forEach(tx => {
          const val = parseFloat(tx.amount);
          dayNet += tx.type === 'income' ? val : -val;
        });

        const daySumText = dayNet >= 0
          ? `+${dayNet.toFixed(2)}`
          : `${dayNet.toFixed(2)}`;

        // Header
        const header = document.createElement('div');
        header.className = 'date-header';
        header.innerHTML = `
          <span>${formatDateHeader(dateStr)}</span>
          <span style="font-weight:600;">结余: ${daySumText}</span>
        `;
        dateBox.appendChild(header);

        // Transaction rows
        dateGroups[dateStr].forEach(tx => {
          const item = document.createElement('div');
          item.className = 'tx-item';
          item.dataset.id = tx.id;

          const isIncome = tx.type === 'income';
          const amtText = `${isIncome ? '+' : '-'}${parseFloat(tx.amount).toFixed(2)}`;
          const iconSvg = getCategoryIcon(tx.category, tx.type);

          item.innerHTML = `
            <div class="tx-icon-box">
              ${iconSvg}
            </div>
            <div class="tx-details">
              <span class="tx-category">${tx.category}</span>
              ${tx.description ? `<span class="tx-note">${escapeHTML(tx.description)}</span>` : ''}
            </div>
            <div class="tx-right">
              <span class="tx-value ${tx.type}">${amtText}</span>
              <button class="tx-del" title="删除">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          `;

          // Delete Event
          item.querySelector('.tx-del').addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm(`确认删除这笔记录吗？ (${tx.category}: ¥${tx.amount})`)) {
              const { error } = await supabase.from('ledger_transactions').delete().eq('id', tx.id);
              if (error) {
                showToast('删除失败: ' + error.message, 'error');
              } else {
                showToast('已删除', 'success');
              }
            }
          });

          // Long Press to Edit Event
          let pressTimer;
          const startPress = (e) => {
            if (e.type === 'mousedown' && e.button !== 0) return; // only left click
            pressTimer = setTimeout(() => {
              if (navigator.vibrate) navigator.vibrate(50);
              openEditModal(tx);
            }, 600);
          };

          const cancelPress = () => {
            clearTimeout(pressTimer);
          };

          item.addEventListener('touchstart', startPress);
          item.addEventListener('touchend', cancelPress);
          item.addEventListener('touchmove', cancelPress);
          item.addEventListener('mousedown', startPress);
          item.addEventListener('mouseup', cancelPress);
          item.addEventListener('mouseleave', cancelPress);
          // Prevent default context menu during long press
          item.addEventListener('contextmenu', (e) => {
            e.preventDefault();
          });

          dateBox.appendChild(item);
        });

        container.appendChild(dateBox);
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Toggle Analysis Drawer
    analysisTrigger.addEventListener('click', () => {
      const active = analysisDrawer.classList.toggle('active');
      analysisArrow.innerText = active ? '↑' : '↓';
    });

    // Database Actions: Fetch & Subscribe
    async function loadData() {
      const { data, error } = await supabase
        .from('ledger_transactions')
        .select('*')
        .order('date', { ascending: false })
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching ledger_transactions:', error);
        showToast('账本数据加载失败', 'error');
        return;
      }

      transactions = data;
      renderApp();
    }

    function subscribeRealtime() {
      supabase
        .channel('realtime-ledger')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'ledger_transactions'
          },
          (payload) => {
            const { eventType, new: newRec, old: oldRec } = payload;

            if (eventType === 'INSERT') {
              transactions.unshift(newRec);
              transactions.sort((a, b) => {
                const dateCompare = new Date(b.date) - new Date(a.date);
                if (dateCompare !== 0) return dateCompare;
                return new Date(b.created_at) - new Date(a.created_at);
              });
              showToast('同步到一笔新账目', 'success');
            }
            else if (eventType === 'DELETE') {
              const el = document.querySelector(`.tx-item[data-id="${oldRec.id}"]`);
              if (el) {
                el.classList.add('deleting');
                setTimeout(() => {
                  transactions = transactions.filter(t => t.id !== oldRec.id);
                  renderApp();
                }, 300);
                return;
              } else {
                transactions = transactions.filter(t => t.id !== oldRec.id);
              }
            }
            else if (eventType === 'UPDATE') {
              transactions = transactions.map(t => t.id === newRec.id ? newRec : t);
              transactions.sort((a, b) => {
                const dateCompare = new Date(b.date) - new Date(a.date);
                if (dateCompare !== 0) return dateCompare;
                return new Date(b.created_at) - new Date(a.created_at);
              });
            }

            renderApp();
          }
        )
        .subscribe();
    }

    // App Startup
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadData();
      subscribeRealtime();
    });
  </script>
</body>
