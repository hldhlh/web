<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在播放 - 情景故事</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./course-db.js"></script>
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF4757, #FF6B81);
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.08);
            --radius-lg: 32px;
            --max-w: 480px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: #E4E7EB;
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-container {
            max-width: var(--max-w);
            margin: 0 auto;
            background: var(--bg);
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0,0,0,0.1);
        }

        /* ========== Header ========== */
        .header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.03);
            border: none;
            cursor: pointer;
        }

        .title-area {
            text-align: center;
            flex: 1;
        }

        /* ========== 头部标题区域 ========== */
        .title-main {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }

        .title-sub {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ========== 视频预览区 ========== */
        .player-visual {
            padding: 20px 20px 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .video-container {
            width: 100%;
            position: relative;
            background: transparent; /* 容器背景透明 */
            border-radius: 20px;
            overflow: visible; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 38vh; /* 高度在画面中比例固定：占屏幕高度的 38% */
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持比例 */
            background: transparent; /* 关键：视频标签本身也设为透明，消除内置黑边 */
            border-radius: 20px;
            /* 柔和投影让视频主体更突出 */
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.1)); 
            z-index: 1;
            display: block;
        }

        .lesson-info {
            text-align: center;
            margin: 24px 0;
        }

        .lesson-info h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .lesson-info p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ========== 进度条 ========== */
        .progress-section {
            padding: 0 30px;
            margin-bottom: 30px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            align-items: center; /* 保持倍速按钮和时间戳垂直对齐 */
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .progress-bar-container {
            height: 6px;
            background: #E2E8F0;
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--primary-gradient);
            border-radius: 3px;
        }

        .progress-knob {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 0%;
            width: 14px;
            height: 14px;
            background: white;
            border: 3px solid var(--primary);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* ========== 控制栏 ========== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px 20px 40px;
        }

        .btn-control {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            transition: all 0.2s;
        }
        .btn-control svg {
            display: block; /* Clear baseline issues */
        }

        .btn-control.secondary {
            color: var(--text-muted);
        }

        .btn-control.disabled {
            opacity: 0.25;
            pointer-events: none;
            filter: grayscale(1);
        }

        .btn-play-pause {
            width: 80px;
            height: 80px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 12px 32px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        /* 播放图标由于三角形几何中心偏左，需要轻微视觉修正 */
        #playIcon { transform: translateX(2px); }

        .btn-play-pause:active {
            transform: scale(0.9);
        }

        .btn-play-pause svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        /* ========== 侧边/底部操作按钮 ========== */
        .action-bar {
            padding: 24px 30px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .btn-action-small {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 确保垂直水平全中心对齐 */
            gap: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            width: 70px;
        }
        .btn-action-small svg { display: block; min-height: 20px; }

        .btn-action-small.active {
            color: var(--primary);
        }

        /* ========== 弹出面板 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: block;
            opacity: 1;
        }

        .modal-sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translate(-50%, 100%);
            width: 100%;
            max-width: var(--max-w);
            background: white;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            z-index: 2001;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 30px 24px;
        }

        .modal-sheet.active {
            transform: translate(-50%, 0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 800;
        }

        .modal-close {
            background: rgba(0, 0, 0, 0.05);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: rgba(0, 0, 0, 0.1);
            transform: scale(0.9);
        }

        .list-items {
            list-style: none;
            max-height: 40vh;
            overflow-y: auto;
        }

        .list-item {
            padding: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
        }

        .list-item.active {
            color: var(--primary);
            font-weight: 700;
            background: rgba(255, 71, 87, 0.05);
            border-radius: 12px;
        }

        /* 文字背景 */
        .bg-blur {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: url('cover.png') center;
            background-size: cover;
            filter: blur(80px) brightness(0.9);
            opacity: 0.3;
        }
    </style>
</head>

<body>
    <div class="app-container" id="mainContainer">
        <div class="bg-blur"></div>
        
        <!-- Header -->
        <header class="header">
            <button class="btn-icon" onclick="window.location.href='./index.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            </button>

                <div class="title-main" id="curTitle">正在进入学习...</div>

            </button>
        </div>

        <!-- Actions -->
        <div class="action-bar">
            <button class="btn-action-small" id="shareBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>

                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>

            </button>
            <button class="btn-action-small" id="listBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    <path d="M12 7v10"></path>
                    <path d="M8 11h8"></path>
                </svg>
                <span>目录</span>
            </button>
            <button class="btn-action-small" id="moreBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
                <span>更多</span>
            </button>
        </div>

        <!-- Playlist Modal -->
        <div class="modal-overlay" id="overlay"></div>
        
        <!-- 播放列表面板 -->
        <div class="modal-sheet" id="playlistModal">
            <div class="modal-header">
                <h3>课程目录</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <ul class="list-items" id="playlistItems"></ul>
        </div>

        <!-- 更多操作面板 (New) -->
        <div class="modal-sheet" id="moreModal">
            <div class="modal-header">
                <h3>更多操作</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <ul class="list-items">
                <li class="list-item" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>

                </li>
                <li class="list-item" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    <span style="flex:1; margin-left:12px;">评价课程</span>

                </li>
                <li class="list-item" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    <span style="flex:1; margin-left:12px;">收藏</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </li>
                <li class="list-item" onclick="closeModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
                    <span style="flex:1; margin-left:12px;">售后处理</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>

                    <span style="flex:1; margin-left:12px;">违规举报</span>

                </li>

        </div>
    </div>

    <script>
        // ========== 数据加载逻辑 ==========
        const defaults = {
            platformName: '情景故事学习小组制作',
            lessons: [
                { id: 1, name: '中秋节', duration: '25:10', views: 715, src: 'media/1.mp4' },
                { id: 2, name: '植树节', duration: '20:10', views: 652, src: 'media/2.mp4' },
                { id: 3, name: '生日會', duration: '25:30', views: 856, src: 'media/3.mp4' },
                { id: 4, name: '六一儿童节', duration: '23:30', views: 934, src: 'media/4.mp4' },
                { id: 5, name: '春天', duration: '22:45', views: 521, src: 'media/5.mp4' }
            ]
        };

        let currentData = CourseStore.cloneDefaults();
        let lessons = currentData.lessons;

        let state = {
            isPlaying: false,
            currentIdx: 1, 
            speed: 1.0,
            progress: 0,
            duration: 0
        };

        // UI 变量抢先定义
        const video = document.getElementById('mainVideo');
        const lessonLabel = document.getElementById('lessonLabel');
        const curTitle = document.getElementById('curTitle');
        const btnPlay = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressFill = document.getElementById('progressFill');
        const progressKnob = document.getElementById('progressKnob');
        const curTimeText = document.getElementById('currentTime');
        const totalTimeText = document.getElementById('totalTime');
        const mainContainer = document.getElementById('mainContainer');

        // 从 URL 获取参数
        const params = new URLSearchParams(window.location.search);
        const lId = parseInt(params.get('lesson')) || 1;
        const lName = params.get('name') || '';
        const isAuto = params.get('autoplay') === 'true';
        
        state.currentIdx = lId;
        if (isAuto) state.isPlaying = true; // 如果带有 autoplay 标志，则默认开始播放

        // 抢先渲染：如果有 URL 名称，直接显示，不等待数据库加载，消除“春节”硬编码直观感
        if (lName) {
            lessonLabel.textContent = decodeURIComponent(lName);
            curTitle.textContent = `${decodeURIComponent(lName)} - 情景故事`;
        }



        function formatTime(sec) {
            if(!sec || isNaN(sec)) return '00:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateUI() {
            const lesson = lessons.find(l => l.id === state.currentIdx) || lessons[0];
            lessonLabel.textContent = lesson.name;
            curTitle.textContent = `${lesson.name} - 情景故事`;
            
            // 切换视频源
            const newSrc = lesson.src || '';
            if (video.src.indexOf(newSrc) === -1) {
                video.src = newSrc;
                state.progress = 0;
                video.load();
            }

            // 动态更新平台制作名
            const platformText = document.querySelector('.lesson-info p');
            if (platformText) platformText.textContent = currentData.platformName;
            const bgBlur = document.querySelector('.bg-blur');
            const videoContainer = document.querySelector('.video-container');
            const coverSrc = currentData.coverUrl || 'cover.png';
            if (bgBlur) {
                bgBlur.style.backgroundImage = `url('${coverSrc}')`;
            }
            if (videoContainer) {
                videoContainer.style.setProperty('--curr-cover', `url('${coverSrc}')`);
            }

            totalTimeText.textContent = formatTime(video.duration || 0);

            if (state.isPlaying) {
                video.playbackRate = state.speed; // 确保切换视频时倍速依然生效
                video.play().catch(e => console.log("Play failed"));
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                mainContainer.classList.add('playing');
            } else {
                video.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                mainContainer.classList.remove('playing');
            }

            // 禁用状态管理
            const idx = lessons.findIndex(l => l.id === state.currentIdx);
            document.getElementById('prevBtn').classList.toggle('disabled', idx === 0);
            document.getElementById('nextBtn').classList.toggle('disabled', idx === lessons.length - 1);
        }

        // 核心循环：将 UI 进度与素材实时对齐
        setInterval(() => {
            if (state.isPlaying && video.duration) {
                state.progress = video.currentTime;
                state.duration = video.duration;
                
                const pct = (state.progress / state.duration) * 100;
                progressFill.style.width = pct + '%';
                progressKnob.style.left = pct + '%';
                curTimeText.textContent = formatTime(state.progress);
                totalTimeText.textContent = formatTime(state.duration);
            }
        }, 100);

        // 交互
        btnPlay.onclick = () => {
            state.isPlaying = !state.isPlaying;
            updateUI();
        };

        // 简单的进度条拖动点击
        document.getElementById('progressArea').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pct = x / rect.width;
            video.currentTime = pct * video.duration;
            state.progress = video.currentTime;
            updateUI();
        };

        document.getElementById('speedBtn').onclick = () => {
             const speeds = [1.0, 1.25, 1.5, 2.0];
             let currentIdx = speeds.indexOf(state.speed);
             let nextIdx = (currentIdx + 1) % speeds.length;
             state.speed = speeds[nextIdx];
             video.playbackRate = state.speed;
             document.getElementById('speedBtn').textContent = state.speed.toFixed(2).replace(/\.00$/, '') + 'X';
        };

        document.getElementById('listBtn').onclick = () => {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('playlistModal').classList.add('active');
            renderPlaylist();
        };

        document.getElementById('moreBtn').onclick = () => {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('moreModal').classList.add('active');
        };

        document.getElementById('shareBtn').onclick = () => {
             const title = curTitle.textContent;
             const url = window.location.href;
             if (navigator.share) {
                 navigator.share({ title, url }).catch(console.error);
             } else {
                 navigator.clipboard.writeText(url);
                 alert('链接已复制到剪贴板');
             }
        };

        window.closeModal = () => {
            document.getElementById('overlay').classList.remove('active');
            document.querySelectorAll('.modal-sheet').forEach(m => m.classList.remove('active'));
        };

        document.getElementById('overlay').onclick = closeModal;

        function renderPlaylist() {
            const container = document.getElementById('playlistItems');
            container.innerHTML = lessons.map(l => `
                <li class="list-item ${l.id === state.currentIdx ? 'active' : ''}" onclick="selectLesson(${l.id})">
                    <span>${String(l.id).padStart(2, '0')}</span>
                    <span>${l.name}</span>
                </li>
            `).join('');
        }

        window.selectLesson = (id) => {
            state.currentIdx = id;
            state.progress = 0;
            state.isPlaying = true;
            updateUI();
            closeModal();
        };

        // 简单的进度条拖动点击
        document.getElementById('progressArea').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pct = x / rect.width;
            video.currentTime = pct * video.duration;
            state.progress = video.currentTime;
            updateUI();
        };

        // 上一个/下一个 逻辑
        document.getElementById('prevBtn').onclick = () => {
            const idx = lessons.findIndex(l => l.id === state.currentIdx);
            if (idx > 0) {
                state.currentIdx = lessons[idx - 1].id;
                state.progress = 0;
                state.isPlaying = true;
                updateUI();
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            const idx = lessons.findIndex(l => l.id === state.currentIdx);
            if (idx < lessons.length - 1) {
                state.currentIdx = lessons[idx + 1].id;
                state.progress = 0;
                state.isPlaying = true;
                updateUI();
            }
        };

        // ========== 立即初次渲染 (消除所有显式等待) ==========
        function initQuickly() {
            // 1. 先用本地默认数据全量渲染
            updateUI(); 

            // 2. 尝试覆盖缓存数据 (离线版瞬间就位)
            const CACHE_KEY = 'courseAdminData';
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    currentData = JSON.parse(cached);
                    lessons = currentData.lessons;
                    updateUI();
                } catch(e) {}
            }

            // 3. 静默从云端获取最新，拉取到后秒级刷新
            CourseStore.load().then((data) => {
                if (data) {
                    currentData = data;
                    lessons = currentData.lessons;
                    updateUI();
                }
            });
        }

        initQuickly();
    </script>
</body>

</html>
