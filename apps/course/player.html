<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正在播放 - 情景故事</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./course-db.js"></script>
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF4757, #FF6B81);
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --glass: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.3);
            --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.08);
            --radius-lg: 32px;
            --max-w: 480px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: #E4E7EB;
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-container {
            max-width: var(--max-w);
            margin: 0 auto;
            background: var(--bg);
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0,0,0,0.1);
        }

        /* ========== Header ========== */
        .header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.03);
            border: none;
            cursor: pointer;
        }

        .title-area {
            text-align: center;
            flex: 1;
        }

        /* ========== 头部标题区域 ========== */
        .title-main {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }

        .title-sub {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ========== 视频预览区 ========== */
        .player-visual {
            padding: 20px 20px 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .video-container {
            width: 100%;
            position: relative;
            background: transparent; /* 容器背景透明 */
            border-radius: 20px;
            overflow: visible; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 38vh; /* 高度在画面中比例固定：占屏幕高度的 38% */
        }

        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持比例 */
            background: transparent; /* 关键：视频标签本身也设为透明，消除内置黑边 */
            border-radius: 20px;
            /* 柔和投影让视频主体更突出 */
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.1)); 
            z-index: 1;
            display: block;
        }

        .lesson-info {
            text-align: center;
            margin: 24px 0;
        }

        .lesson-info h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .lesson-info p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ========== 进度条 ========== */
        .progress-section {
            padding: 0 30px;
            margin-bottom: 30px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            align-items: center; /* 保持倍速按钮和时间戳垂直对齐 */
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .progress-bar-container {
            height: 6px;
            background: #E2E8F0;
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--primary-gradient);
            border-radius: 3px;
        }

        .progress-knob {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 0%;
            width: 14px;
            height: 14px;
            background: white;
            border: 3px solid var(--primary);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* ========== 控制栏 ========== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px 20px 40px;
        }

        .btn-control {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            transition: all 0.2s;
        }
        .btn-control svg {
            display: block; /* Clear baseline issues */
        }

        .btn-control.secondary {
            color: var(--text-muted);
        }

        .btn-control.disabled {
            opacity: 0.25;
            pointer-events: none;
            filter: grayscale(1);
        }

        .btn-play-pause {
            width: 80px;
            height: 80px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 12px 32px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        /* 播放图标由于三角形几何中心偏左，需要轻微视觉修正 */
        #playIcon { transform: translateX(2px); }

        .btn-play-pause:active {
            transform: scale(0.9);
        }

        .btn-play-pause svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        /* ========== 侧边/底部操作按钮 ========== */
        .action-bar {
            padding: 24px 30px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .btn-action-small {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 确保垂直水平全中心对齐 */
            gap: 8px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            width: 70px;
        }
        .btn-action-small svg { display: block; min-height: 20px; }

        .btn-action-small.active {
            color: var(--primary);
        }

        /* ========== 弹出面板 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            display: block;
            opacity: 1;
        }

        .modal-sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translate(-50%, 100%);
            width: 100%;
            max-width: var(--max-w);
            background: white;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            z-index: 2001;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: 30px 24px;
        }

        .modal-sheet.active {
            transform: translate(-50%, 0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 800;
        }

        .modal-close {
            background: rgba(0, 0, 0, 0.05);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:active {
            background: rgba(0, 0, 0, 0.1);
            transform: scale(0.9);
        }

        .list-items {
            list-style: none;
            max-height: 40vh;
            overflow-y: auto;
        }

        .list-item {
            padding: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
        }

        .list-item.active {
            color: var(--primary);
            font-weight: 700;
            background: rgba(255, 71, 87, 0.05);
            border-radius: 12px;
        }

        /* 文字背景 */
        .bg-blur {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: url('cover.png') center;
            background-size: cover;
            filter: blur(80px) brightness(0.9);
            opacity: 0.3;
        }

        /* 极简加载动画 (Minimal Loading) */
        .video-loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0,0,0,0.05);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .video-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

    <script>
        // ========== 数据加载逻辑 ==========
        let currentData = CourseStore.cloneDefaults();
        let lessons = currentData.lessons;

        let state = {
            isPlaying: false,
            currentIdx: 1,
            speed: 1.0,
            progress: 0,
            duration: 0,
            lastIncrementedId: null,
            loadedSourceKey: ''
        };

        // UI 变量抢先定义
        const video = document.getElementById('mainVideo');
        const lessonLabel = document.getElementById('lessonLabel');
        const curTitle = document.getElementById('curTitle');
        const btnPlay = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressFill = document.getElementById('progressFill');
        const progressKnob = document.getElementById('progressKnob');
        const curTimeText = document.getElementById('currentTime');
        const totalTimeText = document.getElementById('totalTime');
        const mainContainer = document.getElementById('mainContainer');
        const videoLoader = document.getElementById('videoLoader');
        const chunkedCache = new Map(); // raw src -> Promise<string> or resolved object URL
        const prefetchInFlight = new Map();
        const chunkFetchCache = new Map(); // chunk cache key -> Promise<ArrayBuffer>
        const CHUNK_DOWNLOAD_CONCURRENCY = 4;

        function decodeLessonSrc(src) {
            const prefix = 'chunked:';
            if (!src || typeof src !== 'string' || !src.startsWith(prefix)) return null;
            try {
                return JSON.parse(decodeURIComponent(src.slice(prefix.length)));
            } catch (e) {
                return null;
            }
        }

        function extractStorageLocation(src) {
            try {
                const url = new URL(src, window.location.href);
                const marker = '/storage/v1/object/public/';
                const idx = url.pathname.indexOf(marker);
                if (idx === -1) return null;
                const rel = url.pathname.slice(idx + marker.length).replace(/^\/+/, '');
                const parts = rel.split('/');
                const bucket = parts.shift();
                const objectPath = parts.join('/');
                if (!bucket || !objectPath) return null;
                return { bucket, objectPath };
            } catch (e) {
                return null;
            }
        }

        function getLessonSample(lesson) {
            const rawSrc = lesson?.src || '';
            const manifest = decodeLessonSrc(rawSrc);
            if (manifest?.chunks?.length) {
                return {
                    bucket: manifest.bucket || 'course-media',
                    objectPath: manifest.chunks[0].path,
                    url: rawSrc
                };
            }
            const storage = extractStorageLocation(rawSrc);
            if (storage) {
                return { ...storage, url: rawSrc };
            }
            return null;
        }

        function getPreferredLineKey(line) {
            return line?.id || line?.baseUrl || 'default';
        }

        function fetchChunkBuffer(bucket, chunkPath, line) {
            const cacheKey = `${bucket}:${chunkPath}:${getPreferredLineKey(line)}`;
            if (chunkFetchCache.has(cacheKey)) {
                return chunkFetchCache.get(cacheKey);
            }

            const task = (async () => {
                const url = CourseStore.buildVideoUrl(bucket, chunkPath, line);
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Failed to load chunk ${chunkPath}`);
                }
                return await response.arrayBuffer();
            })();

            chunkFetchCache.set(cacheKey, task);
            task.catch(() => {
                if (chunkFetchCache.get(cacheKey) === task) {
                    chunkFetchCache.delete(cacheKey);
                }
            });
            return task;
        }

        async function fetchChunkBuffersWithLimit(bucket, chunks, line, limit = CHUNK_DOWNLOAD_CONCURRENCY) {
            const results = new Array(chunks.length);
            let cursor = 0;

            const worker = async () => {
                while (cursor < chunks.length) {
                    const index = cursor++;
                    const chunk = chunks[index];
                    results[index] = await fetchChunkBuffer(bucket, chunk.path, line);
                }
            };

            const workerCount = Math.min(limit, chunks.length);
            await Promise.all(Array.from({ length: workerCount }, () => worker()));
            return results;
        }

        async function resolveLessonVideoSrc(lesson) {
            const rawSrc = lesson?.src || '';
            const manifest = decodeLessonSrc(rawSrc);
            if (!manifest) {
                const storage = extractStorageLocation(rawSrc);
                if (!storage) return rawSrc;
                return CourseStore.resolveStoragePublicUrl(rawSrc, storage);
            }

            if (chunkedCache.has(rawSrc)) {
                return await chunkedCache.get(rawSrc);
            }

            const loadPromise = (async () => {
                const bucket = manifest.bucket || 'course-media';
                const chunks = Array.isArray(manifest.chunks) ? [...manifest.chunks] : [];
                chunks.sort((a, b) => (a.index || 0) - (b.index || 0));
                const preferredLine = await CourseStore.getPreferredVideoLine(getLessonSample(lesson) || { bucket, objectPath: chunks[0]?.path, url: rawSrc });

                const buffers = await fetchChunkBuffersWithLimit(bucket, chunks, preferredLine);

                const blob = new Blob(buffers, { type: manifest.mimeType || 'video/mp4' });
                return URL.createObjectURL(blob);
            })();

            chunkedCache.set(rawSrc, loadPromise);

            try {
                return await loadPromise;
            } catch (e) {
                chunkedCache.delete(rawSrc);
                throw e;
            }
        }

        function prefetchLessonVideo(lesson) {
            if (!lesson || !lesson.src) return;
            const rawSrc = lesson.src || '';
            if (chunkedCache.has(rawSrc) || prefetchInFlight.has(rawSrc)) return;
            const manifest = decodeLessonSrc(rawSrc);
            if (manifest?.chunks?.length) {
                const bucket = manifest.bucket || 'course-media';
                const chunks = [...manifest.chunks].sort((a, b) => (a.index || 0) - (b.index || 0));
                const sample = getLessonSample(lesson) || { bucket, objectPath: chunks[0]?.path, url: rawSrc };
                CourseStore.getPreferredVideoLine(sample).then((line) => {
                    chunks.forEach((chunk) => {
                        fetchChunkBuffer(bucket, chunk.path, line).catch(() => {});
                    });
                }).catch(() => {});
            }
            resolveLessonVideoSrc(lesson).catch((e) => {
                console.error('Video prefetch failed:', e);
            });
        }

        function getLessonByIndex(index) {
            return lessons.find(l => l.id === index) || null;
        }

        function schedulePrefetch(index) {
            const lesson = getLessonByIndex(index);
            if (!lesson || !lesson.src || chunkedCache.has(lesson.src) || prefetchInFlight.has(lesson.src)) {
                return;
            }

            const task = Promise.resolve()
                .then(() => prefetchLessonVideo(lesson))
                .catch((e) => {
                    console.error('Prefetch failed:', e);
                })
                .finally(() => {
                    prefetchInFlight.delete(lesson.src);
                });

            prefetchInFlight.set(lesson.src, task);
        }

        function prefetchNearbyLessons() {
            const currentIdx = lessons.findIndex(l => l.id === state.currentIdx);
            if (currentIdx < 0) return;

            const prev = lessons[currentIdx - 1];
            const next = lessons[currentIdx + 1];
            if (prev) schedulePrefetch(prev.id);
            if (next) schedulePrefetch(next.id);
        }

        // ========== 全屏控制 ==========
        function toggleFullscreen() {
            const container = document.querySelector('.video-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
                else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                else if (container.msRequestFullscreen) container.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        document.querySelector('.video-container').ondblclick = toggleFullscreen;

        // ========== 加载动画控制 ==========
        video.onwaiting = () => videoLoader.classList.remove('hidden');
        video.onplaying = () => videoLoader.classList.add('hidden');
        video.oncanplay = () => videoLoader.classList.add('hidden');
        video.onloadstart = () => videoLoader.classList.remove('hidden');
        video.onloadeddata = () => videoLoader.classList.add('hidden');
        video.onerror = () => videoLoader.classList.add('hidden');

        // 从 URL 获取参数
        const params = new URLSearchParams(window.location.search);
        const lId = parseInt(params.get('lesson')) || 1;
        const lName = params.get('name') || '';
        const isAuto = params.get('autoplay') === 'true';
        
        state.currentIdx = lId;
        if (isAuto) state.isPlaying = true; // 如果带有 autoplay 标志，则默认开始播放

        // 抢先渲染：如果有 URL 名称，直接显示，不等待数据库加载，消除“春节”硬编码直观感
        if (lName) {
            lessonLabel.textContent = decodeURIComponent(lName);
            curTitle.textContent = `${decodeURIComponent(lName)} - 情景故事`;
        }



        function formatTime(sec) {
            if(!sec || isNaN(sec)) return '00:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        async function updateUI() {
            const lesson = lessons.find(l => l.id === state.currentIdx) || lessons[0];
            lessonLabel.textContent = lesson.name;
            curTitle.textContent = `${lesson.name} - 情景故事`;
            
            prefetchLessonVideo(lesson);

            // 切换视频源
            const newSrc = lesson.src || '';
            if (state.loadedSourceKey !== newSrc) {
                state.loadedSourceKey = newSrc;
                state.progress = 0;
                try {
                    const resolvedSrc = await resolveLessonVideoSrc(lesson);
                    if (state.loadedSourceKey !== newSrc) return;
                    video.src = resolvedSrc;
                    video.load();
                } catch (e) {
                    console.error(e);
                    if (state.loadedSourceKey === newSrc) {
                        state.loadedSourceKey = '';
                        video.src = '';
                        video.load();
                    }
                }
            }

            prefetchNearbyLessons();

            // 动态更新平台制作名
            const platformText = document.querySelector('.lesson-info p');
            if (platformText) platformText.textContent = currentData.platformName;
            const bgBlur = document.querySelector('.bg-blur');
            const videoContainer = document.querySelector('.video-container');
            const coverSrc = currentData.coverUrl || 'cover.png';

            // 云端统计递增：仅当课时真正切换且有有效ID时触发
            if (state.currentIdx && state.currentIdx !== state.lastIncrementedId) {
                CourseStore.incrementViews(state.currentIdx);
                state.lastIncrementedId = state.currentIdx;
                console.log('云端学习建议已统计:', state.currentIdx);
            }

            if (bgBlur) {
                bgBlur.style.backgroundImage = `url('${coverSrc}')`;
            }
            if (videoContainer) {
                videoContainer.style.setProperty('--curr-cover', `url('${coverSrc}')`);
            }

            totalTimeText.textContent = formatTime(video.duration || 0);

            if (state.isPlaying) {
                video.playbackRate = state.speed; // 确保切换视频时倍速依然生效
                video.play().catch(e => console.log("Play failed"));
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                mainContainer.classList.add('playing');
            } else {
                video.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                mainContainer.classList.remove('playing');
            }

            // 禁用状态管理
            const idx = lessons.findIndex(l => l.id === state.currentIdx);
            document.getElementById('prevBtn').classList.toggle('disabled', idx === 0);
            document.getElementById('nextBtn').classList.toggle('disabled', idx === lessons.length - 1);
        }

        // 核心循环：将 UI 进度与素材实时对齐
        setInterval(() => {
            if (state.isPlaying && video.duration) {
                state.progress = video.currentTime;
                state.duration = video.duration;
                
                const pct = (state.progress / state.duration) * 100;
                progressFill.style.width = pct + '%';
                progressKnob.style.left = pct + '%';
                curTimeText.textContent = formatTime(state.progress);
                totalTimeText.textContent = formatTime(state.duration);
            }
        }, 100);

        // 交互
        btnPlay.onclick = () => {
            state.isPlaying = !state.isPlaying;
            updateUI();
        };

        // 简单的进度条拖动点击
        document.getElementById('progressArea').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pct = x / rect.width;
            video.currentTime = pct * video.duration;
            state.progress = video.currentTime;
            updateUI();
        };

        document.getElementById('speedBtn').onclick = () => {
             const speeds = [1.0, 1.25, 1.5, 2.0];
             let currentIdx = speeds.indexOf(state.speed);
             let nextIdx = (currentIdx + 1) % speeds.length;
             state.speed = speeds[nextIdx];
             video.playbackRate = state.speed;
             document.getElementById('speedBtn').textContent = state.speed.toFixed(2).replace(/\.00$/, '') + 'X';
        };

        document.getElementById('listBtn').onclick = () => {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('playlistModal').classList.add('active');
            renderPlaylist();
        };

        document.getElementById('moreBtn').onclick = () => {
            document.getElementById('overlay').classList.add('active');
            document.getElementById('moreModal').classList.add('active');
        };

        document.getElementById('shareBtn').onclick = () => {
             const title = curTitle.textContent;
             const url = window.location.href;
             if (navigator.share) {
                 navigator.share({ title, url }).catch(console.error);
             } else {
                 navigator.clipboard.writeText(url);
                 alert('链接已复制到剪贴板');
             }
        };

        window.closeModal = () => {
            document.getElementById('overlay').classList.remove('active');
            document.querySelectorAll('.modal-sheet').forEach(m => m.classList.remove('active'));
        };

        document.getElementById('overlay').onclick = closeModal;

        function renderPlaylist() {
            const container = document.getElementById('playlistItems');
            container.innerHTML = lessons.map(l => `
                <li class="list-item ${l.id === state.currentIdx ? 'active' : ''}" onclick="selectLesson(${l.id})">
                    <span>${String(l.id).padStart(2, '0')}</span>
                    <span>${l.name}</span>
                </li>
            `).join('');
        }

        window.selectLesson = (id) => {
            state.currentIdx = id;
            state.progress = 0;
            state.isPlaying = true;
            updateUI();
            closeModal();
        };

        // 简单的进度条拖动点击
        document.getElementById('progressArea').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pct = x / rect.width;
            video.currentTime = pct * video.duration;
            state.progress = video.currentTime;
            updateUI();
        };

        // 上一个/下一个 逻辑
        document.getElementById('prevBtn').onclick = () => {
            const idx = lessons.findIndex(l => l.id === state.currentIdx);
            if (idx > 0) {
                state.currentIdx = lessons[idx - 1].id;
                state.progress = 0;
                state.isPlaying = true;
                updateUI();
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            const idx = lessons.findIndex(l => l.id === state.currentIdx);
            if (idx < lessons.length - 1) {
                state.currentIdx = lessons[idx + 1].id;
                state.progress = 0;
                state.isPlaying = true;
                updateUI();
            }
        };

        // ========== 立即初次渲染 (消除所有显式等待) ==========
        function initQuickly() {
            // 1. 先用本地默认数据全量渲染
            updateUI(); 
            const defaultSample = getLessonSample(lessons[0] || currentData.lessons?.[0]);
            if (defaultSample) {
                CourseStore.warmupVideoLine(defaultSample);
                prefetchLessonVideo(lessons[0] || currentData.lessons?.[0]);
            }

            // 2. 尝试覆盖缓存数据 (离线版瞬间就位)
            const CACHE_KEY = 'courseAdminData';
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    currentData = JSON.parse(cached);
                    lessons = currentData.lessons;
                    updateUI();
                    const cachedSample = getLessonSample(lessons[0] || currentData.lessons?.[0]);
                    if (cachedSample) {
                        CourseStore.warmupVideoLine(cachedSample);
                        prefetchLessonVideo(lessons[0] || currentData.lessons?.[0]);
                    }
                } catch(e) {}
            }

            // 3. 静默从云端获取最新，拉取到后秒级刷新
            CourseStore.load().then((data) => {
                if (data) {
                    currentData = data;
                    lessons = currentData.lessons;
                    updateUI();
                    const cloudSample = getLessonSample(lessons[0] || currentData.lessons?.[0]);
                    if (cloudSample) {
                        CourseStore.warmupVideoLine(cloudSample);
                        prefetchLessonVideo(lessons[0] || currentData.lessons?.[0]);
                    }
                    prefetchNearbyLessons();
                }
            });
        }

        initQuickly();
    </script>
</body>
