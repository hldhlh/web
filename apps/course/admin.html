<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课程后台管理 - 精致版</title>
  <!-- 引入与 index.html 一致的高质感字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./course-db.js"></script>
  <!-- Lucide 图标 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      /* 100% 还原 index.html 核心色盘 */
      --primary: #FF4757;
      --primary-gradient: linear-gradient(135deg, #FF4757, #FF6B81);
      --secondary: #2F3542;
      --accent: #70A1FF;
      --success: #2ED573;
      
      /* 中性色 */
      --bg: #F1F2F6;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #2F3542;
      --text-muted: #747D8C;
      --border: rgba(0, 0, 0, 0.05);
      
      /* 玻璃拟态 */
      --glass: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.4);
      
      /* 阴影 */
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.12);
      
      /* 圆角 */
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      background: #E4E7EB; /* 桌面端大背景，同 index.html */
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 复用 index.html 的主容器样式，但宽度适配桌面管理 */
    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 100px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      transition: all 0.3s;
    }

    /* ========== 响应式布局修正 (Mobile Support) ========== */
    @media (max-width: 768px) {
      body { background: var(--bg); }
      .admin-container { 
        max-width: 100%; 
        box-shadow: none;
      }
      .header { padding: 10px 16px; }
      .main-scroll { padding: 16px; }
      .section-card { padding: 16px; border-radius: var(--radius-md); }
      
      .form-grid { grid-template-columns: 1fr; gap: 16px; }
      
      .lesson-item {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 16px;
      }
      .l-number { text-align: left; font-size: 14px; opacity: 0.5; }
      .l-actions { justify-content: flex-start; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
      
      /* 让媒体区域在移动端更易触控 */
      .l-media { width: 100%; }
      .upload-box { padding: 16px; }
    }

    /* ========== 头部导航 (完全同步 index.html) ========== */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.03);
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-icon:active {
      transform: scale(0.9);
      background: rgba(0, 0, 0, 0.08);
    }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .title-sub {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* ========== 内容区域 ========== */
    .main-scroll {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .section-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ========== 表单系统 ========== */
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 600px; /* 控制宽度，不要铺得太满 */
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s;
      color: var(--text-main);
    }

    input[type="text"]:focus {
      background: white;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.1);
    }

    .upload-box {
      background: var(--bg);
      border: 2px dashed #D1D5DB;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100px;
    }

    .upload-box:hover {
      border-color: var(--primary);
      background: rgba(255, 71, 87, 0.02);
    }

    .upload-box i {
      color: var(--primary);
      margin-bottom: 8px;
    }

    .upload-box span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .upload-box input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* ========== 列表系统 (适配 index.html) ========== */
    .lesson-item {
      background: white;
      padding: 16px;
      border-radius: var(--radius-md);
      display: grid;
      grid-template-columns: 50px 1fr 180px 80px;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .lesson-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: rgba(255, 71, 87, 0.2);
    }

    .l-number {
      font-size: 20px;
      font-weight: 800;
      color: #E2E8F0;
      text-align: center;
    }

    .l-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .l-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-stat {
      background: var(--bg);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .l-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ========== 统一按钮 ========== */
    .btn-main {
      padding: 10px 20px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.2);
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-main:active {
      transform: scale(0.96);
    }

    .btn-outline {
      padding: 10px 20px;
      background: white;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-danger {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF5F6;
      color: var(--primary);
      border: 1px solid rgba(255, 71, 87, 0.1);
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-danger:hover {
      background: var(--primary);
      color: white;
    }

    /* ========== 同步状态提示 (index.html 风格) ========== */
    .status-toast {
      padding: 6px 14px;
      background: var(--bg);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(46, 213, 115, 0.1);
    }

    .status-dot.syncing {
      background: #FFA502;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* 真正的 Toast */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--secondary);
      color: white;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: none;
      z-index: 2000;
    }

    @media (max-width: 768px) {
      .l-stats { display: none; }
    }

    /* 圈子管理样式 */
    .post-admin-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px;
      background: var(--bg);
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .post-admin-info { flex: 1; }
    .post-admin-user { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
    .post-admin-content { font-size: 13px; color: var(--text-main); line-height: 1.5; }
    .post-admin-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>

  <div class="admin-container">
    <header class="header">
      <div class="header-left">
        <button class="btn-icon" onclick="window.location.href='./index.html'">
          <i data-lucide="chevron-left" size="20"></i>
        </button>
        <div class="header-title">
          <span class="title-main">B端管理系统</span>
          <span class="title-sub">BACKEND CONTROL</span>
        </div>
      </div>
      <div class="status-toast">
        <span class="status-dot" id="statusDot"></span>
        <span id="syncStatus">就绪</span>
      </div>
    </header>

    <div class="main-scroll">
      <!-- 平台配置 -->
      <section class="section-card">
        <div class="section-header">
          <h2 class="section-title"><i data-lucide="monitor" size="20"></i> 平台信息</h2>
        </div>
        <div class="form-grid">
          <div class="field">
            <label>平台名称</label>
            <input type="text" id="platformName" oninput="autoSave()" placeholder="例如：情景故事学习小组">
          </div>
          <div class="field">
            <label>品牌 Logo</label>
            <div class="upload-box">
              <i data-lucide="award" size="28"></i><br>
              <span id="logoHint">点击上传 Logo</span>
              <input type="file" id="logoFile" accept="image/*" onchange="uploadAndSave(this)">
            </div>
            <input type="text" id="logoUrl" readonly placeholder="自动回填 URL" style="font-size: 11px; margin-top: 8px; opacity: 0.7;">
          </div>
        </div>
      </section>

      <!-- 课程管理 -->
      <section class="section-card">
        <div class="section-header">
          <h2 class="section-title"><i data-lucide="list-video" size="20"></i> 课程内容</h2>
          <button class="btn-outline" onclick="addNewLesson()">+ 新增课时</button>
        </div>
        
        <div id="lessonTableBody">
          <!-- 动态渲染 -->
        </div>
      </section>

      <!-- 圈子管理 -->
      <section class="section-card">
        <div class="section-header">
          <h2 class="section-title"><i data-lucide="message-square" size="20"></i> 圈子评价</h2>
          <button class="btn-outline" onclick="loadPosts()">刷新动态</button>
        </div>
        
        <div id="postsList">
          <!-- 动态渲染 -->
          <div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px;">正在加载圈子动态...</div>
        </div>
      </section>
    </div>
  </div>

  <div id="toast">保存成功</div>
  <video id="probeVideo" style="display:none;"></video>

  <script>
    let currentData = CourseStore.cloneDefaults();
    let saveTimer = null;

    // 初始化图标
    lucide.createIcons();

    function setStatus(text, state = 'ready') {
      document.getElementById('syncStatus').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = state === 'syncing' ? 'status-dot syncing' : 'status-dot';
    }

    function showToast(text) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.style.display = 'block';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '--:--';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    async function probeDurationFromFile(file) {
      const url = URL.createObjectURL(file);
      return new Promise((resolve) => {
        const video = document.getElementById('probeVideo');
        video.src = url;
        video.onloadedmetadata = () => {
          URL.revokeObjectURL(url);
          resolve(formatTime(video.duration));
        };
      });
    }

    function render() {
      document.getElementById('platformName').value = currentData.platformName || '';
      document.getElementById('logoUrl').value = currentData.logoUrl || '';

      const container = document.getElementById('lessonTableBody');
      container.innerHTML = currentData.lessons.map((l, i) => `
        <div class="lesson-item">
          <div class="l-number">${String(l.id).padStart(2, '0')}</div>
          <div class="l-info">
             <input type="text" id="name-${i}" value="${l.name || ''}" oninput="autoSave()" style="font-weight: 700; background: transparent; padding: 4px 0;">
             <div class="l-stats">
               <span class="badge-stat"><i data-lucide="clock" size="12"></i> <span id="dur-${i}">${l.duration || '--:--'}</span></span>
               <span class="badge-stat"><i data-lucide="eye" size="12"></i> <input type="text" id="views-${i}" value="${l.views || 0}" oninput="autoSave()" style="width: 40px; background: transparent; padding:0; height:auto; text-align:center; font-weight:700;"></span>
             </div>
          </div>
          <div class="l-media">
             <div class="upload-box" style="padding: 10px; border-width: 1px;">
                <span id="hint-${i}" style="font-size: 11px;">${l.src ? '点击替换视频' : '选择视频上传'}</span>
                <input type="file" id="file-${i}" accept="video/*" onchange="uploadAndSave(this)">
             </div>
             <input type="hidden" id="src-${i}" value="${l.src || ''}">
             <div style="font-size: 9px; color: var(--text-muted); margin-top: 4px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                ${l.src ? String(l.src).split('/').pop() : ''}
             </div>
          </div>
          <div class="l-actions">
            <button class="btn-danger" onclick="removeLesson(${i})">
              <i data-lucide="trash-2" size="18"></i>
            </button>
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    function addNewLesson() {
      const nextId = currentData.lessons.length ? Math.max(...currentData.lessons.map(l => Number(l.id) || 0)) + 1 : 1;
      currentData.lessons.push({ id: nextId, name: '新课时标题', duration: '--:--', views: 0, src: '' });
      render();
      autoSave();
    }

    function removeLesson(index) {
      if(confirm('确定删除吗？')) {
        currentData.lessons.splice(index, 1);
        render();
        autoSave();
      }
    }

    async function uploadAndSave(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      setStatus('同步云端...', 'syncing');
      try {
        const isAsset = input.id === 'coverFile' || input.id === 'logoFile';
        const idx = isAsset ? null : Number(String(input.id).split('-')[1] || 0);
        const hint = isAsset ? document.getElementById(input.id === 'coverFile' ? 'coverHint' : 'logoHint') : document.getElementById(`hint-${idx}`);

        const type = input.id === 'coverFile' ? 'covers' : input.id === 'logoFile' ? 'logos' : 'lessons';
        const uploaded = await CourseStore.uploadToStorage(file, type, {
          onProgress: (percent) => {
            if (hint) hint.textContent = `${percent}%`;
          }
        });

        if (input.id === 'coverFile') {
          currentData.coverUrl = uploaded.publicUrl;
          document.getElementById('coverUrl').value = uploaded.publicUrl;
          hint.textContent = '封面上传成功';
        } else if (input.id === 'logoFile') {
          currentData.logoUrl = uploaded.publicUrl;
          document.getElementById('logoUrl').value = uploaded.publicUrl;
          hint.textContent = 'Logo 上传成功';
        } else {
          const lesson = currentData.lessons[idx];
          lesson.src = uploaded.publicUrl;
          lesson.duration = await probeDurationFromFile(file);
          document.getElementById(`src-${idx}`).value = uploaded.publicUrl;
          document.getElementById(`dur-${idx}`).textContent = lesson.duration;
          hint.textContent = '视频更新成功';
        }

        setStatus('云端同步成功');
        autoSave();
      } catch (e) {
        console.error(e);
        setStatus('上传中断', 'syncing');
        alert(`上传失败：${e.message || e}`);
      }
    }

    async function performSave() {
      currentData.platformName = document.getElementById('platformName').value.trim();
      currentData.logoUrl = document.getElementById('logoUrl').value.trim();

      currentData.lessons.forEach((lesson, i) => {
        lesson.name = document.getElementById(`name-${i}`)?.value || lesson.name;
        lesson.views = Number(document.getElementById(`views-${i}`)?.value || lesson.views || 0);
        lesson.src = document.getElementById(`src-${i}`)?.value || lesson.src;
      });

      currentData = await CourseStore.save(currentData);
    }

    async function saveAll() {
      try {
        setStatus('强制更新...', 'syncing');
        await performSave();
        showToast('保存成功');
        setStatus('就绪');
      } catch (e) {
        console.error(e);
        setStatus('同步失败');
      }
    }

    function autoSave() {
      setStatus('正在同步云端...', 'syncing');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        performSave().then(() => {
          setStatus('云端已同步');
        }).catch((e) => {
          console.error(e);
          setStatus('云端同步波动');
        });
      }, 1000);
    }

    async function loadInfo() {
      setStatus('正在同步中...', 'syncing');
      try {
        currentData = await CourseStore.load();
        render(); // Use render() instead of renderUI()
        await loadPosts(); // 同时加载动态
        setStatus('云端同步就绪 (Cloud Connected)');
      } catch (e) {
        console.error(e);
        currentData = CourseStore.cloneDefaults();
        render();
        setStatus('云端连接超时 (离线)');
      }
    }

    async function loadPosts() {
      const posts = await CourseStore.getPosts();
      const container = document.getElementById('postsList');
      if (posts.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px;">暂无评价动态</div>';
        return;
      }
      container.innerHTML = posts.map(p => `
        <div class="post-admin-item">
          <div class="post-admin-info">
            <div class="post-admin-user">${p.user_nickname || '学习伙伴'}</div>
            <div class="post-admin-content">${p.content}</div>
            <div class="post-admin-time">${new Date(p.created_at).toLocaleString()}</div>
          </div>
          <button class="btn-danger" onclick="deletePost('${p.id}')">
            <i data-lucide="trash-2" size="16"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function deletePost(id) {
      if (!confirm('确定要删除这条评价吗？此操作不可撤销。')) return;
      setStatus('正在删除...', 'syncing');
      await CourseStore.deletePost(id);
      await loadPosts(); // Re-render posts after deletion
      setStatus('删除成功');
      showToast('评价已移除');
    }

    // Initial load
    loadInfo();
  </script>
</body>
</html>
