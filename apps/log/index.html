<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志</title>
    <link rel="dns-prefetch" href="//fmxddvjgkykuqwmasigo.supabase.co">
    <link rel="preconnect" href="https://fmxddvjgkykuqwmasigo.supabase.co" crossorigin>
    <script>
        // 冷启动预取：不等待 SDK，在 HTML/CSS 解析期间直接读取首屏。
        window.LOG_CONFIG = {
            url: 'https://fmxddvjgkykuqwmasigo.supabase.co',
            key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZteGRkdmpna3lrdXF3bWFzaWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwNDMzMjcsImV4cCI6MjA1OTYxOTMyN30.XCU4-03oajGh6M2-PNiBotCZSIDn_nJXkIC0Thjjfqo'
        };
        window.LOG_BOOTSTRAP = (() => {
            const config = window.LOG_CONFIG;
            let origin = config.url;
            try {
                const cached = JSON.parse(localStorage.getItem('app-network-best-v2') || 'null');
                if (cached && Date.now() - cached.savedAt < 6 * 60 * 60 * 1000 && /^https:\/\//.test(cached.origin)) {
                    origin = cached.origin;
                }
            } catch (_) { }

            const headers = {
                apikey: config.key,
                Authorization: `Bearer ${config.key}`,
                Accept: 'application/json'
            };
            const request = (method, params, priority) => {
                const url = new URL(`${origin}/rest/v1/logs_list`);
                Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 6500);
                return fetch(url, {
                    method,
                    headers: Object.assign({}, headers, method === 'HEAD' ? { Prefer: 'count=exact' } : {}),
                    mode: 'cors',
                    credentials: 'omit',
                    cache: 'no-store',
                    priority,
                    signal: controller.signal
                }).then(async response => {
                    if (!response.ok) throw new Error(`冷启动请求失败: HTTP ${response.status}`);
                    const total = Number((response.headers.get('content-range') || '').split('/')[1]);
                    return { data: method === 'HEAD' ? [] : await response.json(), count: Number.isFinite(total) ? total : null, error: null };
                }, error => ({ data: null, count: null, error }))
                    .catch(error => ({ data: null, count: null, error }))
                    .finally(() => clearTimeout(timer));
            };

            return {
                used: false,
                page: request('GET', {
                    select: 'id,content_preview,content_size,created_at,updated_at',
                    order: 'created_at.desc',
                    limit: '20'
                }, 'high'),
                // 精确总数不阻塞日志列表显示。
                count: request('HEAD', { select: 'id' }, 'low').then(result => result.error ? null : result.count)
            };
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" href="../vendor/supabase.min.js" as="script">
    <script src="../vendor/supabase.min.js" defer></script>
    <script src="../network.js" defer></script>
    <script>
        // 本地 SDK 已由上方 defer 脚本优先加载；这里仅保留跨区域 CDN 兜底。
        const CDN = [
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://unpkg.com/@supabase/supabase-js@2'
        ];

        const load = {
            script(url) {
                return new Promise((ok, fail) => {
                    // 如果已经由于之前的 CDN 加载成功了，则直接返回
                    if (window.supabase && window.supabase.createClient) return ok();

                    const s = document.createElement('script');
                    s.src = url;
                    s.async = true;
                    const t = setTimeout(() => { s.remove(); fail('timeout'); }, 5000);
                    s.onload = () => { clearTimeout(t); ok(); };
                    s.onerror = () => { clearTimeout(t); s.remove(); fail('error'); };
                    document.head.appendChild(s);
                });
            },
            wait() {
                return new Promise((ok, fail) => {
                    if (window.supabase && window.supabase.createClient) return ok();
                    let n = 0;
                    const c = () => {
                        if (window.supabase && window.supabase.createClient) return ok();
                        if (++n > 50) return fail('wait_timeout');
                        setTimeout(c, 100);
                    };
                    c();
                });
            },
            async init() {
                // 如果已经存在，直接发信号
                if (window.supabase && window.supabase.createClient) {
                    window.dispatchEvent(new Event('cdnReady'));
                    return;
                }

                // 为了避免变量声明冲突，我们按照顺序尝试 CDN，而不是竞速加载
                // 因为部分 CDN 库如果不小心加载了两次且库内部使用了 const，会导致闪退
                console.log('正在加载数据库服务...');
                for (const u of CDN) {
                    try {
                        await this.script(u);
                        await this.wait();
                        console.log('CDN 加载成功:', u);
                        window.dispatchEvent(new Event('cdnReady'));
                        return;
                    } catch (e) {
                        console.warn('CDN 加载失败，切换源:', u);
                    }
                }

                // 所有源都失败
                window.dispatchEvent(new Event('cdnError'));
            }
        };

        document.addEventListener('DOMContentLoaded', () => load.init());
    </script>
</head>

<body>
    <div class="container">
        <div class="header-row">
            <h1 class="page-title">日志</h1>
            <div id="statusIndicator" class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">初始化中...</span>
            </div>
        </div>
        <form id="logForm" class="form-container">
            <div id="logContent" class="form-content" contenteditable="true"
                placeholder="随手记录点什么..."></div>
            <div class="form-actions">
                <button type="button" id="cancelBtn" class="btn btn-cancel hidden">取消</button>
                <button type="submit" id="submitBtn" class="btn btn-primary">保存</button>
            </div>
        </form>
        <div id="timeline" class="timeline-container">
        </div>
        <nav id="pagination" class="pagination hidden" aria-label="日志分页">
            <button type="button" id="prevPageBtn" class="page-nav">上一页</button>
            <div id="pageTabs" class="page-tabs"></div>
            <button type="button" id="nextPageBtn" class="page-nav">下一页</button>
        </nav>
        <div id="emptyState" class="empty-state hidden">暂无日志</div>
        <div id="errorState" class="error-wrapper hidden">
            <p>连接失败，请检查网络</p>
            <button onclick="location.reload()" class="btn btn-small">重试</button>
        </div>
    </div>
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <p class="modal-text">确定删除？</p>
            <div class="modal-actions">
                <button id="cancelDelete" class="btn btn-cancel">取消</button>
                <button id="confirmDelete" class="btn btn-danger">删除</button>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>

</html>
