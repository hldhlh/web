<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蔬菜盘点</title>
  <style>
    :root{--bg:#0b0c10;--card:#14161d;--muted:#a9afc3;--text:#eef0f6;--border:rgba(255,255,255,.12);--accent:#2f81f7;}
    @media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--card:#ffffff;--muted:#5c6275;--text:#111423;--border:rgba(0,0,0,.08)}}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Display",system-ui,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:10}
    .wrap{max-width:980px;margin:0 auto;padding:14px 16px}
    .top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    h1{font-size:16px;margin:0;font-weight:700}
    .muted{color:var(--muted);font-size:12px}
    input,button{border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);padding:10px 12px;font-size:14px;outline:none}
    input[type=date]{padding:9px 12px}
    button{cursor:pointer}
    .primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:650}
    .ghost{background:transparent}
    main{max-width:980px;margin:0 auto;padding:14px 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid var(--border);padding:10px 12px;text-align:left}
    th{font-size:12px;color:var(--muted);font-weight:650}
    td input{width:110px}
    .name{min-width:180px}
    .unit{width:90px;color:var(--muted)}
    .row-actions{display:flex;gap:8px;justify-content:flex-end}
    .danger{border-color:rgba(255,93,93,.35);color:#ff5d5d}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:2px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
    details{border-top:1px solid var(--border)}
    summary{list-style:none;cursor:pointer;padding:12px;color:var(--muted);font-size:13px}
    summary::-webkit-details-marker{display:none}
    .grid{display:grid;gap:10px;padding:0 12px 12px 12px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media (max-width:720px){.grid2{grid-template-columns:1fr}}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="top">
        <div class="left">
          <a href="../../index.html" class="pill" style="text-decoration:none">←</a>
          <h1>蔬菜盘点</h1>
          <span id="status" class="pill">未连接</span>
          <input id="date" type="date" />
        </div>
        <div class="left">
          <button id="btnSave" class="primary">保存</button>
          <button id="btnSync" class="ghost">同步</button>
        </div>
      </div>
      <div class="muted" style="padding-top:8px">
        用量 = 昨库存 + 今进货 − 今库存。订货建议用近N天平均用量。
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <div style="overflow:auto">
        <table id="tbl">
          <thead>
            <tr>
              <th class="name">品名</th>
              <th style="width:140px">库存</th>
              <th style="width:140px">进货</th>
              <th class="unit">单位</th>
              <th style="width:120px"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="toolbar">
        <input id="newName" placeholder="新增品名" style="min-width:220px" />
        <input id="newUnit" placeholder="单位(斤/把…)" style="width:160px" />
        <button id="btnAdd" class="ghost">添加</button>
        <div style="flex:1"></div>
        <button id="btnExport" class="ghost">导出</button>
        <button id="btnImport" class="ghost">导入</button>
        <input id="importFile" type="file" accept="application/json" style="display:none" />
      </div>
      <details>
        <summary>分析 / 对比 / 订货建议</summary>
        <div class="grid">
          <div class="grid2">
            <label class="muted">近N天平均 <input id="avgWindow" type="number" min="1" step="1" value="3" style="margin-left:8px;width:120px" /></label>
            <label class="muted">目标覆盖天数 <input id="targetDays" type="number" min="0" step="0.5" value="1" style="margin-left:8px;width:120px" /></label>
          </div>
          <div class="grid2">
            <label class="muted">安全天数 <input id="safetyDays" type="number" min="0" step="0.5" value="0.5" style="margin-left:8px;width:120px" /></label>
            <label class="muted">订货取整(0不取整) <input id="roundTo" type="number" min="0" step="0.5" value="0" style="margin-left:8px;width:120px" /></label>
          </div>
          <div id="analysis" class="muted">—</div>
          <div style="overflow:auto">
            <table id="tblSuggest">
              <thead>
                <tr>
                  <th class="name">品名</th>
                  <th>近N天均用量</th>
                  <th>今日库存</th>
                  <th>预计明日需用</th>
                  <th>建议订货</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div style="overflow:auto">
            <table id="tblCompare">
              <thead>
                <tr>
                  <th class="name">品名</th>
                  <th>昨库存</th>
                  <th>今进货</th>
                  <th>今库存</th>
                  <th>用量</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </details>
    </div>
  </main>

  <script src="./config.js"></script>
  <script src="../vendor/supabase.min.js"></script>
  <script src="../network.js"></script>
  <script>
  (function(){
    const CFG = window.VEGCHECK_SUPABASE || {url:'', anonKey:'', useAuth:true};

    const $ = (id)=>document.getElementById(id);
    const todayStr = () => {
      const d = new Date();
      const z = (n)=>String(n).padStart(2,'0');
      return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
    };
    const esc = (s)=>String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const num = (v)=>{ if(v===''||v==null) return null; const n=Number(v); return Number.isFinite(n)? n : null; };
    const clamp0 = (n)=> n==null? null : Math.max(0,n);
    const roundTo = (value, step)=>{ if(!step || step<=0) return value; return Math.round(value/step)*step; };

    const LS_FALLBACK = 'vegcheck.fallback.v1';

    let supabase = null;
    let user = null;

    async function initSupabase(){
      if (!CFG.url || !CFG.anonKey){
        setStatus('未配置Supabase', false);
        return;
      }
      supabase = window.supabase.createClient(CFG.url, CFG.anonKey);
      try{
        if (CFG.useAuth){
          const { data } = await supabase.auth.getSession();
          if (!data.session){
            const res = await supabase.auth.signInAnonymously();
            if (res.error) throw res.error;
          }
          const { data: s2 } = await supabase.auth.getSession();
          user = s2.session?.user || null;
        }
        setStatus('已连接', true);
      }catch(e){
        console.warn(e);
        setStatus('连接失败(用本地)', false);
      }
    }

    function setStatus(text, ok){
      $('status').textContent = text;
      $('status').style.color = ok ? '#35d07f' : '';
    }

    async function ensureSchemaHint(){
      // no-op: schema is created in Supabase via SQL. Provide SQL to user in chat.
    }

    async function apiListItems(){
      if (supabase && CFG.url && CFG.anonKey){
        const q = supabase.from('veg_items').select('id,name,unit,sort').order('sort',{ascending:true}).order('created_at',{ascending:true});
        const { data, error } = await q;
        if (!error) return data || [];
        console.warn(error);
      }
      const st = JSON.parse(localStorage.getItem(LS_FALLBACK) || '{"items":[],"daily":{}}');
      return st.items || [];
    }

    async function apiAddItem(name, unit){
      if (supabase && CFG.url && CFG.anonKey){
        const { error } = await supabase.from('veg_items').insert({ name, unit, sort: Date.now() });
        if (!error) return;
        console.warn(error);
      }
      const st = JSON.parse(localStorage.getItem(LS_FALLBACK) || '{"items":[],"daily":{}}');
      st.items ||= [];
      st.items.unshift({ id: crypto.randomUUID(), name, unit, sort: Date.now() });
      localStorage.setItem(LS_FALLBACK, JSON.stringify(st));
    }

    async function apiDeleteItem(id){
      if (supabase && CFG.url && CFG.anonKey){
        const { error } = await supabase.from('veg_items').delete().eq('id', id);
        if (!error) return;
        console.warn(error);
      }
      const st = JSON.parse(localStorage.getItem(LS_FALLBACK) || '{"items":[],"daily":{}}');
      st.items = (st.items||[]).filter(x=>x.id!==id);
      localStorage.setItem(LS_FALLBACK, JSON.stringify(st));
    }

    async function apiGetDaily(date){
      if (supabase && CFG.url && CFG.anonKey){
        const { data, error } = await supabase.from('veg_daily').select('item_id,stock,inbound').eq('date', date);
        if (!error) {
          const map = {};
          (data||[]).forEach(r=>{ map[r.item_id] = { stock: r.stock==null?null:Number(r.stock), inbound: r.inbound==null?null:Number(r.inbound) }; });
          return map;
        }
        console.warn(error);
      }
      const st = JSON.parse(localStorage.getItem(LS_FALLBACK) || '{"items":[],"daily":{}}');
      return (st.daily && st.daily[date]) || {};
    }

    async function apiUpsertDaily(date, itemId, patch){
      const record = { date, item_id: itemId, ...patch };
      if (supabase && CFG.url && CFG.anonKey){
        const { error } = await supabase.from('veg_daily').upsert(record, { onConflict: 'date,item_id' });
        if (!error) return;
        console.warn(error);
      }
      const st = JSON.parse(localStorage.getItem(LS_FALLBACK) || '{"items":[],"daily":{}}');
      st.daily ||= {};
      st.daily[date] ||= {};
      st.daily[date][itemId] ||= { stock:null, inbound:null };
      st.daily[date][itemId] = { ...st.daily[date][itemId], ...patch };
      localStorage.setItem(LS_FALLBACK, JSON.stringify(st));
    }

    async function apiListDates(limit=60){
      if (supabase && CFG.url && CFG.anonKey){
        const { data, error } = await supabase.from('veg_daily').select('date').order('date',{ascending:true}).limit(5000);
        if (!error){
          const set = new Set((data||[]).map(x=>x.date));
          return Array.from(set).sort().slice(-limit);
        }
        console.warn(error);
      }
      const st = JSON.parse(localStorage.getItem(LS_FALLBACK) || '{"items":[],"daily":{}}');
      return Object.keys(st.daily||{}).sort().slice(-limit);
    }

    function calcUsage(prevStock, inbound, stock){
      if (prevStock==null || stock==null) return null;
      const inb = inbound==null ? 0 : inbound;
      return prevStock + inb - stock;
    }

    async function avgUsage(itemId, date, windowDays){
      const dates = await apiListDates(365);
      const idx = dates.indexOf(date);
      if (idx <= 0) return null;
      const take = dates.slice(0, idx+1);
      const usages = [];
      for (let i=1;i<take.length;i++){
        const d = take[i], p = take[i-1];
        const prev = await apiGetDaily(p);
        const cur = await apiGetDaily(d);
        const u = calcUsage(prev[itemId]?.stock ?? null, cur[itemId]?.inbound ?? null, cur[itemId]?.stock ?? null);
        if (u==null) continue;
        usages.push(u);
      }
      const slice = usages.slice(-Math.max(1, windowDays));
      if (!slice.length) return null;
      return slice.reduce((a,b)=>a+b,0)/slice.length;
    }

    function fmt(n){
      if (n==null || Number.isNaN(n)) return '<span class="muted">—</span>';
      return `<span>${Math.round(Number(n)*100)/100}</span>`;
    }

    async function render(){
      const date = $('date').value || todayStr();
      $('date').value = date;

      const items = await apiListItems();
      const daily = await apiGetDaily(date);

      const tbody = $('tbl').querySelector('tbody');
      tbody.innerHTML = '';

      for (const item of items){
        const e = daily[item.id] || {stock:null, inbound:null};
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="name"><b>${esc(item.name)}</b></td>
          <td><input type="number" step="0.01" inputmode="decimal" data-id="${item.id}" data-k="stock" value="${e.stock ?? ''}" placeholder="库存" /></td>
          <td><input type="number" step="0.01" inputmode="decimal" data-id="${item.id}" data-k="inbound" value="${e.inbound ?? ''}" placeholder="进货" /></td>
          <td class="unit">${esc(item.unit||'')}</td>
          <td><div class="row-actions"><button class="danger" data-del="${item.id}">删</button></div></td>
        `;
        tbody.appendChild(tr);
      }

      await renderAnalysis(items, date);
    }

    async function renderAnalysis(items, date){
      const dates = await apiListDates(365);
      const idx = dates.indexOf(date);
      const pDate = idx>0 ? dates[idx-1] : null;

      const compareBody = $('tblCompare').querySelector('tbody');
      compareBody.innerHTML = '';

      const suggestBody = $('tblSuggest').querySelector('tbody');
      suggestBody.innerHTML = '';

      const aw = Math.max(1, Number($('avgWindow').value || 3));
      const targetDays = Math.max(0, Number($('targetDays').value || 1));
      const safetyDays = Math.max(0, Number($('safetyDays').value || 0.5));
      const rStep = Math.max(0, Number($('roundTo').value || 0));

      if (!pDate){
        $('analysis').innerHTML = '先保存至少两天数据，才能计算用量/订货建议。';
        return;
      }

      $('analysis').innerHTML = `对比区间：<span class="mono">${pDate}</span> → <span class="mono">${date}</span>；建议订货 = max(0, 近${aw}天均用量×(${targetDays}+${safetyDays}) − 今日库存)`;

      const prev = await apiGetDaily(pDate);
      const cur = await apiGetDaily(date);

      for (const item of items){
        const p = prev[item.id] || {};
        const c = cur[item.id] || {};
        const u = calcUsage(p.stock ?? null, c.inbound ?? null, c.stock ?? null);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="name"><b>${esc(item.name)}</b></td>
          <td>${fmt(p.stock)}</td>
          <td>${fmt(c.inbound)}</td>
          <td>${fmt(c.stock)}</td>
          <td>${fmt(u)}</td>
        `;
        compareBody.appendChild(tr);

        const avg = await avgUsage(item.id, date, aw);
        const predicted = avg;
        const curStock = c.stock ?? null;
        const targetStock = (predicted==null) ? null : predicted * (targetDays + safetyDays);
        let order = (targetStock==null || curStock==null) ? null : Math.max(0, targetStock - curStock);
        if (order!=null) order = roundTo(order, rStep);

        const tr2 = document.createElement('tr');
        tr2.innerHTML = `
          <td class="name"><b>${esc(item.name)}</b> <span class="muted">${esc(item.unit||'')}</span></td>
          <td>${fmt(avg)}</td>
          <td>${fmt(curStock)}</td>
          <td>${fmt(predicted)}</td>
          <td><b>${order==null?'—':(Math.round(order*100)/100)}</b></td>
        `;
        suggestBody.appendChild(tr2);
      }
    }

    // event wiring
    $('date').value = todayStr();

    $('tbl').addEventListener('input', async (e)=>{
      const t = e.target;
      if (!(t instanceof HTMLInputElement)) return;
      const id = t.dataset.id;
      const k = t.dataset.k;
      if (!id || !k) return;
      const date = $('date').value;
      const v = clamp0(num(t.value));
      await apiUpsertDaily(date, id, { [k]: v });
      // lightweight: refresh analysis only
      const items = await apiListItems();
      await renderAnalysis(items, date);
    });

    $('tbl').addEventListener('click', async (e)=>{
      const b = e.target;
      if (!(b instanceof HTMLButtonElement)) return;
      const id = b.dataset.del;
      if (!id) return;
      if (!confirm('删除该品种？')) return;
      await apiDeleteItem(id);
      await render();
    });

    $('btnAdd').addEventListener('click', async ()=>{
      const name = $('newName').value.trim();
      const unit = $('newUnit').value.trim();
      if (!name) return;
      await apiAddItem(name, unit);
      $('newName').value='';
      $('newUnit').value='';
      await render();
    });

    $('btnSave').addEventListener('click', ()=> alert('已保存（输入时会自动写入）。'));
    $('btnSync').addEventListener('click', render);

    $('btnExport').addEventListener('click', async ()=>{
      const payload = {
        exportedAt: new Date().toISOString(),
        items: await apiListItems(),
        dates: await apiListDates(365),
        daily: {}
      };
      const dates = payload.dates;
      for (const d of dates){ payload.daily[d] = await apiGetDaily(d); }
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `蔬菜盘点_export_${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    });

    $('btnImport').addEventListener('click', ()=> $('importFile').click());
    $('importFile').addEventListener('change', async (e)=>{
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const text = await f.text();
      try{
        const data = JSON.parse(text);
        if (!confirm('导入会写入当前数据库/本地数据，确定继续？')) return;
        const items = data.items || [];
        // naive import: add items if missing by name
        const curItems = await apiListItems();
        const byName = new Map(curItems.map(x=>[x.name,x]));
        for (const it of items){
          if (!byName.has(it.name)) await apiAddItem(it.name, it.unit || '');
        }
        const finalItems = await apiListItems();
        const nameToId = new Map(finalItems.map(x=>[x.name,x.id]));
        const daily = data.daily || {};
        for (const [d, map] of Object.entries(daily)){
          for (const [oldId, val] of Object.entries(map||{})){
            // try map by item name if exists
            const oldItem = items.find(x=>x.id===oldId);
            const nid = oldItem ? nameToId.get(oldItem.name) : null;
            if (!nid) continue;
            await apiUpsertDaily(d, nid, { stock: val.stock ?? null, inbound: val.inbound ?? null });
          }
        }
        await render();
      }catch(err){
        alert('导入失败：不是有效的JSON。');
      }finally{
        e.target.value = '';
      }
    });

    ['avgWindow','targetDays','safetyDays','roundTo'].forEach(id=>{
      $(id).addEventListener('input', async ()=>{
        const items = await apiListItems();
        await renderAnalysis(items, $('date').value);
      });
    });

    // init
    (async ()=>{
      await initSupabase();
      await ensureSchemaHint();
      await render();
    })();
  })();
  </script>
</body>
</html>
