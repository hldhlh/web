<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>我的头像 · 极简标识</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8f9fa;
      --fg: #111827;
      --muted: #6b7280;
      --border: rgba(0, 0, 0, 0.08);
      --border-focus: #111827;
      --panel: rgba(255, 255, 255, 0.85);
      --panel-hover: #ffffff;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --stage-bg: #ffffff;
      --btn-bg: #111827;
      --btn-fg: #ffffff;
      --btn-hover: #1f2937;
      --radius: 12px;
      --radius-sm: 8px;
    }

    [data-theme="dark"] {
      --bg: #090a0f;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
      --border-focus: #f3f4f6;
      --panel: rgba(18, 20, 29, 0.85);
      --panel-hover: #161922;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      --stage-bg: #12141d;
      --btn-bg: #f3f4f6;
      --btn-fg: #090a0f;
      --btn-hover: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
    }

    /* 极简顶栏 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-back:hover {
      color: var(--fg);
      border-color: var(--border-focus);
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* 快捷导出按钮组 */
    .export-group {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--panel);
      padding: 2px;
      gap: 2px;
    }

    .btn-export {
      border: none;
      background: transparent;
      color: var(--fg);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn-export:hover {
      background: var(--btn-bg);
      color: var(--btn-fg);
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--fg);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      border-color: var(--border-focus);
      background: var(--panel-hover);
    }

    /* 核心舞台与控件区 */
    .workspace {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      flex: 1;
      justify-content: center;
    }

    .preview-card {
      position: relative;
      width: min(65vw, 240px);
      aspect-ratio: 1;
      border-radius: 20px;
      background: var(--stage-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .icon-svg {
      width: 80%;
      height: 80%;
      display: block;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.16));
    }

    /* 高效控制台 */
    .control-panel {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .text-input {
      flex: 1;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--panel);
      color: var(--fg);
      font-size: 0.9rem;
      padding: 0 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .text-input:focus {
      border-color: var(--border-focus);
    }

    .color-swatches {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: space-between;
    }

    /* 快速预设气泡 */
    .presets {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .preset-chip {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .preset-chip:hover {
      transform: scale(1.15);
      border-color: var(--border-focus);
    }

    .preset-chip::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot-color, #fff);
    }

    /* 自定义调色卡片 */
    .pickers {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
    }

    .color-btn:hover {
      border-color: var(--border-focus);
    }

    .color-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .color-picker-native {
      position: absolute;
      opacity: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* 极简页脚 */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .container {
        padding: 1rem;
      }
      .preview-card {
        width: 60vw;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部极简导航与高效导出 -->
    <header class="header">
      <div class="header-left">
        <a href="../../index.html" class="nav-back" title="返回主页" aria-label="返回主页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </a>
        <span class="title">我的头像</span>
      </div>

      <div class="header-actions">
        <!-- 单击即刻导出：省去二级菜单 -->
        <div class="export-group" role="group" aria-label="快捷导出">
          <button class="btn-export download-btn" type="button" data-format="png" title="下载 1024px PNG">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            PNG
          </button>
          <button class="btn-export download-btn" type="button" data-format="jpeg" title="下载 1024px JPEG">
            JPG
          </button>
        </div>

        <!-- 主题切换 -->
        <button id="themeToggle" class="btn-icon" type="button" title="切换暗黑/日间模式" aria-label="切换主题">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 工作台舞台 -->
    <main class="workspace">
      <div class="preview-card">
        <svg class="icon-svg export-svg" width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="矢量头像预览">
          <defs>
            <radialGradient id="mistGradient" cx="64" cy="64" r="64" fx="64" fy="64" gradientUnits="userSpaceOnUse">
              <stop class="mist-stop" offset="0%" style="stop-color:#000000;stop-opacity:1" />
              <stop class="mist-stop" offset="34%" style="stop-color:#000000;stop-opacity:1" />
              <stop class="mist-stop" offset="43%" style="stop-color:#000000;stop-opacity:0.96" />
              <stop class="mist-stop" offset="52%" style="stop-color:#000000;stop-opacity:0.86" />
              <stop class="mist-stop" offset="61%" style="stop-color:#000000;stop-opacity:0.72" />
              <stop class="mist-stop" offset="70%" style="stop-color:#000000;stop-opacity:0.55" />
              <stop class="mist-stop" offset="79%" style="stop-color:#000000;stop-opacity:0.36" />
              <stop class="mist-stop" offset="87%" style="stop-color:#000000;stop-opacity:0.2" />
              <stop class="mist-stop" offset="94%" style="stop-color:#000000;stop-opacity:0.09" />
              <stop class="mist-stop" offset="98%" style="stop-color:#000000;stop-opacity:0.025" />
              <stop class="mist-stop" offset="100%" style="stop-color:#000000;stop-opacity:0" />
            </radialGradient>
            <radialGradient id="softMist" cx="64" cy="64" r="64" fx="64" fy="64" gradientUnits="userSpaceOnUse">
              <stop class="mist-stop" offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
              <stop class="mist-stop" offset="45%" style="stop-color:#000000;stop-opacity:0.24" />
              <stop class="mist-stop" offset="72%" style="stop-color:#000000;stop-opacity:0.13" />
              <stop class="mist-stop" offset="90%" style="stop-color:#000000;stop-opacity:0.045" />
              <stop class="mist-stop" offset="100%" style="stop-color:#000000;stop-opacity:0" />
            </radialGradient>
            <filter id="mistBlur" x="-12%" y="-12%" width="124%" height="124%">
              <feGaussianBlur stdDeviation="2.8" />
            </filter>
          </defs>
          <rect width="128" height="128" fill="url(#softMist)" filter="url(#mistBlur)" />
          <rect width="128" height="128" fill="url(#mistGradient)" />
          <text id="iconText" x="84" y="76" fill="#ffffff" font-family="Snell Roundhand, Brush Script MT, Georgia, cursive" font-size="13" font-style="italic" font-weight="600" text-anchor="middle">Aries</text>
        </svg>
      </div>

      <!-- 紧凑高效控制栏 -->
      <section class="control-panel" aria-label="参数调节">
        <div class="input-row">
          <input id="textInput" class="text-input" type="text" value="Aries" maxlength="18" placeholder="输入签名或文本…" autocomplete="off" aria-label="头像文本">
        </div>

        <div class="color-swatches">
          <!-- 一键经典预设 -->
          <div class="presets" title="快捷配色预设">
            <button class="preset-chip" type="button" style="background:#000000;--dot-color:#ffffff" data-mist="#000000" data-text="#ffffff" title="暗黑经典"></button>
            <button class="preset-chip" type="button" style="background:#1e293b;--dot-color:#38bdf8" data-mist="#1e293b" data-text="#38bdf8" title="深海星空"></button>
            <button class="preset-chip" type="button" style="background:#262626;--dot-color:#f59e0b" data-mist="#262626" data-text="#f59e0b" title="黑金质感"></button>
            <button class="preset-chip" type="button" style="background:#1c3d2e;--dot-color:#a7f3d0" data-mist="#1c3d2e" data-text="#a7f3d0" title="林间冷杉"></button>
            <button class="preset-chip" type="button" style="background:#e5e7eb;--dot-color:#111827" data-mist="#e5e7eb" data-text="#111827" title="极简浅灰"></button>
          </div>

          <!-- 精准调色 -->
          <div class="pickers">
            <label class="color-btn" title="更改雾气颜色">
              <span id="mistDot" class="color-circle" style="background:#000000"></span>
              <span>雾气</span>
              <input id="mistPicker" class="color-picker-native" type="color" value="#000000">
            </label>
            <label class="color-btn" title="更改文字颜色">
              <span id="textDot" class="color-circle" style="background:#ffffff"></span>
              <span>文字</span>
              <input id="textPicker" class="color-picker-native" type="color" value="#ffffff">
            </label>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部信息 -->
    <footer class="footer">
      <span>1024 × 1024 高清生成</span>
      <span>1 键极速导出</span>
    </footer>
  </div>

  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById("themeToggle");
    const exportSvg = document.querySelector(".export-svg");
    const iconText = document.getElementById("iconText");
    const textInput = document.getElementById("textInput");
    const mistPicker = document.getElementById("mistPicker");
    const textPicker = document.getElementById("textPicker");
    const mistDot = document.getElementById("mistDot");
    const textDot = document.getElementById("textDot");
    const mistStops = document.querySelectorAll(".mist-stop");
    const presetChips = document.querySelectorAll(".preset-chip");
    const downloadBtns = document.querySelectorAll(".download-btn");
    const media = window.matchMedia("(prefers-color-scheme: dark)");

    // 主题管理
    function updateTheme(t, save = true) {
      root.dataset.theme = t;
      if (save) localStorage.setItem("avatar-theme", t);
    }

    const savedTheme = localStorage.getItem("avatar-theme") || (media.matches ? "dark" : "light");
    updateTheme(savedTheme, false);

    themeBtn.addEventListener("click", () => {
      const next = root.dataset.theme === "dark" ? "light" : "dark";
      if (document.startViewTransition) {
        document.startViewTransition(() => updateTheme(next));
      } else {
        updateTheme(next);
      }
    });

    media.addEventListener("change", (e) => {
      if (!localStorage.getItem("avatar-theme")) {
        updateTheme(e.matches ? "dark" : "light", false);
      }
    });

    // 颜色与文字实时同步
    function setMistColor(color) {
      mistStops.forEach(stop => stop.style.stopColor = color);
      mistPicker.value = color;
      mistDot.style.background = color;
    }

    function setTextColor(color) {
      iconText.setAttribute("fill", color);
      textPicker.value = color;
      textDot.style.background = color;
    }

    textInput.addEventListener("input", () => {
      iconText.textContent = textInput.value || " ";
    });

    mistPicker.addEventListener("input", (e) => setMistColor(e.target.value));
    textPicker.addEventListener("input", (e) => setTextColor(e.target.value));

    // 预设一键应用
    presetChips.forEach(chip => {
      chip.addEventListener("click", () => {
        setMistColor(chip.dataset.mist);
        setTextColor(chip.dataset.text);
      });
    });

    // 极速高清导出
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    async function exportImage(format) {
      const size = 1024;
      const clone = exportSvg.cloneNode(true);
      clone.removeAttribute("class");
      clone.removeAttribute("role");
      clone.removeAttribute("aria-label");

      const svgString = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);

      try {
        const img = await loadImage(svgUrl);
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        if (format === "jpeg") {
          ctx.fillStyle = root.dataset.theme === "dark" ? "#090a0f" : "#ffffff";
          ctx.fillRect(0, 0, size, size);
        }

        ctx.drawImage(img, 0, 0, size, size);

        const mime = format === "jpeg" ? "image/jpeg" : "image/png";
        const ext = format === "jpeg" ? "jpg" : "png";
        const link = document.createElement("a");
        link.download = `avatar.${ext}`;
        link.href = canvas.toDataURL(mime, format === "jpeg" ? 0.95 : undefined);
        link.click();
      } finally {
        URL.revokeObjectURL(svgUrl);
      }
    }

    downloadBtns.forEach(btn => {
      btn.addEventListener("click", () => exportImage(btn.dataset.format));
    });
  </script>
</body>
</html>
