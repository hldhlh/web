<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --fg: #111111;
      --muted: #6c6c66;
      --panel: rgba(255, 255, 255, 0.74);
      --panel-border: rgba(17, 17, 17, 0.12);
      --button-bg: #111111;
      --button-fg: #ffffff;
      --shadow: 0 24px 70px rgba(20, 20, 20, 0.14);
    }

    [data-theme="dark"] {
      --bg: #060606;
      --fg: #f4f4f0;
      --muted: #a8a8a0;
      --panel: rgba(20, 20, 20, 0.78);
      --panel-border: rgba(255, 255, 255, 0.12);
      --button-bg: #f4f4f0;
      --button-fg: #111111;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% 36%, rgba(0, 0, 0, 0.08), transparent 34rem),
        var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background-color 220ms ease, color 220ms ease;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 4vw, 48px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: grid;
      gap: 3px;
    }

    .brand strong {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .brand span,
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 5px 6px 5px 14px;
      background: var(--panel);
      color: var(--fg);
      font: inherit;
      cursor: pointer;
      backdrop-filter: blur(18px);
      transition: border-color 180ms ease, transform 180ms ease;
    }

    .theme-toggle:hover,
    .download-button:hover,
    .download-option:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--fg), transparent 68%);
    }

    .theme-toggle:focus-visible,
    .download-button:focus-visible,
    .download-option:focus-visible {
      outline: 3px solid rgba(0, 0, 0, 0.28);
      outline-offset: 3px;
    }

    .download-menu {
      position: relative;
    }

    .download-menu[open] .download-button {
      border-color: color-mix(in srgb, var(--fg), transparent 58%);
    }

    .download-menu summary {
      list-style: none;
    }

    .download-menu summary::-webkit-details-marker {
      display: none;
    }

    .download-button,
    .download-option {
      min-height: 40px;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--fg);
      font: inherit;
      cursor: pointer;
      backdrop-filter: blur(18px);
      transition: border-color 180ms ease, transform 180ms ease;
    }

    .download-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
    }

    .download-options {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 2;
      display: grid;
      gap: 6px;
      min-width: 132px;
      padding: 8px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .download-option {
      border-radius: 7px;
      padding: 0 12px;
      text-align: left;
    }

    .toggle-track {
      position: relative;
      width: 54px;
      height: 28px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--button-bg);
    }

    .toggle-knob {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--button-fg);
      transition: transform 200ms ease;
    }

    [data-theme="dark"] .toggle-knob {
      transform: translateX(26px);
    }

    .stage {
      display: grid;
      place-items: center;
      gap: 18px;
      padding: 7vh 0 5vh;
    }

    .icon-wrap {
      width: min(54vw, 360px);
      min-width: 180px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .icon {
      width: 72%;
      height: 72%;
      display: block;
      filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.18));
    }

    .editor {
      width: min(54vw, 360px);
      min-width: 180px;
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field span,
    .color-field span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .color-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0 10px 0 12px;
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .color-input {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 999px;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-input::-webkit-color-swatch {
      border: 1px solid var(--panel-border);
      border-radius: 999px;
    }

    .text-input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0 14px;
      background: var(--panel);
      color: var(--fg);
      font: inherit;
      outline: none;
      backdrop-filter: blur(18px);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .text-input:focus {
      border-color: color-mix(in srgb, var(--fg), transparent 58%);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.12);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 560px) {
      .page {
        padding: 18px;
      }

      .topbar {
        align-items: flex-start;
      }

      .actions {
        gap: 8px;
      }

      .theme-toggle {
        padding-left: 10px;
      }

      .theme-text,
      .download-text {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .icon-wrap {
        width: min(82vw, 340px);
      }

      .editor {
        width: min(82vw, 340px);
      }

      .color-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <strong>i.svg</strong>
        <span>128 x 128</span>
      </div>
      <div class="actions">
        <details class="download-menu">
          <summary class="download-button" aria-label="选择下载格式">
            <span aria-hidden="true">↓</span>
            <span class="download-text">下载</span>
          </summary>
          <div class="download-options">
            <button class="download-option" type="button" data-format="png">PNG</button>
            <button class="download-option" type="button" data-format="jpeg">JPEG</button>
          </div>
        </details>
        <button class="theme-toggle" type="button" aria-pressed="false" aria-label="切换日间和夜间模式">
          <span class="theme-text">日间</span>
          <span class="toggle-track" aria-hidden="true">
            <span class="toggle-knob"></span>
          </span>
        </button>
      </div>
    </header>

    <section class="stage" aria-label="图标预览">
      <div class="icon-wrap">
        <svg class="icon export-svg" width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="i.svg 图标">
          <defs>
            <radialGradient id="mistGradient" cx="64" cy="64" r="64" fx="64" fy="64" gradientUnits="userSpaceOnUse" spreadMethod="pad">
              <stop class="mist-stop" offset="0%" style="stop-color:#000000;stop-opacity:1" />
              <stop class="mist-stop" offset="34%" style="stop-color:#000000;stop-opacity:1" />
              <stop class="mist-stop" offset="43%" style="stop-color:#000000;stop-opacity:0.96" />
              <stop class="mist-stop" offset="52%" style="stop-color:#000000;stop-opacity:0.86" />
              <stop class="mist-stop" offset="61%" style="stop-color:#000000;stop-opacity:0.72" />
              <stop class="mist-stop" offset="70%" style="stop-color:#000000;stop-opacity:0.55" />
              <stop class="mist-stop" offset="79%" style="stop-color:#000000;stop-opacity:0.36" />
              <stop class="mist-stop" offset="87%" style="stop-color:#000000;stop-opacity:0.2" />
              <stop class="mist-stop" offset="94%" style="stop-color:#000000;stop-opacity:0.09" />
              <stop class="mist-stop" offset="98%" style="stop-color:#000000;stop-opacity:0.025" />
              <stop class="mist-stop" offset="100%" style="stop-color:#000000;stop-opacity:0" />
            </radialGradient>
            <radialGradient id="softMist" cx="64" cy="64" r="64" fx="64" fy="64" gradientUnits="userSpaceOnUse" spreadMethod="pad">
              <stop class="mist-stop" offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
              <stop class="mist-stop" offset="45%" style="stop-color:#000000;stop-opacity:0.24" />
              <stop class="mist-stop" offset="72%" style="stop-color:#000000;stop-opacity:0.13" />
              <stop class="mist-stop" offset="90%" style="stop-color:#000000;stop-opacity:0.045" />
              <stop class="mist-stop" offset="100%" style="stop-color:#000000;stop-opacity:0" />
            </radialGradient>
            <filter id="mistBlur" x="-12%" y="-12%" width="124%" height="124%">
              <feGaussianBlur stdDeviation="2.8" />
            </filter>
          </defs>
          <rect width="128" height="128" fill="url(#softMist)" filter="url(#mistBlur)" />
          <rect width="128" height="128" fill="url(#mistGradient)" />
          <text id="iconText" x="84" y="76" fill="#ffffff" font-family="Snell Roundhand, Brush Script MT, Georgia, cursive" font-size="13" font-style="italic" font-weight="600" text-anchor="middle">Aries</text>
        </svg>
      </div>
      <div class="editor">
        <label class="field">
          <span>文字</span>
          <input class="text-input" type="text" value="Aries" maxlength="18" autocomplete="off" aria-label="编辑图标文字">
        </label>
        <div class="color-grid">
          <label class="color-field">
            <span>雾气</span>
            <input class="color-input mist-color-input" type="color" value="#000000" aria-label="选择雾气颜色">
          </label>
          <label class="color-field">
            <span>文字</span>
            <input class="color-input text-color-input" type="color" value="#ffffff" aria-label="选择文字颜色">
          </label>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span class="meta">SVG preview</span>
      <span class="meta">Light / Dark</span>
    </footer>
  </main>

  <script>
    const root = document.documentElement;
    const button = document.querySelector(".theme-toggle");
    const label = document.querySelector(".theme-text");
    const downloadMenu = document.querySelector(".download-menu");
    const downloadOptions = document.querySelectorAll(".download-option");
    const exportSvg = document.querySelector(".export-svg");
    const iconText = document.querySelector("#iconText");
    const textInput = document.querySelector(".text-input");
    const mistColorInput = document.querySelector(".mist-color-input");
    const textColorInput = document.querySelector(".text-color-input");
    const mistStops = document.querySelectorAll(".mist-stop");
    const media = window.matchMedia("(prefers-color-scheme: dark)");

    function preferredTheme() {
      return media.matches ? "dark" : "light";
    }

    function setTheme(theme, persist) {
      root.dataset.theme = theme;
      button.setAttribute("aria-pressed", String(theme === "dark"));
      label.textContent = theme === "dark" ? "夜间" : "日间";

      if (persist) {
        localStorage.setItem("icon-preview-theme", theme);
      }
    }

    setTheme(localStorage.getItem("icon-preview-theme") || preferredTheme(), false);

    button.addEventListener("click", () => {
      setTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
    });

    media.addEventListener("change", () => {
      if (!localStorage.getItem("icon-preview-theme")) {
        setTheme(preferredTheme(), false);
      }
    });

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = url;
      });
    }

    function getSvgText() {
      const clone = exportSvg.cloneNode(true);
      clone.classList.remove("icon", "export-svg");
      clone.removeAttribute("role");
      clone.removeAttribute("aria-label");

      return new XMLSerializer().serializeToString(clone);
    }

    async function downloadIcon(format) {
      const size = 1024;
      const svgText = getSvgText();
      const svgBlob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);

      try {
        const image = await loadImage(svgUrl);
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        canvas.width = size;
        canvas.height = size;

        if (format === "jpeg") {
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, size, size);
        }

        context.drawImage(image, 0, 0, size, size);

        const mimeType = format === "jpeg" ? "image/jpeg" : "image/png";
        const extension = format === "jpeg" ? "jpg" : "png";
        const quality = format === "jpeg" ? 0.95 : undefined;
        const dataUrl = canvas.toDataURL(mimeType, quality);
        const link = document.createElement("a");
        link.href = dataUrl;
        link.download = `i.${extension}`;
        link.click();
      } finally {
        URL.revokeObjectURL(svgUrl);
      }
    }

    downloadOptions.forEach((option) => {
      option.addEventListener("click", () => {
        downloadMenu.open = false;
        downloadIcon(option.dataset.format);
      });
    });

    textInput.addEventListener("input", () => {
      iconText.textContent = textInput.value || " ";
    });

    mistColorInput.addEventListener("input", () => {
      mistStops.forEach((stop) => {
        stop.style.stopColor = mistColorInput.value;
      });
    });

    textColorInput.addEventListener("input", () => {
      iconText.setAttribute("fill", textColorInput.value);
    });

    document.addEventListener("click", (event) => {
      if (!downloadMenu.contains(event.target)) {
        downloadMenu.open = false;
      }
    });
  </script>
</body>
</html>
