<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景：极致暗夜 -->
    <linearGradient id="photoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1C31" />
      <stop offset="100%" style="stop-color:#02050D" />
    </linearGradient>

    <!-- 顶级全局物理扩散滤镜 -->
    <filter id="globalScatter" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="softGlow" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="sharpGlow" />
      <feMerge>
        <feMergeNode in="softGlow" />
        <feMergeNode in="sharpGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 琉璃渐变材质 -->
    <linearGradient id="glazeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="glazeViolet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- 1. 基础圆角容器 -->
  <rect x="8" y="8" width="84" height="84" rx="28" fill="url(#photoBg)" />

  <!-- 2. 环境背光：双色交织扩散 -->
  <g filter="url(#globalScatter)" opacity="0.3">
    <circle cx="35" cy="50" r="25" fill="#22D3EE">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="65" cy="50" r="25" fill="#818CF8">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 3. “叠影琉璃”核心 (The Stratified Glaze) -->
  <g filter="url(#globalScatter)">
    <!-- 底层滑块 -->
    <g transform="translate(50, 50)">
        <rect x="-18" y="-12" width="30" height="24" rx="6" fill="url(#glazeViolet)" stroke="white" stroke-width="0.5" stroke-opacity="0.3">
            <animateTransform attributeName="transform" type="translate" values="0 0; 2 -1; 0 0" dur="10s" repeatCount="indefinite" additive="sum" />
        </rect>
    </g>
    <!-- 顶层滑块 -->
    <g transform="translate(50, 50)">
        <rect x="-12" y="-18" width="30" height="24" rx="6" fill="url(#glazeCyan)" stroke="white" stroke-width="0.5" stroke-opacity="0.5">
            <animateTransform attributeName="transform" type="translate" values="0 0; -2 2; 0 0" dur="10s" repeatCount="indefinite" additive="sum" />
        </rect>
    </g>
  </g>

  <!-- 4. 极致锁边 -->
  <rect x="8" y="8" width="84" height="84" rx="28" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.1" />

  <!-- 5. 核心对焦点：极简的高光核心 -->
  <circle cx="50" cy="50" r="2" fill="white">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="1.5;2.5;1.5" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
