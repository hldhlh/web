<head>

    <link rel="preconnect" href="https://fastly.picsum.photos" crossorigin>

    <title>阅图 - 发现视觉之美</title>
    <style>
        :root {
            --primary-color: #0071e3;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --blur: 20px;
        }

        [data-theme='dark'] {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-main: #f5f5f7;
            --text-sub: #86868b;
            --glass-bg: rgba(28, 28, 30, 0.72);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Display", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 40px;
            height: 64px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        [data-theme='dark'] .header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-back {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .btn-back:hover {
            opacity: 1;
        }

        .title-area h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .sync-status {
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffcc00;
        }

        .status-dot.online {
            background: #34c759;
        }

        .action-area {
            display: flex;
            gap: 16px;
        }

        .btn-refresh {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-refresh:hover {
            transform: scale(1.05);
            background: #0077ed;
        }

        .btn-toggle-fav {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        [data-theme='dark'] .btn-toggle-fav {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-toggle-fav:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .btn-toggle-fav.active svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        .gallery-container {
            max-width: 1400px;
            margin: 84px auto 40px;
            padding: 0 20px;
        }

        .gallery-grid {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .gallery-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .photo-item {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: zoom-in;
            opacity: 0;
            transform: translateY(20px);
            animation: itemFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            content-visibility: auto;
            contain-intrinsic-size: auto 420px;
        }

        @keyframes itemFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }

        .photo-inner {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
            background: color-mix(in srgb, var(--card-bg), var(--text-sub) 10%);
            transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .photo-item:hover img {
            transform: scale(1.04);
        }

        .photo-item:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.4));
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            color: white;
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        .photo-info h2 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .photo-info p {
            font-size: 11px;
            opacity: 0.8;
        }

        .btn-favorite {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .photo-item:hover .btn-favorite {
            opacity: 1;
            transform: scale(1);
        }

        .btn-favorite:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.1) !important;
        }

        .btn-favorite.active {
            opacity: 1;
            background: white;
            border-color: transparent;
        }

        .btn-favorite.active svg {
            fill: #ff3b30;
            stroke: #ff3b30;
            animation: heartPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(20px);
            cursor: zoom-out;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox img.loaded {
            opacity: 1;
            transform: translate(var(--tx, 0), var(--ty, 0)) scale(var(--ts, 1));
        }

        .progress-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 2001;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
            transition: width 0.3s ease;
        }

        .progress-bar.loading {
            width: 35%;
            animation: progressSweep 1.2s ease-in-out infinite;
        }

        @keyframes progressSweep {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(360%); }
        }

        .preview-loader {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: white;
            z-index: 2001;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .header {
                height: 60px;
                padding: 0 16px;
            }

            .btn-back {
                font-size: 0;
            }

            .btn-toggle-fav,
            .btn-refresh {
                padding: 8px 11px;
            }

            .gallery-container {
                margin-top: 76px;
                padding: 0 12px;
            }

            .gallery-grid,
            .gallery-column {
                gap: 12px;
            }

            .photo-item {
                border-radius: 12px;
            }
        }
    </style>
    <script src="../vendor/supabase.min.js"></script>
    <script src="../network.js?v=20260827-8"></script>
</head>

<body>
    <header class="header">
        <a href="../../index.html" class="btn-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg> 返回首页
        </a>
        <div class="title-area">
            <h1>发现</h1>
            <div class="sync-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">云正在同步...</span>
            </div>
        </div>
        <div class="action-area">
            <button class="btn-toggle-fav" id="toggleFavBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z">
                    </path>
                </svg> 我的收藏
            </button>
            <button class="btn-refresh" id="refreshBtn">换一批</button>
        </div>
    </header>

    <main class="gallery-container">
        <div class="gallery-grid" id="galleryGrid"></div>
        <div id="loading" class="loading-indicator">正在探索更美的一面...</div>
    </main>

    <div id="lightbox" class="lightbox">
        <div class="progress-track" id="progressTrack">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="preview-loader" id="previewLoader">
            <div class="spinner"></div><span style="font-size: 13px; opacity: 0.8; letter-spacing: 1px;">LOADING</span>
        </div>
        <img id="lightbox-img" src="" alt="" style="--tx: 0px; --ty: 0px; --ts: 1;">
    </div>

    <script>
        let isLoading = false, viewMode = 'all', currentColumnCount = 0;
        let columnHeights = [], feedPhotos = [], photoPool = [];
        const galleryGrid = document.getElementById('galleryGrid'), refreshBtn = document.getElementById('refreshBtn'),
            toggleFavBtn = document.getElementById('toggleFavBtn'), lightbox = document.getElementById('lightbox'),
            lightboxImg = document.getElementById('lightbox-img'), progressBar = document.getElementById('progressBar'),
            progressTrack = document.getElementById('progressTrack'), previewLoader = document.getElementById('previewLoader'),
            statusDot = document.getElementById('statusDot'), statusText = document.getElementById('statusText');

        const LightboxState = {
            x: 0, y: 0, scale: 1,
            isDragging: false,
            lastX: 0, lastY: 0
        };

        function updateLightboxTransform() {
            lightboxImg.style.setProperty('--tx', `${LightboxState.x}px`);
            lightboxImg.style.setProperty('--ty', `${LightboxState.y}px`);
            lightboxImg.style.setProperty('--ts', LightboxState.scale);
        }

        function resetLightbox() {
            LightboxState.x = 0; LightboxState.y = 0; LightboxState.scale = 1;
            updateLightboxTransform();
        }

        const SUPABASE_URL = 'https://fmxddvjgkykuqwmasigo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZteGRkdmpna3lrdXF3bWFzaWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwNDMzMjcsImV4cCI6MjA1OTYxOTMyN30.XCU4-03oajGh6M2-PNiBotCZSIDn_nJXkIC0Thjjfqo';
        window.APP_NETWORK?.patchSupabase();
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let realtimeChannel = null, userId = 'u_ag0saf7d8mjh9oo4j', favorites = [];
        let realtimeSyncTimer = null, lightboxLoadToken = 0;
        const CACHE_KEY = 'vista_photo_cache_v2';
        const FEED_CACHE_KEY = 'vista_feed_v2';
        const CATALOG_CACHE_KEY = 'vista_catalog_v1';
        const FAVORITES_KEY = 'photo-favorites';
        const FALLBACK_IDS = ['103', '116', '141', '155', '162', '166', '353', '392', '437', '500', '523', '532', '602', '666', '777', '782', '823', '862'];

        function readLocalJSON(key, fallback) {
            try { return JSON.parse(localStorage.getItem(key) || '') || fallback; }
            catch (_) { return fallback; }
        }

        let photoCache = readLocalJSON(CACHE_KEY, {});
        favorites = readLocalJSON(FAVORITES_KEY, []);

        function generateHash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i), h &= h; return Math.abs(h).toString(36); }
        function saveCache() {
            try {
                const keys = Object.keys(photoCache);
                while (keys.length > 300) delete photoCache[keys.shift()];
                localStorage.setItem(CACHE_KEY, JSON.stringify(photoCache));
            } catch (_) { }
        }
        function parsePhotoUrl(url) {
            const m = url.match(/\/id\/(\d+)\/(\d+)\/(\d+)/);
            if (m) return { url, title: `视觉艺术 #${m[1]}`, author: `Artist ${m[1]}`, aspectRatio: m[2] / m[3] };
            return { url, title: '未知艺术', author: '匿名', aspectRatio: 1 };
        }
        function getCachedPhoto(url) {
            const h = generateHash(url);
            if (photoCache[h]) return photoCache[h];
            const p = parsePhotoUrl(url); photoCache[h] = p; return p;
        }

        function buildPhoto(record, index = 0) {
            const id = String(record.id);
            const rawRatio = Number(record.width) / Number(record.height);
            const aspectRatio = Number.isFinite(rawRatio) ? Math.max(0.72, Math.min(rawRatio, 1.5)) : 0.82 + ((Number(id) + index * 7) % 54) / 100;
            const width = 720;
            const height = Math.round(width / aspectRatio);
            return getCachedPhoto(`https://picsum.photos/id/${id}/${width}/${height}.webp`);
        }

        function shuffled(items) {
            const result = items.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function restoreFeed() {
            const cached = readLocalJSON(FEED_CACHE_KEY, null);
            if (!cached || !Array.isArray(cached.data) || Date.now() - cached.savedAt > 24 * 60 * 60 * 1000) return false;
            feedPhotos = cached.data.filter(p => p && typeof p.url === 'string').slice(0, 40);
            return feedPhotos.length > 0;
        }

        function saveFeed() {
            try { localStorage.setItem(FEED_CACHE_KEY, JSON.stringify({ data: feedPhotos.slice(-40), savedAt: Date.now() })); }
            catch (_) { }
        }

        async function loadPhotoCatalog() {
            const cached = readLocalJSON(CATALOG_CACHE_KEY, null);
            if (cached && Array.isArray(cached.data) && Date.now() - cached.savedAt < 7 * 24 * 60 * 60 * 1000) {
                photoPool = cached.data;
                return;
            }
            try {
                const response = await fetch('https://picsum.photos/v2/list?page=1&limit=100', { cache: 'force-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                photoPool = data.filter(item => item?.id && item?.width && item?.height);
                localStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify({ data: photoPool, savedAt: Date.now() }));
            } catch (_) {
                photoPool = FALLBACK_IDS.map(id => ({ id }));
            }
        }

        async function syncFavorites() {
            try {
                const { data, error } = await _supabase.from('vista_favorites').select('url').eq('user_id', userId).order('created_at', { ascending: false }).limit(500);
                if (error) throw error;
                if (data) {
                    favorites = data.map(i => getCachedPhoto(i.url));
                    localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
                    saveCache();
                    statusText.innerText = `已同步 (${favorites.length})`;
                    statusDot.classList.add('online');
                }
            } catch (err) {
                statusText.innerText = favorites.length ? `本地收藏 (${favorites.length})` : '云端暂不可用';
                statusDot.classList.remove('online');
            }
        }

        async function addToCloud(p) { try { await _supabase.from('vista_favorites').upsert({ user_id: userId, url: p.url }, { onConflict: 'user_id,url' }); } catch (e) { } }
        async function removeFromCloud(u) { try { await _supabase.from('vista_favorites').delete().eq('user_id', userId).eq('url', u); } catch (e) { } }

        function subscribeToRealtime() {
            if (realtimeChannel) _supabase.removeChannel(realtimeChannel);
            realtimeChannel = _supabase.channel('public:vista_favorites').on('postgres_changes', { event: '*', schema: 'public', table: 'vista_favorites', filter: `user_id=eq.${userId}` }, () => {
                clearTimeout(realtimeSyncTimer);
                realtimeSyncTimer = setTimeout(async () => {
                    await syncFavorites();
                    if (viewMode === 'favorites') rebuildGallery(); else updateHeartIcons();
                }, 350);
            }).subscribe();
        }

        function updateHeartIcons() {
            document.querySelectorAll('.photo-item').forEach(item => {
                const img = item.querySelector('img'), btn = item.querySelector('.btn-favorite');
                if (img && btn) btn.classList.toggle('active', favorites.some(f => f.url === img.src));
            });
        }

        function initColumns() {
            galleryGrid.innerHTML = '';
            const w = window.innerWidth, count = w < 500 ? 1 : w < 800 ? 2 : w < 1200 ? 3 : 4;
            for (let i = 0; i < count; i++) { const col = document.createElement('div'); col.className = 'gallery-column'; col.id = `col-${i}`; galleryGrid.appendChild(col); }
            currentColumnCount = count;
            columnHeights = Array(count).fill(0);
            return count;
        }

        function debounce(func, wait) {
            let timeout;
            return function () {
                const context = this, args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), wait);
            };
        }

        window.onresize = debounce(() => {
            const w = window.innerWidth, nextCount = w < 500 ? 1 : w < 800 ? 2 : w < 1200 ? 3 : 4;
            if (nextCount !== currentColumnCount) rebuildGallery();
        }, 300);
        function getShortestColumn(photo) {
            let cols = Array.from(document.querySelectorAll('.gallery-column'));
            if (cols.length === 0) { initColumns(); cols = Array.from(document.querySelectorAll('.gallery-column')); }
            let index = 0;
            for (let i = 1; i < columnHeights.length; i++) if (columnHeights[i] < columnHeights[index]) index = i;
            columnHeights[index] += 1 / Math.max(photo.aspectRatio || 1, 0.1) + 0.08;
            return cols[index];
        }

        function toggleFavorite(p, btn, e) {
            e.stopPropagation(); const idx = favorites.findIndex(f => f.url === p.url);
            if (idx > -1) {
                favorites.splice(idx, 1); btn.classList.remove('active');
                if (viewMode === 'favorites') btn.closest('.photo-item').remove();
                void removeFromCloud(p.url);
            } else {
                favorites.unshift(p); btn.classList.add('active');
                void addToCloud(p);
            }
            localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
            statusText.innerText = `本地已保存 (${favorites.length})`;
        }

        function fetchRandomPhotos(n = 12, reset = false) {
            if (isLoading) return;
            isLoading = true;
            const loading = document.getElementById('loading');
            loading.style.opacity = '1';

            if (reset) feedPhotos = [];
            const source = photoPool.length ? photoPool : FALLBACK_IDS.map(id => ({ id }));
            const used = new Set(feedPhotos.map(p => parsePhotoUrl(p.url).title.replace('视觉艺术 #', '')));
            const available = shuffled(source).filter(item => !used.has(String(item.id)));
            const photos = available.slice(0, n).map(buildPhoto);

            if (photos.length) {
                feedPhotos.push(...photos);
                saveCache();
                saveFeed();
                renderPhotos(photos);
                loading.textContent = '继续向下探索';
            } else {
                loading.textContent = photoPool.length ? '已浏览本批全部图片' : '正在准备更多图片…';
            }
            loading.style.opacity = '0.45';
            isLoading = false;
        }

        function renderPhotos(data) {
            const existingCount = document.querySelectorAll('.photo-item').length;
            data.forEach((p, i) => {
                const isFav = favorites.some(f => f.url === p.url), item = document.createElement('div');
                item.className = 'photo-item'; item.style.animationDelay = `${Math.min(i * 0.035, 0.2)}s`;
                const isPriority = existingCount + i < 4;
                // 增加 aspect-ratio 占位，防止 CLS
                item.innerHTML = `
                    <div class="photo-inner">
                        <button class="btn-favorite ${isFav ? 'active' : ''}" type="button" aria-label="${isFav ? '取消收藏' : '收藏'}">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                        </button>
                        <img src="${p.url}" alt="${p.title}" style="aspect-ratio: ${p.aspectRatio};" loading="${isPriority ? 'eager' : 'lazy'}" fetchpriority="${isPriority ? 'high' : 'auto'}" decoding="async">
                        <div class="photo-overlay"><div class="photo-info"><h2>${p.title}</h2><p>@${p.author}</p></div></div>
                    </div>`;
                const favoriteButton = item.querySelector('.btn-favorite');
                favoriteButton.addEventListener('click', event => toggleFavorite(p, favoriteButton, event));
                item.querySelector('img').addEventListener('error', () => item.remove(), { once: true });
                const openPreview = () => {
                    const token = ++lightboxLoadToken;
                    const fullHeight = Math.max(900, Math.round(1600 / Math.max(p.aspectRatio || 1, 0.1)));
                    const highRes = p.url.replace(/\/\d+\/\d+(?:\.webp)?(?:\?.*)?$/, `/1600/${fullHeight}.webp`);
                    resetLightbox();
                    lightboxImg.src = p.url;
                    lightboxImg.classList.add('loaded');
                    progressTrack.style.display = 'block';
                    progressBar.classList.add('loading');
                    progressBar.style.width = '';
                    previewLoader.style.display = 'flex'; lightbox.style.display = 'flex';
                    document.body.style.overflow = 'hidden';

                    const fullImage = new Image();
                    fullImage.decoding = 'async';
                    fullImage.src = highRes;
                    fullImage.onload = async () => {
                        try { await fullImage.decode(); } catch (_) { }
                        if (token !== lightboxLoadToken) return;
                        lightboxImg.src = highRes;
                        progressBar.classList.remove('loading');
                        progressBar.style.width = '100%';
                        previewLoader.style.display = 'none';
                        setTimeout(() => { if (token === lightboxLoadToken) progressTrack.style.display = 'none'; }, 220);
                    };
                    fullImage.onerror = () => {
                        if (token !== lightboxLoadToken) return;
                        progressTrack.style.display = 'none';
                        previewLoader.style.display = 'none';
                    };
                };
                item.tabIndex = 0;
                item.setAttribute('role', 'button');
                item.setAttribute('aria-label', `查看大图：${p.title}`);
                item.addEventListener('click', openPreview);
                item.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        openPreview();
                    }
                });
                getShortestColumn(p).appendChild(item);
            });
        }

        function rebuildGallery() {
            initColumns();
            renderPhotos(viewMode === 'all' ? feedPhotos : favorites);
        }

        refreshBtn.onclick = () => {
            if (viewMode !== 'all') return;
            initColumns();
            fetchRandomPhotos(12, true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        toggleFavBtn.onclick = () => {
            viewMode = viewMode === 'all' ? 'favorites' : 'all'; toggleFavBtn.classList.toggle('active');
            document.querySelector('.title-area h1').innerText = viewMode === 'all' ? '发现' : '我的收藏';
            refreshBtn.style.display = viewMode === 'all' ? 'block' : 'none';
            rebuildGallery();
        };

        const loadMoreObserver = new IntersectionObserver(entries => {
            if (entries.some(entry => entry.isIntersecting) && viewMode === 'all') fetchRandomPhotos(8);
        }, { rootMargin: '300px 0px' });
        loadMoreObserver.observe(document.getElementById('loading'));

        function closeLightbox() {
            lightboxLoadToken++;
            lightbox.style.display = 'none';
            document.body.style.overflow = '';
            progressBar.classList.remove('loading');
            setTimeout(() => {
                if (lightbox.style.display === 'none') {
                    lightboxImg.src = '';
                    lightboxImg.classList.remove('loaded');
                }
            }, 220);
        }

        lightbox.onclick = e => { if (e.target === lightbox) closeLightbox(); };
        window.addEventListener('keydown', e => { if (e.key === 'Escape' && lightbox.style.display === 'flex') closeLightbox(); });

        lightbox.addEventListener('wheel', e => {
            e.preventDefault();
            if (e.ctrlKey) {
                const s = Math.exp(-e.deltaY * 0.003);
                const prev = LightboxState.scale;
                LightboxState.scale = Math.max(0.5, Math.min(LightboxState.scale * s, 10));
                
                // Zoom towards mouse
                const rect = lightboxImg.getBoundingClientRect();
                const ox = e.clientX - (rect.left + rect.width / 2);
                const oy = e.clientY - (rect.top + rect.height / 2);
                LightboxState.x -= ox * (LightboxState.scale / prev - 1);
                LightboxState.y -= oy * (LightboxState.scale / prev - 1);
            } else {
                LightboxState.x -= e.deltaX;
                LightboxState.y -= e.deltaY;
            }
            updateLightboxTransform();
        }, { passive: false });

        let startScale = 1;
        lightbox.addEventListener('gesturestart', e => { e.preventDefault(); startScale = LightboxState.scale; });
        lightbox.addEventListener('gesturechange', e => {
            e.preventDefault();
            const prev = LightboxState.scale;
            LightboxState.scale = Math.max(0.5, Math.min(startScale * e.scale, 10));
            const rect = lightboxImg.getBoundingClientRect();
            const ox = e.clientX - (rect.left + rect.width / 2);
            const oy = e.clientY - (rect.top + rect.height / 2);
            LightboxState.x -= ox * (LightboxState.scale / prev - 1);
            LightboxState.y -= oy * (LightboxState.scale / prev - 1);
            updateLightboxTransform();
        });

        lightboxImg.addEventListener('mousedown', e => {
            if (e.button !== 0) return;
            LightboxState.isDragging = true;
            LightboxState.lastX = e.clientX;
            LightboxState.lastY = e.clientY;
            lightboxImg.style.cursor = 'grabbing';
            e.preventDefault();
        });

        window.addEventListener('mousemove', e => {
            if (!LightboxState.isDragging) return;
            LightboxState.x += e.clientX - LightboxState.lastX;
            LightboxState.y += e.clientY - LightboxState.lastY;
            LightboxState.lastX = e.clientX;
            LightboxState.lastY = e.clientY;
            updateLightboxTransform();
        });

        window.addEventListener('mouseup', () => {
            LightboxState.isDragging = false;
            lightboxImg.style.cursor = 'zoom-out';
        });

        // 首屏只依赖本地状态；图片目录、云收藏与实时连接全部后台启动。
        initColumns();
        if (restoreFeed()) renderPhotos(feedPhotos);
        else fetchRandomPhotos(12);

        setTimeout(() => {
            syncFavorites().then(() => updateHeartIcons());
            subscribeToRealtime();
        }, 0);

        const prepareCatalog = () => loadPhotoCatalog().then(() => {
            const loading = document.getElementById('loading');
            if (loading.textContent.includes('准备更多')) loading.textContent = '继续向下探索';
        });
        window.addEventListener('load', () => setTimeout(prepareCatalog, 500), { once: true });
    </script>
</body>

</html>
