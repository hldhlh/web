<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg-gradient)" />
  
  <g transform="translate(106, 106)">
    <!-- Subtle Grid Lines -->
    <path d="M 50 50 L 250 50 M 50 150 L 250 150 M 50 250 L 250 250 M 50 50 L 50 250 M 150 50 L 150 250 M 250 50 L 250 250" 
          stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Active Connections -->
    <path d="M 50 150 L 150 50 L 250 150 L 150 250 Z" 
          stroke="url(#accent-gradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
    
    <path d="M 150 50 L 150 150 M 50 150 L 150 150 M 250 150 L 150 150 M 150 250 L 150 150" 
          stroke="url(#primary-gradient)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Nodes -->
    <circle cx="50" cy="50" r="12" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="150" cy="50" r="18" fill="url(#accent-gradient)" />
    <circle cx="250" cy="50" r="12" fill="rgba(255, 255, 255, 0.2)" />
    
    <circle cx="50" cy="150" r="18" fill="url(#accent-gradient)" />
    <circle cx="150" cy="150" r="28" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="250" cy="150" r="18" fill="url(#accent-gradient)" />
    
    <circle cx="50" cy="250" r="12" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="150" cy="250" r="18" fill="url(#accent-gradient)" />
    <circle cx="250" cy="250" r="12" fill="rgba(255, 255, 255, 0.2)" />
  </g>
</svg>
