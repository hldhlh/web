<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep, Intellectual "INTP" Cool Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" /> <!-- Midnight Navy -->
      <stop offset="100%" stop-color="#1E1B4B" /> <!-- Deep Indigo -->
    </linearGradient>

    <!-- Electric Logic Glow -->
    <filter id="logic-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="node-gradient">
      <stop offset="0%" stop-color="#22D3EE" /> <!-- Cyan -->
      <stop offset="100%" stop-color="#0891B2" /> <!-- Deep Cyan -->
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-gradient)" />

  <!-- Dark Frost Overlay -->
  <rect width="470" height="470" x="21" y="21" rx="115" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- The "Logical Matrix" (Geometric Hexagon Network) -->
  <g transform="translate(256, 256)" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <!-- Inner Connections (Hexagonal Grid) -->
    <g id="grid">
      <!-- Hexagon Outer -->
      <path d="M 0,-160 L 138.5,-80 L 138.5,80 L 0,160 L -138.5,80 L -138.5,-80 Z" />
      <!-- Internal Structure (Lines to center) -->
      <line x1="0" y1="-160" x2="0" y2="160" />
      <line x1="138.5" y1="-80" x2="-138.5" y2="80" />
      <line x1="138.5" y1="80" x2="-138.5" y2="-80" />
      
      <!-- Inner Hexagon -->
      <path d="M 0,-80 L 69.3,-40 L 69.3,40 L 0,80 L -69.3,40 L -69.3,-40 Z" stroke-opacity="0.6" />
      
      <!-- Star Connections -->
      <path d="M 0,-160 L 69.3,40 L -138.5,80 L 138.5,80 L -69.3,40 L 0,-160" stroke-opacity="0.3" />
      <path d="M 0,160 L -69.3,-40 L 138.5,-80 L -138.5,-80 L 69.3,-40 L 0,160" stroke-opacity="0.3" />
    </g>

    <!-- Glowing Nodes -->
    <g fill="url(#node-gradient)" filter="url(#logic-glow)">
      <!-- Outer nodes -->
      <circle cx="0" cy="-160" r="8" />
      <circle cx="138.5" cy="-80" r="8" />
      <circle cx="138.5" cy="80" r="8" />
      <circle cx="0" cy="160" r="8" />
      <circle cx="-138.5" cy="80" r="8" />
      <circle cx="-138.5" cy="-80" r="8" />
      
      <!-- Inner nodes -->
      <circle cx="0" cy="-80" r="6" />
      <circle cx="69.3" cy="-40" r="6" />
      <circle cx="69.3" cy="40" r="6" />
      <circle cx="0" cy="80" r="6" />
      <circle cx="-69.3" cy="40" r="6" />
      <circle cx="-69.3" cy="-40" r="6" />
      
      <!-- Central Node -->
      <circle cx="0" cy="0" r="12" fill="#FFFFFF" />
    </g>
  </g>
</svg>
