<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>思维矩阵</title>
  <desc>深色圆角方形内包含九个矩阵节点与一条高亮思维路径</desc>

  <!-- App tile -->
  <rect x="7" y="7" width="86" height="86" rx="24" fill="#020617"/>

  <!-- Matrix structure -->
  <path d="M29 29H71M29 50H71M29 71H71M29 29V71M50 29V71M71 29V71" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Active thought path -->
  <path d="M29 71L50 50L71 29" stroke="#818CF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Matrix nodes -->
  <g fill="#FFFFFF">
    <rect x="25" y="25" width="8" height="8" rx="2.5"/>
    <rect x="46" y="25" width="8" height="8" rx="2.5"/>
    <rect x="67" y="25" width="8" height="8" rx="2.5"/>
    <rect x="25" y="46" width="8" height="8" rx="2.5"/>
    <rect x="67" y="46" width="8" height="8" rx="2.5"/>
    <rect x="25" y="67" width="8" height="8" rx="2.5"/>
    <rect x="46" y="67" width="8" height="8" rx="2.5"/>
    <rect x="67" y="67" width="8" height="8" rx="2.5"/>
  </g>

  <!-- Focus node -->
  <rect x="44" y="44" width="12" height="12" rx="4" fill="#818CF8" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Subtle edge definition -->
  <rect x="7.75" y="7.75" width="84.5" height="84.5" rx="23.25" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
