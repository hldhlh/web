            syncStatus: document.getElementById('syncStatus')
        };

        const SyncManager = {
            set(status) {
                DOM.syncStatus.className = 'sync-indicator';
                if (status === 'syncing') DOM.syncStatus.classList.add('syncing');
                if (status === 'error') DOM.syncStatus.classList.add('error');
            },
            async wrap(promise) {
                this.set('syncing');
                try {
                    const res = await promise;
                    // minimal delay to show success state
                    setTimeout(() => this.set('idle'), 200);
                    return res;
                } catch (e) {
                    console.error(e);
                    this.set('error');
                    throw e;
                }
            },
            async reconcile() {
                this.set('syncing');
                try {
                    const { data: nodes } = await _client.from('canvas_nodes').select('*');
                    const { data: conns } = await _client.from('canvas_connections').select('*');

                    if (nodes) {
                        const nodeIds = new Set(nodes.map(n => n.id));
                        
                        // Remove nodes that are no longer in DB
                        const existingNodes = document.querySelectorAll('.tag');
                        existingNodes.forEach(node => {
                            if (!nodeIds.has(node.id)) {
                                // Don't remove if currently being edited
                                if (State.interaction.contextEntity !== node) node.remove();
                            }
                        });

                        // Add or Update nodes
                        for (const n of nodes) {
                            const node = document.getElementById(n.id);
                            if (!node) {
                                await Tag.create(n.text, n.x, n.y, n.id, n.color);
                            } else {
                                // Update existing node if values changed, unless being edited
                                if (State.interaction.contextEntity !== node) {
                                    if (n.text !== undefined) node.querySelector('span').textContent = n.text;
                                    if (n.x !== undefined) {
                                        node.style.left = `${n.x}px`;
                                        node.dataset.x = n.x;
                                    }
                                    if (n.y !== undefined) {
                                        node.style.top = `${n.y}px`;
                                        node.dataset.y = n.y;
                                    }
                                    if (n.color !== undefined) {
                                        ['orange', 'blue', 'purple', 'green', 'grey', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9'].forEach(c => node.classList.remove(`color-${c}`));
                                        if (n.color) node.classList.add(`color-${n.color}`);
                                    }
                                }
                            }
                        }
                    }

                    if (conns) {
                        State.connections = conns;
                        LineManager.render();
                    }
                    setTimeout(() => this.set('idle'), 500);
                } catch (e) {
                    console.error('Reconciliation failed:', e);
                    this.set('error');
                }
            }
        };

        function updateMatrix() {
            const { x, y, scale } = State.transform;
            DOM.content.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;

            // Only redraw overlay lines during zoom if needed
            if (State.interaction.isLinking) LineManager.renderOverlay();

            // Grid optimization
            const ox = window.innerWidth / 2 + x;
            const oy = window.innerHeight / 2 + y;
            const s1 = 40 * scale;
            const s2 = 200 * scale;

            DOM.grid.style.backgroundSize = `${s1}px ${s1}px, ${s2}px ${s2}px, ${s2}px ${s2}px`;
            DOM.grid.style.backgroundPosition = `${ox}px ${oy}px, ${ox}px ${oy}px, ${ox}px ${oy}px`;

            // Sync UI elements with canvas transform
            Input.updatePosition();
            Toolbar.updatePosition();
            Menu.updatePosition();

            saveViewState();
        }

        function saveViewState() {
            if (State.saveViewTimer) clearTimeout(State.saveViewTimer);
            State.saveViewTimer = setTimeout(async () => {
                const { x, y, scale } = State.transform;
                SyncManager.wrap(_client.from('canvas_state').upsert({ id: 1, x, y, scale }));
            }, 300);
        }

        function screenToSpace(sx, sy) {
            const rect = DOM.viewport.getBoundingClientRect();
            const vx = sx - rect.left - rect.width / 2;
            const vy = sy - rect.top - rect.height / 2;
            return {
                x: (vx - State.transform.x) / State.transform.scale,
                y: (vy - State.transform.y) / State.transform.scale
            };
        }

        function getTextWidth(text, font) {
            // Re-use canvas object for better performance
            const canvas = getTextWidth.canvas || (getTextWidth.canvas = document.createElement("canvas"));
            const context = canvas.getContext("2d");
            context.font = font;
            const metrics = context.measureText(text);
            return metrics.width;
        }

        function spaceToScreen(x, y) {
            const rect = DOM.viewport.getBoundingClientRect();
            return {
                x: rect.width / 2 + State.transform.x + x * State.transform.scale,
                y: rect.height / 2 + State.transform.y + y * State.transform.scale
            };
        }

        function zoomAt(clientX, clientY, nextScale) {
            const rect = DOM.viewport.getBoundingClientRect();
            const mouseX = clientX - rect.left - rect.width / 2;
            const mouseY = clientY - rect.top - rect.height / 2;
            const prevScale = State.transform.scale;
            const clamped = Math.max(0.02, Math.min(nextScale, 8.0));

            // Correct math for zooming at a point (mouseX, mouseY) relative to viewport center:
            // The point in canvas space is (mouseX - transform.x) / prevScale.
            // We want this point to stay at mouseX after scaling.
            const ratio = clamped / prevScale;
            State.transform.x = mouseX - (mouseX - State.transform.x) * ratio;
            State.transform.y = mouseY - (mouseY - State.transform.y) * ratio;
            State.transform.scale = clamped;
            updateMatrix();
        }

        const Tag = {
            async create(text, x, y, id = null, color = null) {
                const isNewDb = (id === null);
                const node = document.createElement('div');
                node.id = id || crypto.randomUUID();
                node.className = 'tag';
                node.innerHTML = `<span>${text}</span><div class="tag-add-btn"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="2" x2="6" y2="10"></line><line x1="2" y1="6" x2="10" y2="6"></line></svg></div>`;
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                node.dataset.x = x; node.dataset.y = y;

                // Load color if available
                if (color) node.classList.add(`color-${color}`);

                const addBtn = node.querySelector('.tag-add-btn');
                addBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const parentId = node.id;
                    const children = State.connections
                        .filter(c => c.from_id === parentId)
                        .map(c => document.getElementById(c.to_id))
                        .filter(n => n);

                    const parentX = parseFloat(node.dataset.x);
                    const parentY = parseFloat(node.dataset.y);
                    const parentW = node.offsetWidth;

                    const newX = Math.round((parentX + parentW + 120) / 40) * 40;
                    let newY;
                    if (children.length === 0) {
                        // First child: align with parent's top exactly
                        newY = parentY;
                    } else {
                        // Subsequent children: place below the last child and snap to grid
                        const maxY = Math.max(...children.map(c => parseFloat(c.dataset.y)));
                        newY = Math.round((maxY + 80) / 40) * 40;
                    }

                    const newNode = await Tag.create('', newX, newY);
                    newNode.dataset.isNew = 'true';

                    // Create connection
                    const conn = { id: crypto.randomUUID(), from_id: node.id, to_id: newNode.id };
                    await SyncManager.wrap(_client.from('canvas_connections').insert(conn));
                    State.connections.push(conn);
                    LineManager.render();

                    // Auto focus and edit new node
                    Tag.deselect();
                    Tag.select(newNode);
                    setTimeout(() => {
                        const r = newNode.getBoundingClientRect();
                        Input.show(r.left + r.width / 2, r.top + r.height / 2, '', newNode, 'node');
                    }, 100);
                });
                this.bind(node);
                DOM.content.appendChild(node);

                if (isNewDb) {
                    await SyncManager.wrap(_client.from('canvas_nodes').insert({
                        id: node.id,
                        text: text,
                        x: x,
                        y: y,
                        color: color
                    }));
                }
                return node;
            },
            async deleteRecursive(nodeId) {
                if (!nodeId) return;

                // 1. Find all connections involving this node (source or target)
                const relatedConns = State.connections.filter(c => c.from_id === nodeId || c.to_id === nodeId);
                
                // 2. Identify children to delete (nodes where this node is the source)
                const childNodeIds = State.connections
                    .filter(c => c.from_id === nodeId)
                    .map(c => c.to_id);

                // 3. Delete all related connections from DB first (prevents FK violations)
                for (const conn of relatedConns) {
                    await SyncManager.wrap(_client.from('canvas_connections').delete().eq('id', conn.id));
                    // Update local state immediately to prevent ghost rendering
                    State.connections = State.connections.filter(c => c.id !== conn.id);
                }

                // 4. Recursively delete child nodes
                for (const childId of childNodeIds) {
                    // Check if node exists to avoid errors on already deleted nodes
                    if (document.getElementById(childId)) {
                        await this.deleteRecursive(childId);
                    }
                }

                // 5. Delete the node itself from DB
                await SyncManager.wrap(_client.from('canvas_nodes').delete().eq('id', nodeId));

                // 6. Final local cleanup
                const node = document.getElementById(nodeId);
                if (node) node.remove();

                // Clear from selection
                State.interaction.selectedTags = State.interaction.selectedTags.filter(t => t.id !== nodeId);
            },
            bind(node) {
                node.addEventListener('mousedown', e => {
                    e.stopPropagation(); e.preventDefault();
                    if (DOM.input.style.display !== 'none') DOM.input.blur();
                    if (State.interaction.isLinking) return;
                    if (e.button === 0) {
                        State.interaction.isDragging = true;
                        State.interaction.currentTag = node;
                        node.classList.add('dragging');
                        const spacePos = screenToSpace(e.clientX, e.clientY);
                        State.interaction.dragOffset = { x: spacePos.x - parseFloat(node.dataset.x), y: spacePos.y - parseFloat(node.dataset.y) };
                        if (!e.shiftKey && !State.interaction.selectedTags.includes(node)) this.deselect();
                        this.select(node);
                        DOM.viewport.style.cursor = 'grabbing';
                    } else if (e.button === 2) {
                        State.mouse.startTime = Date.now();
                        State.interaction.isLinking = true;
                        State.interaction.linkingFrom = node;
                    }
                });
                node.addEventListener('dblclick', e => {
                    e.stopPropagation();
                    const rect = node.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    Input.show(centerX, centerY, node.querySelector('span').textContent, node);
                });
                node.addEventListener('contextmenu', e => {
                    e.preventDefault();
                    e.stopPropagation();
                    Menu.show(e.clientX, e.clientY, node);
                });

                let timer;
                node.addEventListener('touchstart', e => {
                    // If already pinching/panning with two fingers, ignore
                    if (e.touches.length > 1) return;
                    if (DOM.input.style.display !== 'none') DOM.input.blur();
                    if (State.interaction.isLinking) return;

                    const t = e.touches[0];
                    State.interaction.isDragging = true;
                    State.interaction.currentTag = node;
                    node.classList.add('dragging');
                    const spacePos = screenToSpace(t.clientX, t.clientY);
                    State.interaction.dragOffset = { x: spacePos.x - parseFloat(node.dataset.x), y: spacePos.y - parseFloat(node.dataset.y) };

                    // Select this tag
                    if (!State.interaction.selectedTags.includes(node)) {
                        Tag.deselect();
                        Tag.select(node);
                    }

                    // Long press for context menu
                    timer = setTimeout(() => {
                        if (State.interaction.isDragging && State.interaction.currentTag === node) {
                            Menu.show(t.clientX, t.clientY, node);
                            // Vibrate on supported devices
                            if (navigator.vibrate) navigator.vibrate(50);
                        }
                    }, 600);
                }, { passive: false });

                node.addEventListener('touchmove', e => {
                    // Cancel long press if moving
                    if (timer) clearTimeout(timer);
                }, { passive: true });

                node.addEventListener('touchend', e => {
                    clearTimeout(timer);
                    node.classList.remove('dragging');
                    if (State.interaction.isDragging && State.interaction.currentTag === node) {
                        State.interaction.isDragging = false;
                        State.interaction.selectedTags.forEach(t => Tag.updatePos(t));
                    }
                });

                node.addEventListener('touchcancel', e => {
                    clearTimeout(timer);
                    node.classList.remove('dragging');
                    State.interaction.isDragging = false;
                });
            },
            select(node) { node.classList.add('selected'); if (!State.interaction.selectedTags.includes(node)) State.interaction.selectedTags.push(node); },
            deselect() { State.interaction.selectedTags.forEach(t => t.classList.remove('selected')); State.interaction.selectedTags = []; },
            async updatePos(node) {
                const id = node.id;
                await SyncManager.wrap(_client.from('canvas_nodes').update({ x: parseFloat(node.dataset.x), y: parseFloat(node.dataset.y) }).eq('id', id));
            }
        };

        const LineManager = {
            render() {
                DOM.svgGroup.innerHTML = '';
                State.connections.forEach(conn => {
                    const from = document.getElementById(conn.from_id || conn.fromId);
                    const to = document.getElementById(conn.to_id || conn.toId);
                    if (from && to) {
                        const isEditing = (State.interaction.contextType === 'connection' && State.interaction.contextEntity === conn);
                        const g = this.drawLine(from, to, false, conn, isEditing);
                        if (g) DOM.svgGroup.appendChild(g);
                    }
                });
            },
            drawLine(fromNode, toNodeOrPos, isPreview = false, connData = null, hideLabel = false) {
                const getBox = (node) => {
                    const r = node.getBoundingClientRect();
                    const w = r.width / State.transform.scale;
                    const h = r.height / State.transform.scale;
                    const x = parseFloat(node.dataset.x);
                    const y = parseFloat(node.dataset.y);
                    return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
                };

                const b1 = getBox(fromNode);
                let b2;
                if (isPreview) {
                    b2 = { cx: toNodeOrPos.x, cy: toNodeOrPos.y, w: 0, h: 0 };
                } else {
                    b2 = getBox(toNodeOrPos);
                }

                const dx = b2.cx - b1.cx;
                const isRight = dx > 0;

                // Anchors like the mind-map image: Parent Side -> Child Side
                const startX = isRight ? b1.x + b1.w : b1.x;
                const startY = b1.cy;

                const endX = isRight ? b2.x : b2.x + b2.w;
                const endY = b2.cy;

                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.setAttribute("class", "connection-group");
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

                // Mind-map Style S-Curve (Cubic Bezier)
                const offset = Math.max(Math.abs(endX - startX) * 0.5, 40);
                const cp1x = startX + (isRight ? offset : -offset);
                const cp2x = endX + (isRight ? -offset : offset);

                const d = `M ${startX} ${startY} C ${cp1x} ${startY}, ${cp2x} ${endY}, ${endX} ${endY}`;

                path.setAttribute("d", d);
                path.setAttribute("class", isPreview ? "connection-line line-preview" : "connection-line");
                if (!isPreview) path.setAttribute("marker-end", "url(#arrowHead)");
                if (connData && connData.color) {
                    const colorMap = { c1: '#E91E63', c2: '#C2185B', c3: '#9C27B0', c4: '#5727B0', c5: '#272AB0', c6: '#276BB0', c7: '#57ACDC', c8: '#57DCBE', c9: '#60C689' };
                    path.style.stroke = colorMap[connData.color] || connData.color;
                }

                group.appendChild(path);

                if (!isPreview && connData) {
                    const midX = (startX + endX) / 2;
                    const midY = (startY + endY) / 2;

                    const hitLine = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    hitLine.setAttribute("d", d);
                    hitLine.setAttribute("stroke", "transparent");
                    hitLine.setAttribute("stroke-width", "20");
                    hitLine.setAttribute("fill", "none");
                    hitLine.style.cursor = "pointer";
                    hitLine.style.pointerEvents = "stroke";

                    hitLine.addEventListener('mousedown', e => e.stopPropagation());
                    hitLine.addEventListener('contextmenu', (e) => {
                        e.preventDefault(); e.stopPropagation();
                        Menu.show(e.clientX, e.clientY, connData, 'connection');
                    });
                    hitLine.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const sStart = spaceToScreen(startX, startY);
                        const sEnd = spaceToScreen(endX, endY);
                        Input.show((sStart.x + sEnd.x) / 2, (sStart.y + sEnd.y) / 2, connData.label || '', connData, 'connection', 0);
                    });
                    group.appendChild(hitLine);

                    if (connData.label || connData.isEditing) {
                        const pathId = `p-${connData.id || Math.random().toString(36).substr(2, 9)}`;
                        path.setAttribute("id", pathId);

                        const displayText = connData.label + (connData.isEditing ? ' |' : '');
                        const font = "400 12px Outfit, Noto Sans SC, sans-serif";
                        const tw = getTextWidth(displayText, font);

                        if (connData.isEditing) {
                            const totalLen = path.getTotalLength();
                            const highlight = path.cloneNode();
                            highlight.removeAttribute("id");
                            highlight.setAttribute("stroke", "rgba(129, 140, 248, 0.25)");
                            highlight.setAttribute("stroke-width", "22");
                            highlight.setAttribute("stroke-linecap", "round");
                            highlight.style.pointerEvents = "none";

                            // Use dasharray to only highlight the text area
                            const dashLen = tw + 20;
                            const dashOffset = -(totalLen * 0.5 - dashLen / 2);
                            highlight.setAttribute("stroke-dasharray", `${dashLen} ${totalLen}`);
                            highlight.setAttribute("stroke-dashoffset", dashOffset);
                            group.insertBefore(highlight, path);
                        }

                        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        text.setAttribute("class", "conn-label");
                        if (connData.isEditing) {
                            text.style.fill = "#fff";
                            text.style.filter = "drop-shadow(0 0 8px rgba(129, 140, 248, 0.6))";
                        }
                        text.setAttribute("dy", "-8");

                        const tp = document.createElementNS("http://www.w3.org/2000/svg", "textPath");
                        tp.setAttribute("href", `#${pathId}`);
                        tp.setAttribute("startOffset", "50%");
                        tp.setAttribute("text-anchor", "middle");
                        tp.textContent = displayText;

                        text.appendChild(tp);

                        text.addEventListener('mousedown', e => e.stopPropagation());
                        text.addEventListener('contextmenu', (e) => {
                            e.preventDefault(); e.stopPropagation();
                            Menu.show(e.clientX, e.clientY, connData, 'connection');
                        });
                        if (!connData.isEditing) {
                            text.addEventListener('click', (e) => {
                                e.stopPropagation();
                                const sStart = spaceToScreen(startX, startY);
                                const sEnd = spaceToScreen(endX, endY);
                                Input.show((sStart.x + sEnd.x) / 2, (sStart.y + sEnd.y) / 2, connData.label || '', connData, 'connection', 0);
                            });
                        }

                        group.appendChild(text);
                    }
                }
                return group;
            },
            renderOverlay() {
                DOM.overlayLines.innerHTML = '';
                if (State.interaction.isLinking && State.interaction.linkingFrom) {
                    const fromNode = State.interaction.linkingFrom;
                    const targetPos = screenToSpace(State.mouse.lastX, State.mouse.lastY);
                    const g = this.drawLine(fromNode, targetPos, true);
                    if (g) {
                        // Adjust preview path to use screen coordinates for overlay
                        const path = g.querySelector('path');
                        const start = spaceToScreen(parseFloat(path.getAttribute('d').split(' ')[1]), parseFloat(path.getAttribute('d').split(' ')[2]));
                        // This is complex because spaceToScreen is transform-dependent.
                        // Let's just use the existing drawLine but append to overlay and transform it?
                        // Easier: drawLine already returns space-coordinate SVG.
                        // But overlaySvg is fixed.
                        // I'll just append it to svgGroup for now or fix overlay.
                        // Let's use svgGroup for previews too, it's simpler and correct.
                        DOM.svgGroup.appendChild(g);
                    }
                }
            },
            centerContent() {
                const nodes = Array.from(DOM.content.querySelectorAll('.tag'));
                if (nodes.length === 0) {
                    State.transform.x = 0;
                    State.transform.y = 0;
                    State.transform.scale = 1;
                } else {
                    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                    nodes.forEach(node => {
                        const x = parseFloat(node.dataset.x);
                        const y = parseFloat(node.dataset.y);
                        minX = Math.min(minX, x);
                        maxX = Math.max(maxX, x);
                        minY = Math.min(minY, y);
                        maxY = Math.max(maxY, y);
                    });

                    const cx = (minX + maxX) / 2;
                    const cy = (minY + maxY) / 2;

                    const targetX = -cx * State.transform.scale;
                    const targetY = -cy * State.transform.scale;

                    this.animateTo(targetX, targetY);
                }
            },
            animateTo(tx, ty) {
                const startX = State.transform.x;
                const startY = State.transform.y;
                const startTime = performance.now();
                const duration = 500; // ms

                const step = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3); // easeOutCubic

                    State.transform.x = startX + (tx - startX) * ease;
                    State.transform.y = startY + (ty - startY) * ease;
                    updateMatrix();

                    if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }
        };

        const Input = {
            show(x, y, text = '', entity = null, type = 'node', angle = 0) {
                if (DOM.input.style.display !== 'none') {
                    // Force a blur to trigger saving the previous session
                    DOM.input.blur();
                }

                State.interaction.contextEntity = entity;
                State.interaction.contextType = type;
                State.interaction.targetSpacePos = screenToSpace(x, y);
                State.interaction.currentAngle = angle;

                DOM.input.style.display = 'block';
                DOM.input.value = text;
                DOM.input.placeholder = type === 'node' ? '输入内容...' : '输入关系...';

                if (type === 'connection') {
                    DOM.input.style.left = `${x}px`;
                    DOM.input.style.top = `${y}px`;
                    DOM.input.style.opacity = '0'; // Hidden but focused
                    DOM.input.style.pointerEvents = 'none';

                    entity.isEditing = true;
                    entity.originalLabel = entity.label; // For cancel

                    DOM.input.oninput = () => {
                        entity.label = DOM.input.value;
                        LineManager.render();
                    };

                    LineManager.render();
                } else if (type === 'node' && entity) {
                    // Match exact position of the span within the tag
                    const span = entity.querySelector('span');
                    const rect = span.getBoundingClientRect();

                    DOM.input.style.left = `${rect.left}px`;
                    DOM.input.style.top = `${rect.top}px`;

                    // Initial width based on text or min 20px
                    const updateWidth = () => {
                        const style = window.getComputedStyle(DOM.input);
                        const font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
                        const textWidth = getTextWidth(DOM.input.value, font);
                        DOM.input.style.width = `${Math.max(textWidth + 10, rect.width, 20)}px`;
                    };

                    // Sync font size with zoomed node
                    const baseSize = 1.05 * 16; // 1.05rem in pixels
                    DOM.input.style.fontSize = `${baseSize * State.transform.scale}px`;

                    DOM.input.oninput = updateWidth;

                    DOM.input.style.height = `${rect.height}px`;
                    DOM.input.style.transform = 'none';
                    DOM.input.style.textAlign = 'left';

                    // Initialize width
                    updateWidth();

                    // Hide just the text, keep the box/bg
                    span.style.visibility = 'hidden';
                    entity.classList.add('editing');
                } else {
                    // New node creation
                    DOM.input.style.left = `${x}px`;
                    DOM.input.style.top = `${y}px`;
                    DOM.input.style.transform = "translate(-50%, -50%)";
                    DOM.input.style.textAlign = 'center';
                    DOM.input.style.width = '150px';
                    DOM.input.oninput = null; // Reset for new nodes
                }

                setTimeout(() => {
                    DOM.input.focus();
                    const length = DOM.input.value.length;
                    DOM.input.setSelectionRange(length, length);
                }, 100);
            },
            updatePosition() {
                if (DOM.input.style.display === 'none') return;
                const entity = State.interaction.contextEntity;
                const type = State.interaction.contextType;
                const angle = State.interaction.currentAngle || 0;

                if (type === 'node' && entity) {
                    const span = entity.querySelector('span');
                    const rect = span.getBoundingClientRect();
                    DOM.input.style.left = `${rect.left}px`;
                    DOM.input.style.top = `${rect.top}px`;
                    const baseSize = 1.05 * 16;
                    DOM.input.style.fontSize = `${baseSize * State.transform.scale}px`;
                    if (DOM.input.oninput) DOM.input.oninput();
                } else if (State.interaction.targetSpacePos) {
                    const pos = spaceToScreen(State.interaction.targetSpacePos.x, State.interaction.targetSpacePos.y);
                    DOM.input.style.left = `${pos.x}px`;
                    DOM.input.style.top = `${pos.y}px`;
                    DOM.input.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
                    if (type === 'connection') {
                        DOM.input.style.fontSize = `${12 * State.transform.scale}px`;
                    }
                }
            },
            hide() {
                const entity = State.interaction.contextEntity;
                const type = State.interaction.contextType;

                if (entity && type === 'node') {
                    const span = entity.querySelector('span');
                    if (span) span.style.visibility = 'visible';
                    entity.classList.remove('editing');
                }

                if (type === 'connection' && entity) {
                    if (!State.interaction.didSave) {
                        entity.label = entity.originalLabel;
                    }
                    delete entity.isEditing;
                    delete entity.originalLabel;
                }

                DOM.input.style.display = 'none';
                DOM.input.style.transform = "none";
                DOM.input.style.background = "transparent";
                DOM.input.style.backdropFilter = "none";
                DOM.input.style.padding = "0";
                DOM.input.style.opacity = "1";
                DOM.input.style.pointerEvents = "auto";
                State.interaction.contextEntity = null;
                State.interaction.contextType = null;
                State.interaction.targetSpacePos = null;
                State.interaction.currentAngle = 0;
                State.interaction.didSave = false;
                LineManager.render();
            },
            async save() {
                State.interaction.didSave = true;
                const val = DOM.input.value.trim();
                const entity = State.interaction.contextEntity;
                const type = State.interaction.contextType;

                this.hide();

                if (entity) {
                    if (type === 'connection') {
                        entity.label = val;
                        await SyncManager.wrap(_client.from('canvas_connections').update({ label: val }).eq('id', entity.id));
                    } else if (type === 'node') {
                        const span = entity.querySelector('span');
                        const isNew = entity.dataset.isNew === 'true';

                        if (val) {
                            if (span) span.textContent = val;
                            if (isNew) delete entity.dataset.isNew;
                            await SyncManager.wrap(_client.from('canvas_nodes').update({ text: val }).eq('id', entity.id));
                        } else {
                            if (isNew) {
                                entity.remove();
                                State.connections = State.connections.filter(c => c.from_id !== entity.id && c.to_id !== entity.id);
                                LineManager.render();
                                await Tag.deleteRecursive(entity.id);
                                Tag.deselect();
                            } else {
                                if (span) span.textContent = val;
                                await SyncManager.wrap(_client.from('canvas_nodes').update({ text: val }).eq('id', entity.id));
                            }
                        }
                    }
                }

                LineManager.render();
            }
        };

        const Menu = {
            show(x, y, entity, type = 'node') {
                this.contextEntity = entity;
                this.contextType = type;
                State.interaction.menuSpacePos = screenToSpace(x, y);
                DOM.menu.style.left = `${Math.min(x, window.innerWidth - 200)}px`;
                DOM.menu.style.top = `${Math.min(y, window.innerHeight - 250)}px`;
                DOM.menu.classList.add('show');

                document.getElementById('menuConnect').style.display = type === 'node' ? 'flex' : 'none';

                // Mark current color
                DOM.menu.querySelectorAll('.color-dot').forEach(dot => {
                    const color = dot.dataset.color;
                    if (type === 'node') {
                        if (color === 'none') {
                            const hasColor = Array.from(entity.classList).some(c => c.startsWith('color-'));
                            dot.classList.toggle('selected', !hasColor);
                        } else {
                            dot.classList.toggle('selected', entity.classList.contains(`color-${color}`));
                        }
                    } else if (type === 'connection') {
                        if (color === 'none') {
                            dot.classList.toggle('selected', !entity.color);
                        } else {
                            dot.classList.toggle('selected', entity.color === color);
                        }
                    }
                });
            },
            hide() {
                DOM.menu.classList.remove('show');
                this.contextEntity = null;
                this.contextType = null;
                State.interaction.menuSpacePos = null;
            },
            updatePosition() {
                if (!DOM.menu.classList.contains('show') || !State.interaction.menuSpacePos) return;
                const pos = spaceToScreen(State.interaction.menuSpacePos.x, State.interaction.menuSpacePos.y);
                DOM.menu.style.left = `${Math.min(pos.x, window.innerWidth - 200)}px`;
                DOM.menu.style.top = `${Math.min(pos.y, window.innerHeight - 250)}px`;
            },
            async changeColor(color) {
                const entity = this.contextEntity;
                const type = this.contextType || 'node';
                if (!entity) return;

                if (type === 'node') {
                    // Remove existing colors
                    ['orange', 'blue', 'purple', 'green', 'grey', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9'].forEach(c => entity.classList.remove(`color-${c}`));

                    if (color !== 'none') {
                        // Add new color
                        entity.classList.add(`color-${color}`);
                    }

                    // Sync to DB
                    await SyncManager.wrap(_client.from('canvas_nodes').update({ color: color === 'none' ? null : color }).eq('id', entity.id));
                    
                    // Broadcast
                    _client.channel('canvas_changes').send({
                        type: 'broadcast',
                        event: 'node_color',
                        payload: { id: entity.id, color: color === 'none' ? null : color }
                    });
                } else if (type === 'connection') {
                    entity.color = color === 'none' ? null : color;
                    LineManager.render();
                    await SyncManager.wrap(_client.from('canvas_connections').update({ color: color === 'none' ? null : color }).eq('id', entity.id));
                    
                    // Broadcast
                    _client.channel('canvas_changes').send({
                        type: 'broadcast',
                        event: 'conn_color',
                        payload: { id: entity.id, color: color === 'none' ? null : color }
                    });
                }
                this.hide();
            }
        };

        const Toolbar = {
            show() {
                const count = State.interaction.selectedTags.length;
                if (count === 0) return this.hide();

                document.getElementById('singleActions').style.display = count === 1 ? 'flex' : 'none';
                document.getElementById('multiActions').style.display = count > 1 ? 'flex' : 'none';

                // Calculate bounding box of selected tags
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                State.interaction.selectedTags.forEach(t => {
                    const r = t.getBoundingClientRect();
                    minX = Math.min(minX, r.left); maxX = Math.max(maxX, r.right);
                    minY = Math.min(minY, r.top); maxY = Math.max(maxY, r.bottom);
                });

                DOM.toolbar.style.left = `${(minX + maxX) / 2}px`;
                DOM.toolbar.style.top = `${minY - 60}px`;
                DOM.toolbar.style.transform = 'translateX(-50%)';
                DOM.toolbar.classList.add('show');
            },
            hide() {
                DOM.toolbar.classList.remove('show');
            },
            updatePosition() {
                if (!DOM.toolbar.classList.contains('show')) return;

                // Calculate bounding box of selected tags
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                State.interaction.selectedTags.forEach(t => {
                    const r = t.getBoundingClientRect();
                    minX = Math.min(minX, r.left); maxX = Math.max(maxX, r.right);
                    minY = Math.min(minY, r.top); maxY = Math.max(maxY, r.bottom);
                });

                DOM.toolbar.style.left = `${(minX + maxX) / 2}px`;
                DOM.toolbar.style.top = `${minY - 60}px`;
            },
            async toggleStyle(style) {
                const node = State.interaction.selectedTags[0];
                if (!node) return;
                const span = node.querySelector('span');
                if (style === 'bold') {
                    const isBold = span.style.fontWeight === 'bold';
                    span.style.fontWeight = isBold ? 'normal' : 'bold';
                    await SyncManager.wrap(_client.from('canvas_nodes').update({ bold: !isBold }).eq('id', node.id));
                } else if (style === 'italic') {
                    const isItalic = span.style.fontStyle === 'italic';
                    span.style.fontStyle = isItalic ? 'normal' : 'italic';
                    await SyncManager.wrap(_client.from('canvas_nodes').update({ italic: !isItalic }).eq('id', node.id));
                }
            },
            async align(type) {
                const tags = State.interaction.selectedTags;
                if (tags.length < 2) return;

                if (type === 'left') {
                    const minX = Math.min(...tags.map(t => parseFloat(t.dataset.x)));
                    tags.forEach(t => { t.style.left = `${minX}px`; t.dataset.x = minX; });
                } else if (type === 'top') {
                    const minY = Math.min(...tags.map(t => parseFloat(t.dataset.y)));
                    tags.forEach(t => { t.style.top = `${minY}px`; t.dataset.y = minY; });
                } else if (type === 'distV') {
                    const sorted = [...tags].sort((a, b) => parseFloat(a.dataset.y) - parseFloat(b.dataset.y));
                    const minY = parseFloat(sorted[0].dataset.y);
                    const maxY = parseFloat(sorted[sorted.length - 1].dataset.y);
                    const gap = (maxY - minY) / (tags.length - 1);
                    sorted.forEach((t, i) => {
                        const ny = minY + i * gap;
                        t.style.top = `${ny}px`; t.dataset.y = ny;
                    });
                } else if (type === 'distH') {
                    const sorted = [...tags].sort((a, b) => parseFloat(a.dataset.x) - parseFloat(b.dataset.x));
                    const minX = parseFloat(sorted[0].dataset.x);
                    const maxX = parseFloat(sorted[sorted.length - 1].dataset.x);
                    const gap = (maxX - minX) / (tags.length - 1);
                    sorted.forEach((t, i) => {
                        const nx = minX + i * gap;
                        t.style.left = `${nx}px`; t.dataset.x = nx;
                    });
                }

                LineManager.render();
                for (const t of tags) await Tag.updatePos(t);
                Input.updatePosition();
                this.show(); // reposition toolbar
            }
        };

        const Selection = {
            init() { DOM.selection.className = 'selection-box'; DOM.viewport.appendChild(DOM.selection); },
            update(x, y) {
                const l = Math.min(x, State.mouse.startX), t = Math.min(y, State.mouse.startY);
                const w = Math.abs(x - State.mouse.startX), h = Math.abs(y - State.mouse.startY);
                if (w > 5 || h > 5) {
                    State.interaction.isSelecting = true; DOM.selection.style.display = 'block';
                    Object.assign(DOM.selection.style, { left: `${l}px`, top: `${t}px`, width: `${w}px`, height: `${h}px` });
                }
            },
            commit() {
                if (!State.interaction.isSelecting) return;
                const r = DOM.selection.getBoundingClientRect();
                DOM.content.querySelectorAll('.tag').forEach(t => {
                    const tr = t.getBoundingClientRect();
                    if (tr.left >= r.left && tr.right <= r.right && tr.top >= r.top && tr.bottom <= r.bottom) Tag.select(t);
                });
                State.interaction.isSelecting = false; DOM.selection.style.display = 'none';

                if (State.interaction.selectedTags.length > 1) Toolbar.show();
                else if (State.interaction.selectedTags.length === 1) Toolbar.show();
                else Toolbar.hide();
            }
        };

        async function createNewTagAtScreen(clientX, clientY) {
            Tag.deselect();
            const spacePos = screenToSpace(clientX, clientY);
            const newNode = await Tag.create('', spacePos.x, spacePos.y);
            newNode.dataset.isNew = 'true';
            Tag.select(newNode);
            setTimeout(() => {
                const r = newNode.getBoundingClientRect();
                Input.show(r.left + r.width / 2, r.top + r.height / 2, '', newNode, 'node');
            }, 10);
        }

        async function bootstrap() {
            Selection.init();

            // Load initial data
            const { data: nodes } = await _client.from('canvas_nodes').select('*');
            const { data: conns } = await _client.from('canvas_connections').select('*');
            const { data: viewState } = await _client.from('canvas_state').select('*').eq('id', 1).single();

            if (nodes) for (const n of nodes) await Tag.create(n.text, n.x, n.y, n.id, n.color);
            if (conns) { State.connections = conns; LineManager.render(); }
            if (viewState) {
                State.transform = { x: viewState.x, y: viewState.y, scale: viewState.scale };
            }

            // Check for node focus in URL
            const urlParams = new URLSearchParams(window.location.search);
            const focusNodeId = urlParams.get('node');
            if (focusNodeId) {
                setTimeout(() => {
                    const node = document.getElementById(focusNodeId);
                    if (node) {
                        const nx = parseFloat(node.dataset.x);
                        const ny = parseFloat(node.dataset.y);
                        LineManager.animateTo(-nx * State.transform.scale, -ny * State.transform.scale);
                        Tag.select(node);
                    }
                }, 500);
            }

            document.getElementById('btnCenter').addEventListener('click', () => {
                LineManager.centerContent();
            });

            // Toolbar events
            document.getElementById('btnBold').onclick = () => Toolbar.toggleStyle('bold');
            document.getElementById('btnItalic').onclick = () => Toolbar.toggleStyle('italic');
            document.getElementById('alignLeft').onclick = () => Toolbar.align('left');
            document.getElementById('alignTop').onclick = () => Toolbar.align('top');
            document.getElementById('distributeH').onclick = () => Toolbar.align('distH');
            document.getElementById('distributeV').onclick = () => Toolbar.align('distV');
            document.getElementById('deleteSelection').onclick = async () => {
                const tags = [...State.interaction.selectedTags];
                if (tags.length === 0) return;
                
                Toolbar.hide();
                try {
                    for (const t of tags) {
                        await Tag.deleteRecursive(t.id);
                    }
                } catch (e) {
                    console.error("Batch deletion failed:", e);
                }
                Tag.deselect();
                LineManager.render();
            };

            updateMatrix();

            // Realtime setup
            _client.channel('canvas_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'canvas_nodes' }, payload => {
                    const { eventType, new: newTag, old: oldTag } = payload;
                    if (eventType === 'INSERT') {
                        if (!document.getElementById(newTag.id)) Tag.create(newTag.text, newTag.x, newTag.y, newTag.id);
                    } else if (eventType === 'UPDATE') {
                        const node = document.getElementById(newTag.id);
                        if (node) {
                            if (newTag.text !== undefined) node.querySelector('span').textContent = newTag.text;
                            if (newTag.x !== undefined) {
                                node.style.left = `${newTag.x}px`;
                                node.dataset.x = newTag.x;
                            }
                            if (newTag.y !== undefined) {
                                node.style.top = `${newTag.y}px`;
                                node.dataset.y = newTag.y;
                            }

                            // Update color
                            if (newTag.color !== undefined) {
                                ['orange', 'blue', 'purple', 'green', 'grey', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9'].forEach(c => node.classList.remove(`color-${c}`));
                                if (newTag.color) node.classList.add(`color-${newTag.color}`);
                            }

                            LineManager.render();
                            Input.updatePosition();
                        }
                    } else if (eventType === 'DELETE') {
                        const node = document.getElementById(oldTag.id);
                        if (node) node.remove();
                        // Remove related connections locally to prevent ghost lines before next refresh
                        State.connections = State.connections.filter(c => c.from_id !== oldTag.id && c.to_id !== oldTag.id);
                        LineManager.render();
                    }
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'canvas_connections' }, payload => {
                    const { eventType, new: newConn, old: oldConn } = payload;
                    if (eventType === 'INSERT') {
                        if (!State.connections.find(c => c.id === newConn.id)) {
                            State.connections.push(newConn);
                            LineManager.render();
                        }
                    } else if (eventType === 'DELETE') {
                        State.connections = State.connections.filter(c => c.id !== oldConn.id);
                        LineManager.render();
                    } else if (eventType === 'UPDATE') {
                        const idx = State.connections.findIndex(c => c.id === newConn.id);
                        if (idx !== -1) {
                            State.connections[idx] = { ...State.connections[idx], ...newConn };
                            LineManager.render();
                        }
                    }
                })
                .on('broadcast', { event: 'node_color' }, payload => {
                    const { id, color } = payload.payload;
                    const node = document.getElementById(id);
                    if (node) {
                        ['orange', 'blue', 'purple', 'green', 'grey', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9'].forEach(c => node.classList.remove(`color-${c}`));
                        if (color) node.classList.add(`color-${color}`);
                        LineManager.render();
                    }
                })
                .on('broadcast', { event: 'conn_color' }, payload => {
                    const { id, color } = payload.payload;
                    const idx = State.connections.findIndex(c => c.id === id);
                    if (idx !== -1) {
                        State.connections[idx].color = color;
                        LineManager.render();
                    }
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('Realtime subscribed/reconnected');
                        SyncManager.reconcile();
                    }
                });

            // Handle device wake/pause
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    console.log('App visible, reconciling...');
                    SyncManager.reconcile();
                }
            });

            window.addEventListener('mousedown', e => {
                if (e.target.closest('.tag') || e.target.closest('.selection-toolbar') || e.target.closest('.minimal-menu')) return;
                if (DOM.input.style.display !== 'none') DOM.input.blur();
                Menu.hide();
                Tag.deselect();
                Toolbar.hide();
                State.mouse.startTime = Date.now();
                State.mouse.startX = e.clientX; State.mouse.startY = e.clientY;
                State.mouse.lastX = e.clientX; State.mouse.lastY = e.clientY;
                if (e.button === 1 || (e.button === 0 && (e.altKey || e.ctrlKey))) {
                    State.interaction.isPanning = true; DOM.viewport.style.cursor = 'grabbing';
                }

                // Reset long press
                isLongPressTriggered = false;
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }

                // Start long press timer for mouse on left click with no modifiers
                if (e.button === 0 && !e.altKey && !e.ctrlKey) {
                    longPressTimer = setTimeout(async () => {
                        isLongPressTriggered = true;
                        longPressTimer = null;

                        // Cancel potential selection/panning state
                        State.interaction.isPanning = false;
                        State.interaction.isSelecting = false;
                        DOM.selection.style.display = 'none';

                        await createNewTagAtScreen(e.clientX, e.clientY);
                    }, 600);
                }
            });

            window.addEventListener('mousemove', e => {
                const dx = e.clientX - State.mouse.lastX, dy = e.clientY - State.mouse.lastY;

                // Cancel long press if mouse moves significantly
                if (longPressTimer) {
                    const totalDx = e.clientX - State.mouse.startX;
                    const totalDy = e.clientY - State.mouse.startY;
                    const totalDist = Math.sqrt(totalDx * totalDx + totalDy * totalDy);
                    if (totalDist > 6) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                }

                if (State.interaction.isPanning) {
                    State.transform.x += dx; State.transform.y += dy; updateMatrix();
                } else if (State.interaction.isDragging && State.interaction.currentTag) {
                    const spacePos = screenToSpace(e.clientX, e.clientY);
                    const tagX = spacePos.x - State.interaction.dragOffset.x, tagY = spacePos.y - State.interaction.dragOffset.y;
                    const moveDx = tagX - parseFloat(State.interaction.currentTag.dataset.x), moveDy = tagY - parseFloat(State.interaction.currentTag.dataset.y);

                    State.interaction.selectedTags.forEach(t => {
                        let nx = parseFloat(t.dataset.x) + moveDx;
                        let ny = parseFloat(t.dataset.y) + moveDy;

                        // Snap to grid if Ctrl is held (Grid size 40px)
                        if (e.ctrlKey) {
                            nx = Math.round(nx / 40) * 40;
                            ny = Math.round(ny / 40) * 40;
                        }

                        t.style.left = `${nx}px`; t.style.top = `${ny}px`; t.dataset.x = nx; t.dataset.y = ny;
                    });
                    LineManager.render();
                    Input.updatePosition();
                } else if (State.interaction.isLinking) {
                    LineManager.renderOverlay();
                } else if (e.buttons === 1 && !State.interaction.isDragging && !State.interaction.isPanning) {
                    Selection.update(e.clientX, e.clientY);
                }
                State.mouse.lastX = e.clientX; State.mouse.lastY = e.clientY;
            });

            window.addEventListener('mouseup', async e => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                if (isLongPressTriggered) {
                    isLongPressTriggered = false;
                    e.preventDefault();
                    return; // Prevent normal mouseup click actions
                }

                const dur = Date.now() - State.mouse.startTime;
                if (State.interaction.isPanning) {
                    State.interaction.isPanning = false; DOM.viewport.style.cursor = 'crosshair';
                } else if (State.interaction.isDragging) {
                    State.interaction.isDragging = false;
                    State.interaction.selectedTags.forEach(t => Tag.updatePos(t));
                    State.interaction.currentTag.classList.remove('dragging');
                    DOM.viewport.style.cursor = 'crosshair';
                    if (State.interaction.selectedTags.length >= 1) Toolbar.show();
                } else if (State.interaction.isLinking) {
                    const tagUnderMouse = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tag');
                    if (tagUnderMouse && tagUnderMouse !== State.interaction.linkingFrom) {
                        const fromId = State.interaction.linkingFrom.id;
                        const toId = tagUnderMouse.id;
                        const exists = State.connections.some(c => (c.from_id === fromId && c.to_id === toId) || (c.from_id === toId && c.to_id === fromId));
                        if (!exists) {
                            const conn = { id: crypto.randomUUID(), from_id: fromId, to_id: toId };
                            await SyncManager.wrap(_client.from('canvas_connections').insert(conn));
                            State.connections.push(conn);
                        }
                    }
                    State.interaction.isLinking = false; State.interaction.linkingFrom = null; LineManager.render();
                } else if (State.interaction.isSelecting) {
                    Selection.commit();
                } else if (dur < 250 && e.target === DOM.viewport) {
                    if (Date.now() - State.interaction.lastBlurTime > 200) {
                        Tag.deselect();
                    }
                }
            });

            DOM.viewport.addEventListener('wheel', e => {
                e.preventDefault();
                if (e.ctrlKey) {
                    const factor = Math.exp(-e.deltaY * State.trackpad.zoomSensitivity);
                    zoomAt(e.clientX, e.clientY, State.transform.scale * factor);
                } else {
                    State.transform.x -= e.deltaX * State.trackpad.panSensitivity;
                    State.transform.y -= e.deltaY * State.trackpad.panSensitivity;
                    updateMatrix();
                }
            }, { passive: false });

            // Safari Native Pinch Support
            let startScale = 1;
            DOM.viewport.addEventListener('gesturestart', e => { e.preventDefault(); startScale = State.transform.scale; });
            DOM.viewport.addEventListener('gesturechange', e => {
                e.preventDefault();
                zoomAt(e.clientX, e.clientY, startScale * e.scale);
            });

            DOM.input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
                if (e.key === 'Escape') { e.preventDefault(); Input.hide(); }
            });
            DOM.input.addEventListener('blur', () => {
                State.interaction.lastBlurTime = Date.now();
                if (DOM.input.style.display !== 'none') Input.save();
            });

            window.addEventListener('keydown', e => {
                if ((e.key === 'Delete' || e.key === 'Backspace') && State.interaction.selectedTags.length > 0 && document.activeElement !== DOM.input) {
                    State.interaction.selectedTags.forEach(async t => {
                        await Tag.deleteRecursive(t.id);
                        LineManager.render();
                    });
                    State.interaction.selectedTags = [];
                }
            });

            document.getElementById('menuEdit').addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const entity = Menu.contextEntity;
                const type = Menu.contextType || 'node';
                if (entity) {
                    if (type === 'node') {
                        const rect = entity.getBoundingClientRect();
                        Input.show(rect.left + rect.width / 2, rect.top + rect.height / 2, entity.querySelector('span').textContent, entity, 'node');
                    } else if (type === 'connection') {
                        const fromNode = document.getElementById(entity.from_id);
                        const toNode = document.getElementById(entity.to_id);
                        if (fromNode && toNode) {
                            const startX = parseFloat(fromNode.dataset.x) + fromNode.offsetWidth / 2;
                            const startY = parseFloat(fromNode.dataset.y) + fromNode.offsetHeight / 2;
                            const endX = parseFloat(toNode.dataset.x) + toNode.offsetWidth / 2;
                            const endY = parseFloat(toNode.dataset.y) + toNode.offsetHeight / 2;
                            const sStart = spaceToScreen(startX, startY);
                            const sEnd = spaceToScreen(endX, endY);
                            Input.show((sStart.x + sEnd.x) / 2, (sStart.y + sEnd.y) / 2, entity.label || '', entity, 'connection', 0);
                        }
                    }
                }
                Menu.hide();
            });
            document.getElementById('menuConnect').addEventListener('click', () => {
                const node = Menu.contextEntity;
                if (node && Menu.contextType !== 'connection') {
                    State.mouse.startTime = Date.now();
                    State.interaction.isLinking = true;
                    State.interaction.linkingFrom = node;
                }
                Menu.hide();
            });
            document.getElementById('menuDelete').addEventListener('click', async () => {
                const entity = Menu.contextEntity;
                const type = Menu.contextType || 'node';
                if (entity) {
                    try {
                        if (type === 'node') {
                            await Tag.deleteRecursive(entity.id);
                            Tag.deselect();
                        } else if (type === 'connection') {
                            State.connections = State.connections.filter(c => c.id !== entity.id);
                            await SyncManager.wrap(_client.from('canvas_connections').delete().eq('id', entity.id));
                        }
                    } catch (e) {
                        console.error("Deletion failed:", e);
                    }
                    LineManager.render();
                }
                Menu.hide();
            });
            DOM.menu.querySelectorAll('.color-dot').forEach(dot => {
                dot.addEventListener('click', (e) => {
                    e.stopPropagation();
                    Menu.changeColor(dot.dataset.color);
                });
            });

            document.addEventListener('contextmenu', async e => {
                e.preventDefault();
                if (e.target.closest('.tag') || e.target.closest('.selection-toolbar') || e.target.closest('.minimal-menu')) return;
                await createNewTagAtScreen(e.clientX, e.clientY);
            });
            window.addEventListener('resize', updateMatrix);

            // ========== Mobile Touch Support ==========
            const TouchState = {
                initialDistance: 0,
                initialScale: 1,
                initialCenter: { x: 0, y: 0 },
                lastCenter: { x: 0, y: 0 },
                isPinching: false,
                isTwoFingerPanning: false,
                startTime: 0,
                lastTapTime: 0,
                lastTapPos: { x: 0, y: 0 }
            };

            function getTouchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            function getTouchCenter(touches) {
                return {
                    x: (touches[0].clientX + touches[1].clientX) / 2,
                    y: (touches[0].clientY + touches[1].clientY) / 2
                };
            }

            // Global touch handlers for viewport
            DOM.viewport.addEventListener('touchstart', e => {
                // Ignore if touching a tag (handled by tag's own listener)
                if (e.target.closest('.tag') || e.target.closest('.selection-toolbar') || e.target.closest('.minimal-menu')) return;

                if (DOM.input.style.display !== 'none') DOM.input.blur();
                TouchState.startTime = Date.now();

                if (e.touches.length === 1) {
                    // Single finger - prepare for potential selection or tap
                    const touch = e.touches[0];
                    State.mouse.startX = touch.clientX;
                    State.mouse.startY = touch.clientY;
                    State.mouse.lastX = touch.clientX;
                    State.mouse.lastY = touch.clientY;
                    State.mouse.startTime = Date.now();

                    // Start long press timer for touch on empty canvas area
                    isLongPressTriggered = false;
                    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                    
                    longPressTimer = setTimeout(async () => {
                        isLongPressTriggered = true;
                        longPressTimer = null;

                        // Cancel potential selection/panning state
                        State.interaction.isPanning = false;
                        State.interaction.isSelecting = false;
                        DOM.selection.style.display = 'none';

                        await createNewTagAtScreen(touch.clientX, touch.clientY);
                    }, 600);
                } else if (e.touches.length === 2) {
                    e.preventDefault();
                    
                    // Cancel touch long press
                    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }

                    // Two fingers - pinch/pan mode
                    TouchState.isPinching = true;
                    TouchState.isTwoFingerPanning = true;
                    TouchState.initialDistance = getTouchDistance(e.touches);
                    TouchState.initialScale = State.transform.scale;
                    TouchState.initialCenter = getTouchCenter(e.touches);
                    TouchState.lastCenter = TouchState.initialCenter;

                    // Cancel any ongoing single-finger operations
                    State.interaction.isDragging = false;
                    State.interaction.isSelecting = false;
                    DOM.selection.style.display = 'none';
                }
            }, { passive: false });

            DOM.viewport.addEventListener('touchmove', e => {
                if (e.touches.length === 2 && (TouchState.isPinching || TouchState.isTwoFingerPanning)) {
                    e.preventDefault();

                    const currentCenter = getTouchCenter(e.touches);
                    const currentDistance = getTouchDistance(e.touches);

                    // Pinch to zoom
                    if (TouchState.isPinching) {
                        const scaleRatio = currentDistance / TouchState.initialDistance;
                        const newScale = Math.max(0.02, Math.min(TouchState.initialScale * scaleRatio, 8.0));

                        // Zoom towards pinch center
                        const rect = DOM.viewport.getBoundingClientRect();
                        const centerX = TouchState.initialCenter.x - rect.left - rect.width / 2;
                        const centerY = TouchState.initialCenter.y - rect.top - rect.height / 2;

                        // Calculate new transform based on scale change from current scale
                        const ratio = newScale / State.transform.scale;
                        State.transform.x = centerX - (centerX - State.transform.x) * ratio;
                        State.transform.y = centerY - (centerY - State.transform.y) * ratio;
                        State.transform.scale = newScale;
                    }

                    // Two-finger pan
                    if (TouchState.isTwoFingerPanning) {
                        const dx = currentCenter.x - TouchState.lastCenter.x;
                        const dy = currentCenter.y - TouchState.lastCenter.y;
                        State.transform.x += dx;
                        State.transform.y += dy;
                        TouchState.lastCenter = currentCenter;
                    }

                    updateMatrix();
                } else if (e.touches.length === 1 && !e.target.closest('.tag') && !e.target.closest('.selection-toolbar') && !e.target.closest('.minimal-menu')) {
                    // Single finger pan (when not on a tag)
                    const touch = e.touches[0];
                    const dx = touch.clientX - State.mouse.lastX;
                    const dy = touch.clientY - State.mouse.lastY;

                    // Check if we moved enough to consider it a pan
                    const totalDx = touch.clientX - State.mouse.startX;
                    const totalDy = touch.clientY - State.mouse.startY;
                    const totalDist = Math.sqrt(totalDx * totalDx + totalDy * totalDy);

                    // Cancel long press if touch moves significantly
                    if (totalDist > 6) {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                    }

                    if (totalDist > 10) {
                        State.interaction.isPanning = true;
                        State.transform.x += dx;
                        State.transform.y += dy;
                        updateMatrix();
                    }

                    State.mouse.lastX = touch.clientX;
                    State.mouse.lastY = touch.clientY;
                } else if (e.touches.length === 1 && State.interaction.isDragging && State.interaction.currentTag) {
                    // Single finger dragging a tag
                    e.preventDefault();
                    const touch = e.touches[0];
                    const spacePos = screenToSpace(touch.clientX, touch.clientY);
                    const tagX = spacePos.x - State.interaction.dragOffset.x;
                    const tagY = spacePos.y - State.interaction.dragOffset.y;
                    const moveDx = tagX - parseFloat(State.interaction.currentTag.dataset.x);
                    const moveDy = tagY - parseFloat(State.interaction.currentTag.dataset.y);

                    State.interaction.selectedTags.forEach(t => {
                        let nx = parseFloat(t.dataset.x) + moveDx;
                        let ny = parseFloat(t.dataset.y) + moveDy;
                        t.style.left = `${nx}px`;
                        t.style.top = `${ny}px`;
                        t.dataset.x = nx;
                        t.dataset.y = ny;
                    });
                    LineManager.render();
                    Input.updatePosition();
                }
            }, { passive: false });

            DOM.viewport.addEventListener('touchend', async e => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                if (isLongPressTriggered) {
                    isLongPressTriggered = false;
                    e.preventDefault();
                    return;
                }

                const duration = Date.now() - TouchState.startTime;

                if (TouchState.isPinching || TouchState.isTwoFingerPanning) {
                    // If still have one finger, don't immediately start new interaction
                    if (e.touches.length < 2) {
                        TouchState.isPinching = false;
                        TouchState.isTwoFingerPanning = false;
                        // Reset state for remaining touch if any
                        if (e.touches.length === 1) {
                            State.mouse.startX = e.touches[0].clientX;
                            State.mouse.startY = e.touches[0].clientY;
                            State.mouse.lastX = e.touches[0].clientX;
                            State.mouse.lastY = e.touches[0].clientY;
                            State.mouse.startTime = Date.now();
                        }
                    }
                } else if (e.touches.length === 0) {
                    // All fingers lifted
                    if (State.interaction.isPanning) {
                        State.interaction.isPanning = false;
                    } else if (State.interaction.isDragging) {
                        State.interaction.isDragging = false;
                        State.interaction.selectedTags.forEach(t => Tag.updatePos(t));
                        if (State.interaction.currentTag) {
                            State.interaction.currentTag.classList.remove('dragging');
                        }
                    } else if (duration < 300 && !e.target.closest('.tag') && !e.target.closest('.selection-toolbar') && !e.target.closest('.minimal-menu')) {
                        // Tap on empty area - just deselect
                        Tag.deselect();
                        TouchState.lastTapTime = 0;
                    }
                }
            }, { passive: false });

            DOM.viewport.addEventListener('touchcancel', () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                isLongPressTriggered = false;
            });

            // Prevent default touch behaviors
            document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
            document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
            document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });
        }

        bootstrap();
    </script>
</body>

</html>
