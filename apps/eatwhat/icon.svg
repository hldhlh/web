<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 活力橙黄渐变 -->
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500" />
      <stop offset="100%" style="stop-color:#FF5E00" />
    </linearGradient>
    
    <!-- 内部玻璃质感 -->
    <linearGradient id="bowlGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0.1" />
    </linearGradient>

    <!-- 柔和光暗滤镜 -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
    </filter>
  </defs>

  <!-- 1. 基础圆角容器 -->
  <rect x="8" y="8" width="84" height="84" rx="28" fill="url(#foodGrad)" />

  <!-- 2. 微光背景扩散 -->
  <circle cx="50" cy="50" r="35" fill="#FFCC00" filter="url(#softGlow)" opacity="0.3">
    <animate attributeName="r" values="30;38;30" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- 3. 食物/碗符号：极简线条 -->
  <g transform="translate(25, 28) scale(1.1)">
    <!-- 碗身 -->
    <path d="M5 20 A20 20 0 0 0 45 20 H5 Z" fill="url(#bowlGlass)" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 蒸汽 -->
    <path d="M15 12 Q18 8, 15 4" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M25 10 Q28 6, 25 2" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite" />
    </path>
    <path d="M35 12 Q38 8, 35 4" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- 4. 精细边框锁定 -->
  <rect x="8" y="8" width="84" height="84" rx="28" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.15" />
</svg>
