    <!-- CDN 智能管理系统 -->
    <script>
        /**
         * 增强版 CDN 配置 - 国内外多节点支持
         * 包含: jsDelivr、Fastly、UNPKG、BootCDN、字节跳动 CDN、七牛云等
         */
        const CDN_CONFIG = {
            supabase: [
                // 全球 CDN
                'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
                'https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
                'https://unpkg.com/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js',
                // 国内 CDN 源
                'https://registry.npmmirror.com/@supabase/supabase-js/2.45.0/files/dist/umd/supabase.min.js',
                'https://cdn.bootcdn.net/ajax/libs/supabase/2.45.0/umd/supabase.min.js',
                // ESM 备用
                'https://esm.sh/@supabase/supabase-js@2?bundle'
            ],
            tus: [
                'https://cdn.jsdelivr.net/npm/tus-js-client@3/dist/tus.min.js',
                'https://fastly.jsdelivr.net/npm/tus-js-client@3/dist/tus.min.js',
                'https://unpkg.com/tus-js-client@3.1.3/dist/tus.min.js',
                'https://registry.npmmirror.com/tus-js-client/3.1.3/files/dist/tus.min.js',
                'https://cdn.bootcdn.net/ajax/libs/tus-js-client/3.1.3/tus.min.js'
            ],
            jszip: [
                'https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js',
                'https://fastly.jsdelivr.net/npm/jszip@3/dist/jszip.min.js',
                'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
                'https://registry.npmmirror.com/jszip/3.10.1/files/dist/jszip.min.js',
                'https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js',
                'https://cdn.staticfile.org/jszip/3.10.1/jszip.min.js'
            ]
        };

        // CDN 节点信息（用于测速和状态显示）
        const CDN_NODE_INFO = {
            'cdn.jsdelivr.net': { name: 'jsDelivr', region: '全球' },
            'fastly.jsdelivr.net': { name: 'Fastly jsDelivr', region: '全球' },
            'unpkg.com': { name: 'UNPKG', region: '美国' },
            'registry.npmmirror.com': { name: '淘宝镜像', region: '中国' },
            'cdn.bootcdn.net': { name: 'BootCDN', region: '中国' },
            'cdn.staticfile.org': { name: '七牛云', region: '中国' },
            'esm.sh': { name: 'ESM.sh', region: '全球' }
        };

        // 测速记录
        const speedTestResults = new Map();
        let currentCDNNode = null;

        // 辅助函数：安全解析域名
        function getDomain(urlStr) {
            try {
                return new URL(urlStr).hostname;
            } catch (e) {
                return urlStr.split('/')[2] || 'unknown';
            }
        }

        // 加载脚本（带超时和测速记录）
        function loadScript(url, timeout = 10000) {
            return new Promise((resolve, reject) => {
                const startTime = performance.now();
                const script = document.createElement('script');
                script.src = url;
                script.async = false;

                const timer = setTimeout(() => {
                    script.remove();
                    reject(new Error(`加载超时: ${url}`));
                }, timeout);

                script.onload = () => {
                    clearTimeout(timer);
                    const loadTime = Math.round(performance.now() - startTime);
                    const domain = getDomain(url);

                    // 记录测速结果
                    speedTestResults.set(domain, {
                        success: true,
                        latency: loadTime,
                        timestamp: Date.now()
                    });

                    resolve({ url, loadTime, domain });
                };

                script.onerror = () => {
                    clearTimeout(timer);
                    const domain = getDomain(url);
                    speedTestResults.set(domain, {
                        success: false,
                        latency: Infinity,
                        timestamp: Date.now()
                    });
                    script.remove();
                    reject(new Error(`加载失败: ${url}`));
                };

                document.head.appendChild(script);
            });
        }

        // 并行测速 + 竞速加载（谁快用谁）
        async function raceLoad(urls, name, timeout = 8000) {
            console.log(`[CDN] 开始并行测速加载 ${name}...`);

            // 检查缓存的最快节点
            const cacheKey = `cdn_best_${name.replace(/\s/g, '_')}`;
            const cachedDomain = localStorage.getItem(cacheKey);

            // 如果有缓存，先尝试缓存的节点
            if (cachedDomain) {
                const cachedUrl = urls.find(u => u.includes(cachedDomain));
                if (cachedUrl) {
                    try {
                        console.log(`[CDN] 尝试缓存节点: ${cachedDomain}`);
                        const result = await loadScript(cachedUrl, timeout);
                        console.log(`[CDN] ✓ ${name} (${cachedDomain}) ${result.loadTime}ms`);
                        currentCDNNode = cachedDomain;
                        return result;
                    } catch (e) {
                        console.log(`[CDN] 缓存节点失败，开始竞速加载...`);
                    }
                }
            }

            // 竞速加载：所有 CDN 并行请求，最快的胜出
            return new Promise((resolve, reject) => {
                let resolved = false;
                let failCount = 0;
                const totalCount = urls.length;

                urls.forEach(url => {
                    loadScript(url, timeout)
                        .then(result => {
                            if (!resolved) {
                                resolved = true;
                                const domain = result.domain;
                                console.log(`[CDN] ✓ ${name} 最快节点: ${CDN_NODE_INFO[domain]?.name || domain} (${result.loadTime}ms)`);

                                // 缓存最快的节点
                                localStorage.setItem(cacheKey, domain);
                                currentCDNNode = domain;

                                resolve(result);
                            }
                        })
                        .catch(err => {
                            failCount++;
                            if (failCount === totalCount && !resolved) {
                                reject(new Error(`所有 CDN 都无法加载 ${name}`));
                            }
                        });
                });
            });
        }

        // 顺序加载版本（备用，节省带宽）
        async function sequentialLoad(urls, name) {
            const cacheKey = `cdn_best_${name.replace(/\s/g, '_')}`;
            const cachedDomain = localStorage.getItem(cacheKey);

            // 重排序：把缓存的节点放前面
            let orderedUrls = [...urls];
            if (cachedDomain) {
                const idx = urls.findIndex(u => u.includes(cachedDomain));
                if (idx > 0) {
                    orderedUrls = [urls[idx], ...urls.filter((_, i) => i !== idx)];
                }
            }

            for (let i = 0; i < orderedUrls.length; i++) {
                try {
                    const domain = orderedUrls[i].split('/')[2];
                    console.log(`[CDN] 加载 ${name} ← ${CDN_NODE_INFO[domain]?.name || domain}`);
                    const result = await loadScript(orderedUrls[i]);
                    console.log(`[CDN] ✓ ${name} 就绪 (${result.loadTime}ms)`);
                    localStorage.setItem(cacheKey, domain);
                    currentCDNNode = domain;
                    return result;
                } catch (error) {
                    if (i < orderedUrls.length - 1) {
                        console.log(`[CDN] 切换备用源 (${i + 1}/${orderedUrls.length})`);
                    } else {
                        throw new Error(`所有 CDN 都无法加载 ${name}`);
                    }
                }
            }
        }

        // 后台测速（不阻塞主流程）
        async function backgroundSpeedTest(showToast = true) {
            console.log('[CDN] 启动后台测速...');
            const testUrls = new Set();

            // 收集所有 CDN 域名（使用 URL 解析确保正确）
            Object.values(CDN_CONFIG).forEach(urls => {
                urls.forEach(urlStr => {
                    try {
                        const urlObj = new URL(urlStr);
                        if (urlObj.hostname) {
                            testUrls.add(urlObj.hostname);
                        }
                    } catch (e) {
                        console.warn('[CDN] 无效 URL:', urlStr);
                    }
                });
            });

            // 测试每个节点
            const testPromises = [];
            for (const domain of testUrls) {
                testPromises.push((async () => {
                    try {
                        const startTime = performance.now();
                        await fetch(`https://${domain}/`, {
                            method: 'HEAD',
                            mode: 'no-cors',
                            cache: 'no-store'
                        });
                        const latency = Math.round(performance.now() - startTime);
                        speedTestResults.set(domain, {
                            success: true,
                            latency,
                            timestamp: Date.now()
                        });
                        return { domain, latency, success: true };
                    } catch (e) {
                        speedTestResults.set(domain, {
                            success: false,
                            latency: Infinity,
                            timestamp: Date.now()
                        });
                        return { domain, latency: Infinity, success: false };
                    }
                })());
            }

            // 等待所有测速完成
            const results = await Promise.all(testPromises);

            // 保存测速结果
            try {
                const resultsObj = {};
                speedTestResults.forEach((v, k) => resultsObj[k] = v);
                localStorage.setItem('cdn_speed_results', JSON.stringify(resultsObj));
            } catch (e) { }

            // 找出最优节点
            const successfulNodes = results.filter(r => r.success);
            successfulNodes.sort((a, b) => a.latency - b.latency);

            console.log('[CDN] 测速完成:', speedTestResults);

            // 显示测速结果 Toast
            if (showToast && successfulNodes.length > 0) {
                const best = successfulNodes[0];
                const bestInfo = CDN_NODE_INFO[best.domain] || { name: best.domain, region: '未知' };
                const availableCount = successfulNodes.length;
                const totalCount = results.length;

                // 获取前3个最快的节点
                const top3 = successfulNodes.slice(0, 3).map(n => {
                    const info = CDN_NODE_INFO[n.domain] || { name: n.domain };
                    return `${info.name}: ${n.latency}ms`;
                }).join(' | ');

                showCDNToast({
                    title: '🚀 CDN 测速完成',
                    best: bestInfo.name,
                    region: bestInfo.region,
                    latency: best.latency,
                    available: availableCount,
                    total: totalCount,
                    top3: top3
                });
            }

            return successfulNodes;
        }

        // CDN 测速结果 Toast 显示
        function showCDNToast(data) {
            // 移除已存在的 CDN Toast
            const existing = document.getElementById('cdn-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'cdn-toast';
            toast.innerHTML = `
                <div class="cdn-toast-header">
                    <span class="cdn-toast-title">${data.title}</span>
                    <span class="cdn-toast-close" onclick="this.parentElement.parentElement.remove()">×</span>
                </div>
                <div class="cdn-toast-body">
                    <div class="cdn-toast-best">
                        <span class="cdn-toast-label">最优节点</span>
                        <span class="cdn-toast-value">
                            <strong>${data.best}</strong>
                            <span class="cdn-toast-region">${data.region}</span>
                        </span>
                    </div>
                    <div class="cdn-toast-stats">
                        <div class="cdn-toast-stat">
                            <span class="cdn-toast-stat-value">${data.latency}ms</span>
                            <span class="cdn-toast-stat-label">延迟</span>
                        </div>
                        <div class="cdn-toast-stat">
                            <span class="cdn-toast-stat-value">${data.available}/${data.total}</span>
                            <span class="cdn-toast-stat-label">可用节点</span>
                        </div>
                    </div>
                    <div class="cdn-toast-top3">
                        <span class="cdn-toast-label">速度排名</span>
                        <span class="cdn-toast-top3-list">${data.top3}</span>
                    </div>
                </div>
            `;

            // 添加样式
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
                border: 1px solid rgba(59, 130, 246, 0.3);
                border-radius: 12px;
                padding: 0;
                min-width: 300px;
                max-width: 400px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(59, 130, 246, 0.1);
                z-index: 10000;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                animation: cdnToastSlideIn 0.3s ease-out;
                overflow: hidden;
            `;

            // 添加动画和内部样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes cdnToastSlideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
                @keyframes cdnToastSlideOut {
                    from { transform: translateX(0); opacity: 1; }
                    to { transform: translateX(100%); opacity: 0; }
                }
                .cdn-toast-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 12px 16px;
                    background: rgba(59, 130, 246, 0.1);
                    border-bottom: 1px solid rgba(59, 130, 246, 0.2);
                }
                .cdn-toast-title {
                    color: #60a5fa;
                    font-weight: 600;
                    font-size: 14px;
                }
                .cdn-toast-close {
                    color: #64748b;
                    cursor: pointer;
                    font-size: 20px;
                    line-height: 1;
                    padding: 0 4px;
                    transition: color 0.2s;
                }
                .cdn-toast-close:hover { color: #ef4444; }
                .cdn-toast-body { padding: 16px; }
                .cdn-toast-best {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 12px;
                }
                .cdn-toast-label {
                    color: #64748b;
                    font-size: 12px;
                }
                .cdn-toast-value {
                    color: #f1f5f9;
                    font-size: 14px;
                }
                .cdn-toast-region {
                    background: rgba(34, 197, 94, 0.2);
                    color: #4ade80;
                    padding: 2px 8px;
                    border-radius: 4px;
                    font-size: 11px;
                    margin-left: 8px;
                }
                .cdn-toast-stats {
                    display: flex;
                    gap: 16px;
                    margin-bottom: 12px;
                    padding: 12px;
                    background: rgba(255, 255, 255, 0.03);
                    border-radius: 8px;
                }
                .cdn-toast-stat {
                    flex: 1;
                    text-align: center;
                }
                .cdn-toast-stat-value {
                    display: block;
                    color: #22d3ee;
                    font-size: 20px;
                    font-weight: 700;
                }
                .cdn-toast-stat-label {
                    color: #64748b;
                    font-size: 11px;
                }
                .cdn-toast-top3 {
                    display: flex;
                    flex-direction: column;
                    gap: 4px;
                }
                .cdn-toast-top3-list {
                    color: #94a3b8;
                    font-size: 11px;
                    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(toast);

            // 8秒后自动消失
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.animation = 'cdnToastSlideOut 0.3s ease-in forwards';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 8000);
        }

        // 获取 CDN 状态报告
        window.getCDNStatus = function () {
            const report = {
                current: currentCDNNode ? (CDN_NODE_INFO[currentCDNNode]?.name || currentCDNNode) : 'Unknown',
                nodes: {}
            };

            speedTestResults.forEach((result, domain) => {
                report.nodes[CDN_NODE_INFO[domain]?.name || domain] = {
                    region: CDN_NODE_INFO[domain]?.region || 'Unknown',
                    latency: result.success ? `${result.latency}ms` : 'Failed',
                    status: result.success ? '✓' : '✗'
                };
            });

            console.table(report.nodes);
            return report;
        };

        // 初始化加载
        async function initializeApp() {
            const loadingEl = document.getElementById('loading-overlay');
            const statusEl = document.getElementById('loading-status');

            // 加载缓存的测速结果
            try {
                const cached = localStorage.getItem('cdn_speed_results');
                if (cached) {
                    const data = JSON.parse(cached);
                    Object.entries(data).forEach(([k, v]) => speedTestResults.set(k, v));
                }
            } catch (e) { }

            try {
                // 检测网络类型决定加载策略
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                const useRace = !connection || connection.effectiveType === '4g' || connection.downlink > 5;

                // 加载 Supabase SDK
                if (statusEl) statusEl.textContent = '正在加载核心组件...';
                if (useRace) {
                    await raceLoad(CDN_CONFIG.supabase, 'Supabase SDK');
                } else {
                    await sequentialLoad(CDN_CONFIG.supabase, 'Supabase SDK');
                }

                // 并行加载 Tus 和 JSZip
                if (statusEl) statusEl.textContent = '正在加载功能组件...';
                await Promise.all([
                    useRace ? raceLoad(CDN_CONFIG.tus, 'Tus Client') : sequentialLoad(CDN_CONFIG.tus, 'Tus Client'),
                    useRace ? raceLoad(CDN_CONFIG.jszip, 'JSZip') : sequentialLoad(CDN_CONFIG.jszip, 'JSZip')
                ]);

                // 加载主应用脚本
                if (statusEl) statusEl.textContent = '正在初始化...';
                await loadScript('script.js');

                // 隐藏加载界面
                if (loadingEl) {
                    loadingEl.style.opacity = '0';
                    setTimeout(() => loadingEl.remove(), 300);
                }

                // 启动后台测速（不阻塞主流程）
                setTimeout(backgroundSpeedTest, 2000);

                // 定期测速（每5分钟）
                setInterval(backgroundSpeedTest, 5 * 60 * 1000);

            } catch (error) {
                console.error('[CDN] 致命错误:', error);
                if (statusEl) {
                    statusEl.innerHTML = `
                        <span style="color: #ef4444;">加载失败</span><br>
                        <small style="color: #888;">请检查网络连接后刷新页面</small><br>
                        <small style="color: #666; margin-top: 8px; display: block;">${error.message}</small><br>
                        <button onclick="location.reload()" style="margin-top: 12px; padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">重新加载</button>
                        <button onclick="localStorage.clear();location.reload()" style="margin-top: 8px; margin-left: 8px; padding: 8px 16px; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer;">清除缓存重试</button>
                    `;
                }
            }
        }

        // DOM 加载完成后开始初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>

    <!-- 加载中遮罩 -->
    <div id="loading-overlay" style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
    ">
        <div style="
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        "></div>
        <div id="loading-status" style="
            margin-top: 20px;
            color: #94a3b8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
        ">正在连接服务器...</div>
        <style>
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </div>
</body>

</html>
