<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background VC++ IDE Dark Theme -->
  <rect x="5" y="5" width="90" height="90" fill="#18181F" stroke="#33333F" stroke-width="2" />
  
  <!-- Dot Grid Pattern -->
  <circle cx="20" cy="20" r="0.8" fill="#555" />
  <circle cx="40" cy="20" r="0.8" fill="#555" />
  <circle cx="60" cy="20" r="0.8" fill="#555" />
  <circle cx="80" cy="20" r="0.8" fill="#555" />
  <circle cx="20" cy="40" r="0.8" fill="#555" />
  <circle cx="40" cy="40" r="0.8" fill="#555" />
  <circle cx="60" cy="40" r="0.8" fill="#555" />
  <circle cx="80" cy="40" r="0.8" fill="#555" />
  <circle cx="20" cy="60" r="0.8" fill="#555" />
  <circle cx="40" cy="60" r="0.8" fill="#555" />
  <circle cx="60" cy="60" r="0.8" fill="#555" />
  <circle cx="80" cy="60" r="0.8" fill="#555" />

  <!-- Borderless Skinned Window Representation (Flat Dark UI with Cyan Accent) -->
  <rect x="15" y="22" width="70" height="46" fill="#2D2D35" stroke="#00FFCC" stroke-width="1.5" />
  
  <!-- Custom skined title bar (just a header fill, no OS decoration) -->
  <rect x="16.5" y="23.5" width="67" height="8" fill="#1C1C22" />
  <!-- Minimalist cyan indicator dots -->
  <circle cx="22" cy="27.5" r="1.5" fill="#00FFCC" />
  <circle cx="28" cy="27.5" r="1.5" fill="#FF0077" />

  <!-- Custom Flat Pixel Elements Inside Skinned Dialog -->
  <!-- Flat Button -->
  <rect x="25" y="44" width="22" height="8" fill="#1C1C22" stroke="#00FFCC" stroke-width="0.8" />
  <line x1="29" y1="48" x2="43" y2="48" stroke="#00FFCC" stroke-width="1" />
  
  <!-- Progress Bar (Pixel segment loader) -->
  <rect x="53" y="44" width="22" height="8" fill="#1C1C22" stroke="#444" stroke-width="0.8" />
  <rect x="55" y="46" width="6" height="4" fill="#FF0077" />
  <rect x="62" y="46" width="6" height="4" fill="#FF0077" />

  <!-- Separator Line -->
  <line x1="20" y1="38" x2="80" y2="38" stroke="#444" stroke-width="1" />

  <!-- Brand logo: C++ & DIB (pixelated text representation) -->
  <!-- "C++" text indicator badge -->
  <rect x="62" y="72" width="24" height="12" fill="#FF0077" />
  <text x="74" y="81" font-family="'Courier New', monospace" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">C++</text>
  
  <!-- "DIB" label badge -->
  <rect x="14" y="72" width="24" height="12" fill="#00FFCC" />
  <text x="26" y="81" font-family="'Courier New', monospace" font-size="8" font-weight="900" fill="#000000" text-anchor="middle">DIB</text>
</svg>
