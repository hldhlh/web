<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WordCanvas | 无限灵感矩阵</title>
    <script src="https://cdn.staticfile.org/tailwindcss/2.2.19/tailwind.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400&family=Noto+Sans+SC:wght@200;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --bg-deep: #020617;
            --grid-line: rgba(255, 255, 255, 0.03);
            --grid-dot: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: var(--bg-deep);
            color: #f8fafc;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            cursor: crosshair;
        }

        .infinite-grid {
            position: absolute;
            inset: -5000px;
            background-image:
                radial-gradient(var(--grid-dot) 1px, transparent 1px),
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px, 200px 200px, 200px 200px;
            background-position: center center;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .content-layer {
            position: absolute;
            width: 0;
            height: 0;
            left: 50%;
            top: 50%;
            transform-origin: 0 0;
            will-change: transform;
            z-index: 1;
        }

        .tag {
            position: absolute;
            will-change: transform;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.4s, border-color 0.4s;
            cursor: grab;
            display: flex;
            align-items: center;
            transform: translate(-50%, -50%);
        }

        .tag span {
            font-weight: 400;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            font-size: 1.05rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .tag.dragging {
            cursor: grabbing;
            opacity: 0.7;
            border-color: var(--primary);
            z-index: 10000 !important;
        }

        .tag.selected {
            background: rgba(129, 140, 248, 0.1);
            border-color: rgba(129, 140, 248, 0.4);
        }

        .selection-box {
            position: absolute;
            border: 0.5px solid rgba(129, 140, 248, 0.5);
            background: rgba(129, 140, 248, 0.03);
            pointer-events: none;
            z-index: 5000;
        }

        #floatingInput {
            position: fixed;
            z-index: 9999;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-family: inherit;
            font-weight: 400;
            font-size: 1.1rem;
            caret-color: var(--primary);
            display: none;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .minimal-menu {
            position: fixed;
            z-index: 10000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 6px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .minimal-menu.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .menu-item {
            padding: 12px 20px;
            border-radius: 14px;
            color: #cbd5e1;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-item.danger {
            color: #f43f5e;
        }

        .connection-line {
            stroke: #818cf8;
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0.8;
        }

        .line-preview {
            stroke-dasharray: 8;
            stroke-opacity: 0.8;
            animation: dashScroll 1s linear infinite;
        }

        @keyframes dashScroll {
            from {
                stroke-dashoffset: 16;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body class="antialiased select-none">
    <div id="viewport">
        <div id="grid" class="infinite-grid"></div>
        <svg id="globalSvg"
            style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible;">
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#818cf8" />
                </marker>
            </defs>
            <g id="lineGroups"></g>
        </svg>
        <div id="content" class="content-layer"></div>
    </div>

    <input type="text" id="floatingInput" spellcheck="false" autocomplete="off">

    <div id="minimalMenu" class="minimal-menu">
        <div class="menu-item" id="menuReset">重置星空 (Reset)</div>
        <div class="menu-item danger" id="menuDelete">抹除此灵感 (Delete)</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://fmxddvjgkykuqwmasigo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZteGRkdmpna3lrdXF3bWFzaWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwNDMzMjcsImV4cCI6MjA1OTYxOTMyN30.XCU4-03oajGh6M2-PNiBotCZSIDn_nJXkIC0Thjjfqo';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const State = {
            transform: { x: 0, y: 0, scale: 1 },
            mouse: { lastX: 0, lastY: 0, startX: 0, startY: 0, startTime: 0 },
            interaction: {
                isPanning: false, isDragging: false, isSelecting: false, isLinking: false,
                linkingFrom: null, currentTag: null, selectedTags: [], dragOffset: { x: 0, y: 0 },
                contextEntity: null, lastTap: 0
            },
            connections: []
        };

        const DOM = {
            viewport: document.getElementById('viewport'),
            grid: document.getElementById('grid'),
            content: document.getElementById('content'),
            input: document.getElementById('floatingInput'),
            menu: document.getElementById('minimalMenu'),
            svgGroup: document.getElementById('lineGroups'),
            selection: document.createElement('div')
        };

        function updateMatrix() {
            const { x, y, scale } = State.transform;
            DOM.content.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            DOM.grid.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            LineManager.render();
        }

        function screenToSpace(sx, sy) {
            const rect = DOM.viewport.getBoundingClientRect();
            const vx = sx - rect.left - rect.width / 2;
            const vy = sy - rect.top - rect.height / 2;
            return {
                x: (vx - State.transform.x) / State.transform.scale,
                y: (vy - State.transform.y) / State.transform.scale
            };
        }

        function spaceToScreen(x, y) {
            const rect = DOM.viewport.getBoundingClientRect();
            return {
                x: rect.width / 2 + State.transform.x + x * State.transform.scale,
                y: rect.height / 2 + State.transform.y + y * State.transform.scale
            };
        }

        const Tag = {
            async create(text, x, y, id = null) {
                const node = document.createElement('div');
                node.id = id || `tag-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
                node.className = 'tag';
                node.innerHTML = `<span>${text}</span>`;
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                node.dataset.x = x; node.dataset.y = y;
                this.bind(node);
                DOM.content.appendChild(node);

                if (!id) {
                    const { data, error } = await _client.from('canvas_nodes').insert({ text, x, y }).select().single();
                    if (!error && data) node.id = data.id;
                }
                return node;
            },
            bind(node) {
                node.addEventListener('mousedown', e => {
                    e.stopPropagation(); e.preventDefault();
                    if (e.button === 0) {
                        State.interaction.isDragging = true;
                        State.interaction.currentTag = node;
                        node.classList.add('dragging');
                        const spacePos = screenToSpace(e.clientX, e.clientY);
                        State.interaction.dragOffset = { x: spacePos.x - parseFloat(node.dataset.x), y: spacePos.y - parseFloat(node.dataset.y) };
                        if (!e.shiftKey && !State.interaction.selectedTags.includes(node)) this.deselect();
                        this.select(node);
                        DOM.viewport.style.cursor = 'grabbing';
                    } else if (e.button === 2) {
                        State.interaction.isLinking = true;
                        State.interaction.linkingFrom = node;
                    }
                });
                node.addEventListener('dblclick', e => {
                    e.stopPropagation();
                    Input.show(e.clientX, e.clientY, node.querySelector('span').textContent, node);
                });
                node.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); });

                let timer;
                node.addEventListener('touchstart', e => {
                    if (e.touches.length > 1) return;
                    const t = e.touches[0];
                    State.interaction.isDragging = true;
                    State.interaction.currentTag = node;
                    node.classList.add('dragging');
                    const spacePos = screenToSpace(t.clientX, t.clientY);
                    State.interaction.dragOffset = { x: spacePos.x - parseFloat(node.dataset.x), y: spacePos.y - parseFloat(node.dataset.y) };
                    timer = setTimeout(() => { if (State.interaction.isDragging) Menu.show(t.clientX, t.clientY, node); }, 600);
                }, { passive: false });
                node.addEventListener('touchend', () => { clearTimeout(timer); node.classList.remove('dragging'); State.interaction.isDragging = false; });
            },
            select(node) { node.classList.add('selected'); if (!State.interaction.selectedTags.includes(node)) State.interaction.selectedTags.push(node); },
            deselect() { State.interaction.selectedTags.forEach(t => t.classList.remove('selected')); State.interaction.selectedTags = []; },
            async updatePos(node) {
                const id = node.id;
                await _client.from('canvas_nodes').update({ x: parseFloat(node.dataset.x), y: parseFloat(node.dataset.y) }).eq('id', id);
            }
        };

        const LineManager = {
            render() {
                DOM.svgGroup.innerHTML = '';
                State.connections.forEach(conn => {
                    const from = document.getElementById(conn.from_id || conn.fromId);
                    const to = document.getElementById(conn.to_id || conn.toId);
                    if (from && to) this.drawLine(from, to);
                });
            },
            drawLine(fromNode, toNodeOrPos, isPreview = false) {
                const fromRect = fromNode.getBoundingClientRect();
                const fromCenter = { x: fromRect.left + fromRect.width / 2, y: fromRect.top + fromRect.height / 2 };

                let toCenter, toRect;
                if (isPreview) {
                    toCenter = spaceToScreen(toNodeOrPos.x, toNodeOrPos.y);
                } else {
                    toRect = toNodeOrPos.getBoundingClientRect();
                    toCenter = { x: toRect.left + toRect.width / 2, y: toRect.top + toRect.height / 2 };
                }

                const start = this.getEdgePoint(fromRect, toCenter);
                const end = isPreview ? toCenter : this.getEdgePoint(toRect, fromCenter);

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", start.x);
                line.setAttribute("y1", start.y);
                line.setAttribute("x2", end.x);
                line.setAttribute("y2", end.y);
                line.setAttribute("class", isPreview ? "connection-line line-preview" : "connection-line");
                if (!isPreview) line.setAttribute("marker-end", "url(#arrow)");
                DOM.svgGroup.appendChild(line);
            },
            getEdgePoint(rect, target) {
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const dx = target.x - centerX;
                const dy = target.y - centerY;
                if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return { x: centerX, y: centerY };
                const angle = Math.atan2(dy, dx);
                const absCos = Math.abs(Math.cos(angle)), absSin = Math.abs(Math.sin(angle));
                const halfW = rect.width / 2, halfH = rect.height / 2;
                let scale = (halfW * absSin <= halfH * absCos) ? halfW / absCos : halfH / absSin;
                return { x: centerX + Math.cos(angle) * scale, y: centerY + Math.sin(angle) * scale };
            }
        };

        const Input = {
            show(x, y, text = '', node = null) {
                State.interaction.contextEntity = node;
                if (!node) State.interaction.targetSpacePos = screenToSpace(x, y);
                DOM.input.style.display = 'block';
                DOM.input.style.left = `${x}px`;
                DOM.input.style.top = `${y}px`;
                DOM.input.value = text;
                setTimeout(() => { DOM.input.focus(); if (node) node.style.opacity = '0.2'; }, 50);
            },
            hide() {
                if (State.interaction.contextEntity) State.interaction.contextEntity.style.opacity = '1';
                DOM.input.style.display = 'none';
                State.interaction.contextEntity = null;
            },
            async save() {
                const val = DOM.input.value.trim();
                const node = State.interaction.contextEntity;
                if (val) {
                    if (node) {
                        node.querySelector('span').textContent = val;
                        await _client.from('canvas_nodes').update({ text: val }).eq('id', node.id);
                    } else {
                        Tag.create(val, State.interaction.targetSpacePos.x, State.interaction.targetSpacePos.y);
                    }
                }
                this.hide(); LineManager.render();
            }
        };

        const Menu = {
            show(x, y, node) {
                State.interaction.contextEntity = node;
                DOM.menu.style.left = `${Math.min(x, window.innerWidth - 200)}px`;
                DOM.menu.style.top = `${Math.min(y, window.innerHeight - 150)}px`;
                DOM.menu.classList.add('show');
            },
            hide() { DOM.menu.classList.remove('show'); }
        };

        const Selection = {
            init() { DOM.selection.className = 'selection-box'; DOM.viewport.appendChild(DOM.selection); },
            update(x, y) {
                const l = Math.min(x, State.mouse.startX), t = Math.min(y, State.mouse.startY);
                const w = Math.abs(x - State.mouse.startX), h = Math.abs(y - State.mouse.startY);
                if (w > 5 || h > 5) {
                    State.interaction.isSelecting = true; DOM.selection.style.display = 'block';
                    Object.assign(DOM.selection.style, { left: `${l}px`, top: `${t}px`, width: `${w}px`, height: `${h}px` });
                }
            },
            commit() {
                if (!State.interaction.isSelecting) return;
                const r = DOM.selection.getBoundingClientRect();
                DOM.content.querySelectorAll('.tag').forEach(t => {
                    const tr = t.getBoundingClientRect();
                    if (tr.left >= r.left && tr.right <= r.right && tr.top >= r.top && tr.bottom <= r.bottom) Tag.select(t);
                });
                State.interaction.isSelecting = false; DOM.selection.style.display = 'none';
            }
        };

        async function bootstrap() {
            Selection.init();

            // Load initial data
            const { data: nodes } = await _client.from('canvas_nodes').select('*');
            const { data: conns } = await _client.from('canvas_connections').select('*');

            if (nodes) for (const n of nodes) await Tag.create(n.text, n.x, n.y, n.id);
            if (conns) { State.connections = conns; LineManager.render(); }

            updateMatrix();

            // Realtime setup
            _client.channel('canvas_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'canvas_nodes' }, payload => {
                    const { eventType, new: newTag, old: oldTag } = payload;
                    if (eventType === 'INSERT') {
                        if (!document.getElementById(newTag.id)) Tag.create(newTag.text, newTag.x, newTag.y, newTag.id);
                    } else if (eventType === 'UPDATE') {
                        const node = document.getElementById(newTag.id);
                        if (node) {
                            node.querySelector('span').textContent = newTag.text;
                            node.style.left = `${newTag.x}px`;
                            node.style.top = `${newTag.y}px`;
                            node.dataset.x = newTag.x; node.dataset.y = newTag.y;
                            LineManager.render();
                        }
                    } else if (eventType === 'DELETE') {
                        const node = document.getElementById(oldTag.id);
                        if (node) node.remove();
                        LineManager.render();
                    }
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'canvas_connections' }, payload => {
                    const { eventType, new: newConn, old: oldConn } = payload;
                    if (eventType === 'INSERT') {
                        if (!State.connections.find(c => c.id === newConn.id)) {
                            State.connections.push(newConn);
                            LineManager.render();
                        }
                    } else if (eventType === 'DELETE') {
                        State.connections = State.connections.filter(c => c.id !== oldConn.id);
                        LineManager.render();
                    }
                })
                .subscribe();

            window.addEventListener('mousedown', e => {
                if (e.target.closest('.tag')) return;
                State.mouse.startTime = Date.now();
                State.mouse.startX = e.clientX; State.mouse.startY = e.clientY;
                State.mouse.lastX = e.clientX; State.mouse.lastY = e.clientY;
                if (e.button === 1 || (e.button === 0 && (e.altKey || e.ctrlKey))) {
                    State.interaction.isPanning = true; DOM.viewport.style.cursor = 'grabbing';
                }
            });

            window.addEventListener('mousemove', e => {
                const dx = e.clientX - State.mouse.lastX, dy = e.clientY - State.mouse.lastY;
                if (State.interaction.isPanning) {
                    State.transform.x += dx; State.transform.y += dy; updateMatrix();
                } else if (State.interaction.isDragging && State.interaction.currentTag) {
                    const spacePos = screenToSpace(e.clientX, e.clientY);
                    const tagX = spacePos.x - State.interaction.dragOffset.x, tagY = spacePos.y - State.interaction.dragOffset.y;
                    const moveDx = tagX - parseFloat(State.interaction.currentTag.dataset.x), moveDy = tagY - parseFloat(State.interaction.currentTag.dataset.y);
                    State.interaction.selectedTags.forEach(t => {
                        const nx = parseFloat(t.dataset.x) + moveDx, ny = parseFloat(t.dataset.y) + moveDy;
                        t.style.left = `${nx}px`; t.style.top = `${ny}px`; t.dataset.x = nx; t.dataset.y = ny;
                    });
                    LineManager.render();
                } else if (State.interaction.isLinking) {
                    LineManager.render();
                    LineManager.drawLine(State.interaction.linkingFrom, screenToSpace(e.clientX, e.clientY), true);
                } else if (e.buttons === 1 && !State.interaction.isDragging && !State.interaction.isPanning) {
                    Selection.update(e.clientX, e.clientY);
                }
                State.mouse.lastX = e.clientX; State.mouse.lastY = e.clientY;
            });

            window.addEventListener('mouseup', async e => {
                const dur = Date.now() - State.mouse.startTime;
                if (State.interaction.isPanning) {
                    State.interaction.isPanning = false; DOM.viewport.style.cursor = 'crosshair';
                } else if (State.interaction.isDragging) {
                    State.interaction.isDragging = false;
                    State.interaction.selectedTags.forEach(t => Tag.updatePos(t));
                    State.interaction.currentTag.classList.remove('dragging');
                    DOM.viewport.style.cursor = 'crosshair';
                } else if (State.interaction.isLinking) {
                    const tagUnderMouse = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tag');
                    if (tagUnderMouse && tagUnderMouse !== State.interaction.linkingFrom) {
                        const fromId = State.interaction.linkingFrom.id;
                        const toId = tagUnderMouse.id;
                        const exists = State.connections.some(c => (c.from_id === fromId && c.to_id === toId) || (c.from_id === toId && c.to_id === fromId));
                        if (!exists) {
                            await _client.from('canvas_connections').insert({ from_id: fromId, to_id: toId });
                        }
                    }
                    State.interaction.isLinking = false; State.interaction.linkingFrom = null; LineManager.render();
                } else if (State.interaction.isSelecting) {
                    Selection.commit();
                } else if (dur < 250 && e.target === DOM.viewport) {
                    Tag.deselect(); Input.show(e.clientX, e.clientY);
                } else if (dur < 250 && e.target.closest('.tag') && e.button === 2) {
                    Menu.show(e.clientX, e.clientY, e.target.closest('.tag'));
                }
                Menu.hide();
            });

            DOM.viewport.addEventListener('wheel', e => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.max(0.02, Math.min(State.transform.scale * delta, 8.0));
                const rect = DOM.viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2, mouseY = e.clientY - rect.top - rect.height / 2;
                State.transform.x -= mouseX * (newScale / State.transform.scale - 1);
                State.transform.y -= mouseY * (newScale / State.transform.scale - 1);
                State.transform.scale = newScale; updateMatrix();
            }, { passive: false });

            DOM.input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); Input.save(); }
                if (e.key === 'Escape') { e.preventDefault(); Input.hide(); }
            });
            DOM.input.addEventListener('blur', () => Input.save());

            window.addEventListener('keydown', e => {
                if ((e.key === 'Delete' || e.key === 'Backspace') && State.interaction.selectedTags.length > 0 && document.activeElement !== DOM.input) {
                    State.interaction.selectedTags.forEach(async t => {
                        await _client.from('canvas_nodes').delete().eq('id', t.id);
                        t.remove();
                    });
                    State.interaction.selectedTags = []; LineManager.render();
                }
            });

            document.getElementById('menuReset').addEventListener('click', () => {
                State.transform = { x: 0, y: 0, scale: 1 }; updateMatrix(); Menu.hide();
            });
            document.getElementById('menuDelete').addEventListener('click', async () => {
                const node = State.interaction.contextEntity;
                if (node) {
                    await _client.from('canvas_nodes').delete().eq('id', node.id);
                    node.remove(); Tag.deselect(); LineManager.render();
                }
                Menu.hide();
            });
            document.addEventListener('contextmenu', e => e.preventDefault());
        }

        bootstrap();
    </script>
</body>

</html>
