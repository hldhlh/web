<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        const CDN = [
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://unpkg.com/@supabase/supabase-js@2'
        ];
        
        const load = {
            script(url) {
                return new Promise((ok, fail) => {
                    const s = document.createElement('script');
                    s.src = url;
                    const t = setTimeout(() => { s.remove(); fail(); }, 6000);
                    s.onload = () => { clearTimeout(t); ok(); };
                    s.onerror = () => { clearTimeout(t); s.remove(); fail(); };
                    document.head.appendChild(s);
                });
            },
            wait() {
                return new Promise((ok, fail) => {
                    let n = 0;
                    const c = () => {
                        if (window.supabase?.createClient) return ok();
                        if (++n > 30) return fail();
                        setTimeout(c, 100);
                    };
                    c();
                });
            },
            async init() {
                const race = CDN.map(async u => { await this.script(u); await this.wait(); return u; });
                try {
                    await Promise.race(race);
                    window.dispatchEvent(new Event('cdnReady'));
                } catch {
                    for (const u of CDN) {
                        try { await this.script(u); await this.wait(); window.dispatchEvent(new Event('cdnReady')); return; } catch {}
                    }
                    window.dispatchEvent(new Event('cdnError'));
                }
            }
        };
        
        document.addEventListener('DOMContentLoaded', () => load.init());
    </script>
</head>
<body>
    <div class="container">
        <h1 class="page-title">日志</h1>
        <form id="logForm" class="form-container">
            <textarea id="logContent" name="content" rows="3" class="form-textarea" placeholder="随手记录点什么..." required></textarea>
            <div class="form-actions">
                <button type="button" id="cancelBtn" class="btn btn-cancel hidden">取消</button>
                <button type="submit" id="submitBtn" class="btn btn-primary">保存</button>
            </div>
        </form>
        <div id="timeline" class="timeline-container"></div>
        <div id="emptyState" class="empty-state hidden">暂无日志</div>
    </div>
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <p class="modal-text">确定删除？</p>
            <div class="modal-actions">
                <button id="cancelDelete" class="btn btn-cancel">取消</button>
                <button id="confirmDelete" class="btn btn-danger">删除</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
