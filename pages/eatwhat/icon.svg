<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <title>Eat What</title>
  <desc>Abstract minimalist icon for food choice</desc>

  <defs>
    <style>
      :root {
        --color: #000;
      }
    </style>
  </defs>

  <!-- 主圆 -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="var(--color)" stroke-width="2"/>

  <!-- 三个选项点 - 等分120度 -->
  <circle cx="64" cy="32" r="5" fill="var(--color)"/>
  <circle cx="97" cy="83" r="5" fill="var(--color)"/>
  <circle cx="31" cy="83" r="5" fill="var(--color)"/>

  <!-- 中心问号简化 -->
  <circle cx="64" cy="64" r="3" fill="var(--color)"/>

</svg>
