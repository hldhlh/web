<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP 终端数据库</title>
<script src="https://unpkg.com/pinyin-pro@3.19.5/dist/index.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg: #1a1a2e;
    --border: #8b7fa8;
    --text: #e6e6f0;
    --highlight: #9b86bd;
    --muted: #7a7a8c;
    --overlay-bg: rgba(26, 26, 46, 0.9);
    --panel-bg: #232339;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    line-height: 1.5;
    min-height: 100vh;
}
.container {
    max-width: 700px;
    margin: 0 auto;
}

.top-bar {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.input-group { flex: 1; }
input {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    width: 100%;
    outline: none;
    font-family: inherit;
}
input::placeholder { color: var(--muted); }
.btn-icon {
    cursor: pointer;
    color: var(--muted);
    font-size: 20px;
    user-select: none;
    transition: all 0.3s ease;
    padding: 4px 8px;
    border: 1px solid transparent;
    position: relative;
}
.btn-icon:hover {
    color: var(--highlight);
    border-color: var(--border);
    box-shadow: 0 0 10px rgba(155, 134, 189, 0.3);
}
.btn-icon:active {
    transform: scale(0.95);
}

/* 编辑面板遮罩 */
#panelOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
    background-color: var(--overlay-bg);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden; transition: opacity 0.3s ease-in-out;
}
#panelOverlay.active { opacity: 1; visibility: visible; }
.panel {
    width: 90%;
    max-width: 600px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    padding: 20px;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
#panelOverlay.active .panel {
    transform: scale(1) translateY(0);
}

/* 全局加载遮罩 */
#loadingOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
    background: rgba(26, 26, 46, 0.85);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden; transition: opacity 0.2s;
    color: var(--highlight); font-size: 16px;
}
#loadingOverlay.active { opacity: 1; visibility: visible; }
.spinner {
    width: 50px; height: 50px;
    border: 3px solid rgba(155, 134, 189, 0.2);
    border-top-color: var(--highlight);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

.form-row { margin-bottom: 14px; }
.form-label {
    font-size: 12px;
    color: var(--highlight);
    margin-bottom: 5px;
    display: block;
}
.form-input {
    width: 100%;
    background: #1a1a2e;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    font-family: inherit;
    box-sizing: border-box;
    transition: border-color 0.2s;
}
.form-input:focus {
    border-color: var(--highlight);
    outline: none;
}
textarea.form-input {
    min-height: 120px;
    max-height: 60vh;
    resize: vertical;
    overflow-y: auto;
    line-height: 1.5;
}
.btn-save {
    background: var(--panel-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 20px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
}
.btn-save::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(155, 134, 189, 0.3), transparent);
    transition: left 0.5s ease;
}
.btn-save:hover:not(:disabled) {
    background: var(--border);
    color: var(--bg);
    border-color: var(--highlight);
    box-shadow: 0 0 12px rgba(155, 134, 189, 0.4);
}
.btn-save:hover:not(:disabled)::before {
    left: 100%;
}
.btn-save:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 0 8px rgba(155, 134, 189, 0.3);
}
.btn-save:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: var(--muted);
}

/* 取消按钮样式 */
.btn-cancel {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    padding: 8px 20px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
    transition: all 0.2s ease;
}
.btn-cancel:hover {
    color: var(--text);
    border-color: var(--border);
    box-shadow: 0 0 10px rgba(139, 127, 168, 0.3);
}
.btn-cancel:active {
    transform: translateY(1px);
}

/* 删除按钮样式（面板中） */
.btn-danger {
    background: transparent;
    color: #c47a9f;
    border: 1px solid transparent;
    padding: 8px 20px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
    transition: all 0.2s ease;
    float: right;
}
.btn-danger:hover {
    color: #e8a0bf;
    border-color: #c47a9f;
    box-shadow: 0 0 10px rgba(196, 122, 159, 0.4);
}
.btn-danger:active {
    transform: translateY(1px);
}

.list-item {
    padding: 15px 0;
    border-bottom: 1px solid #3a3a4a;
    cursor: pointer;
    transition: color 0.2s;
}
.list-item:hover {
    color: var(--highlight);
}
.item-header { display: flex; justify-content: space-between; align-items: baseline; }
.title {
    font-size: 16px;
    transition: color 0.2s;
}
.tag {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--muted);
    padding: 2px 6px;
    text-transform: uppercase;
}
.content {
    display: none;
    margin-top: 10px;
    color: #c0c0d0;
    font-size: 14px;
    padding-left: 12px;
    border-left: 2px solid var(--border);
    white-space: pre-wrap;
    line-height: 1.6;
}
.list-item.expanded .content { display: block; }
.list-item.expanded .title {
    color: var(--highlight);
}
.btn-delete {
    float: right;
    font-size: 12px;
    color: #c47a9f;
    margin-top: 10px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    display: none;
    padding: 4px 8px;
    transition: all 0.2s ease;
}
.btn-delete:hover {
    color: #e8a0bf;
    border-color: #c47a9f;
    box-shadow: 0 0 10px rgba(196, 122, 159, 0.4);
}
.btn-delete:active {
    transform: translateY(1px);
}
.list-item.expanded .btn-delete { display: inline-block; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb {
    background: var(--border);
}
::-webkit-scrollbar-thumb:hover {
    background: var(--highlight);
}

/* 密码输入弹窗 */
#passwordOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3000;
    background-color: var(--overlay-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease-in-out;
}
#passwordOverlay.active {
    opacity: 1;
    visibility: visible;
}

/* 删除确认弹窗 */
#confirmOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3000;
    background-color: var(--overlay-bg);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease-in-out;
}
#confirmOverlay.active {
    opacity: 1;
    visibility: visible;
}

.password-panel {
    width: 90%;
    max-width: 400px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    padding: 20px;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
#passwordOverlay.active .password-panel,
#confirmOverlay.active .password-panel {
    transform: scale(1) translateY(0);
}
.password-title {
    font-size: 14px;
    color: var(--highlight);
    margin-bottom: 15px;
}
.password-input {
    width: 100%;
    background: #1a1a2e;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    font-family: inherit;
    box-sizing: border-box;
    margin-bottom: 15px;
}
.password-input:focus {
    border-color: var(--highlight);
    outline: none;
}
.password-buttons {
    display: flex;
    gap: 10px;
}
.password-btn {
    flex: 1;
    background: var(--panel-bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 20px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
}
.password-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(155, 134, 189, 0.3), transparent);
    transition: left 0.5s ease;
}
.password-btn:hover {
    background: var(--border);
    color: var(--bg);
    border-color: var(--highlight);
    box-shadow: 0 0 12px rgba(155, 134, 189, 0.4);
}
.password-btn:hover::before {
    left: 100%;
}
.password-btn:active {
    transform: translateY(1px);
    box-shadow: 0 0 8px rgba(155, 134, 189, 0.3);
}
.password-btn.cancel {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
}
.password-btn.cancel:hover {
    color: var(--text);
    border-color: var(--border);
    box-shadow: 0 0 10px rgba(139, 127, 168, 0.3);
}
.password-btn.cancel::before {
    display: none;
}
.password-btn.delete {
    background: transparent;
    color: #c47a9f;
    border: 1px solid transparent;
}
.password-btn.delete:hover {
    color: #e8a0bf;
    border-color: #c47a9f;
    box-shadow: 0 0 10px rgba(196, 122, 159, 0.4);
}
.password-btn.delete::before {
    display: none;
}
.password-error {
    color: #c47a9f;
    font-size: 12px;
    margin-top: -10px;
    margin-bottom: 10px;
    display: none;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="input-group">

<!-- 全局加载遮罩 -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">正在处理...</div>
</div>

<!-- 密码输入弹窗 -->
<div id="passwordOverlay" onclick="handlePasswordOverlayClick(event)">

        <!-- 隐藏的诱饵输入框，防止浏览器自动填充 -->

<!-- 删除确认弹窗 -->

        <div class="password-title">确认删除</div>
        <div style="color: var(--muted); font-size: 14px; margin-bottom: 20px;">此操作无法撤销，确认要永久删除此条目吗？</div>
        <div class="password-buttons">
            <button class="password-btn cancel" onclick="closeConfirmDialog()">取消</button>
            <button class="password-btn delete" onclick="confirmDelete()">删除</button>
        </div>

</div>

<script>
// ==================== 拼音工具（只声明一次） ====================
const PinyinUtil = {
    isAvailable() { return typeof pinyinPro !== 'undefined'; },
    generate(text) {
        if (!text || !this.isAvailable()) return { pinyin: '', initial: '' };
        const pinyin = pinyinPro.pinyin(text, { toneType: 'none', type: 'array' }).join('');
        const initial = pinyinPro.pinyin(text, { pattern: 'first', toneType: 'none' }).replace(/\s+/g, '');
        return { pinyin, initial };
    },
    match(text, keyword) {
        if (!text) return false;
        const lowerText = text.toLowerCase();
        const lowerKey = keyword.toLowerCase();
        if (lowerText.includes(lowerKey)) return true;
        if (this.isAvailable()) {
            const { pinyin, initial } = this.generate(text);
            return pinyin.toLowerCase().includes(lowerKey) || initial.toLowerCase().includes(lowerKey);
        }
        return false;
    }
};

// ==================== 配置 ====================
const CONFIG = {
    SUPABASE_URL: 'https://fmxddvjgkykuqwmasigo.supabase.co',
    SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZteGRkdmpna3lrdXF3bWFzaWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwNDMzMjcsImV4cCI6MjA1OTYxOTMyN30.XCU4-03oajGh6M2-PNiBotCZSIDn_nJXkIC0Thjjfqo',
    TABLE_NAME: 'sop_items',
    DEFAULT_TAG: 'MISC',
    PASSWORD: '654321'
};

const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

let db = [];
let editingId = null;
let passwordResolve = null;
let hasShownCacheAlert = false; // 标记是否已显示过缓存提示

// ==================== 加载遮罩控制 ====================
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');

function showLoading(msg = '正在处理...') {
    loadingText.textContent = msg;
    loadingOverlay.classList.add('active');
    document.getElementById('btnSave').disabled = true;
    document.getElementById('btnDelete').disabled = true;
}
function hideLoading() {
    loadingOverlay.classList.remove('active');
    document.getElementById('btnSave').disabled = false;
    document.getElementById('btnDelete').disabled = false;
}

// ==================== DOM & 初始化 ====================
const DOM = {};
function initDOM() {
    DOM.input = document.getElementById('search');
    DOM.results = document.getElementById('results');
    DOM.overlay = document.getElementById('panelOverlay');
    DOM.panel = document.getElementById('addPanel');
    DOM.newTag = document.getElementById('newTag');
    DOM.newTitle = document.getElementById('newTitle');
    DOM.newContent = document.getElementById('newContent');
    DOM.lastModifiedDisplay = document.getElementById('lastModifiedDisplay');
    setupTextareaAutoResize();
}

function formatDate(dateString) {
    if (!dateString) return '';
    const d = new Date(dateString);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function initDB(retryCount = 0) {
    const maxRetries = 3;
    try {
        showLoading(`正在加载数据...${retryCount > 0 ? ` (重试 ${retryCount}/${maxRetries})` : ''}`);

        // 添加超时控制
        const timeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject(new Error('请求超时')), 10000)
        );

        const fetchPromise = supabase
            .from(CONFIG.TABLE_NAME)
            .select('id, tag, title, info, created_at, updated_at')
            .order('created_at', { ascending: false });

        const { data, error } = await Promise.race([fetchPromise, timeoutPromise]);

        if (error) throw error;

        // 保存到本地缓存
        db = data || [];
        localStorage.setItem('sop_cache', JSON.stringify(db));
        localStorage.setItem('sop_cache_time', Date.now().toString());

        render(db);
        setupRealtimeSubscription();
        hideLoading();

        // 如果之前显示过缓存提示，现在成功连接了，重置标记并提示用户
        if (hasShownCacheAlert && retryCount > 0) {
            hasShownCacheAlert = false;
            console.log('✓ 网络已恢复，数据已更新');
        }
    } catch (e) {
        console.error('数据加载失败:', e);

        // 尝试从缓存加载
        const cachedData = localStorage.getItem('sop_cache');
        if (cachedData) {
            try {
                db = JSON.parse(cachedData);
                const cacheTime = localStorage.getItem('sop_cache_time');
                const timeDiff = Date.now() - parseInt(cacheTime || '0');
                const hours = Math.floor(timeDiff / 1000 / 60 / 60);
                render(db);
                hideLoading();

                // 只在第一次失败时显示 alert，后续静默重试
                if (!hasShownCacheAlert) {
                    hasShownCacheAlert = true;
                    alert(`网络连接失败，已加载缓存数据 (${hours}小时前)\n将在后台继续尝试连接...`);
                } else {
                    // 后台重试失败，只在控制台输出日志
                    console.log(`后台重试 ${retryCount}/${maxRetries} 失败，继续使用缓存数据`);
                }

                // 后台继续重试
                if (retryCount < maxRetries) {
                    setTimeout(() => initDB(retryCount + 1), 5000); // 增加重试间隔到5秒
                }
                return;
            } catch (parseError) {
                console.error('缓存解析失败:', parseError);
            }
        }

        // 没有缓存或缓存失败，尝试重试
        if (retryCount < maxRetries) {
            hideLoading();
            setTimeout(() => initDB(retryCount + 1), 2000);
        } else {
            hideLoading();
            alert('加载失败: ' + e.message + '\n\n请检查网络连接或刷新页面重试');
        }
    }
}

let realtimeChannel = null;

function setupRealtimeSubscription() {
    // 如果已存在订阅，先取消
    if (realtimeChannel) {
        supabase.removeChannel(realtimeChannel);
    }

    // 创建新的订阅通道
    realtimeChannel = supabase
        .channel(`${CONFIG.TABLE_NAME}_realtime`)
        .on(
            'postgres_changes',
            {
                event: 'INSERT',
                schema: 'public',
                table: CONFIG.TABLE_NAME
            },
            (payload) => {
                handleRealtimeInsert(payload.new);
            }
        )
        .on(
            'postgres_changes',
            {
                event: 'UPDATE',
                schema: 'public',
                table: CONFIG.TABLE_NAME
            },
            (payload) => {
                handleRealtimeUpdate(payload.new);
            }
        )
        .on(
            'postgres_changes',
            {
                event: 'DELETE',
                schema: 'public',
                table: CONFIG.TABLE_NAME
            },
            (payload) => {
                handleRealtimeDelete(payload.old);
            }
        )
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                console.log('✓ 实时同步已连接');
            } else if (status === 'CHANNEL_ERROR') {
                console.error('✗ 实时同步连接失败，将在5秒后重试...');
                setTimeout(() => setupRealtimeSubscription(), 5000);
            } else if (status === 'TIMED_OUT') {
                console.error('✗ 实时同步连接超时，将在5秒后重试...');
                setTimeout(() => setupRealtimeSubscription(), 5000);
            }
        });
}

// ==================== 搜索过滤工具 ====================
function filterAndRender() {
    const searchKey = DOM.input.value.toLowerCase();
    if (searchKey) {
        const filtered = db.filter(i => {
            const titleMatch = PinyinUtil.match(i.title, searchKey);
            const infoMatch = i.info && i.info.toLowerCase().includes(searchKey);
            return titleMatch || infoMatch;
        });
        render(filtered);
    } else {
        render(db);
    }
}

// 处理实时插入
function handleRealtimeInsert(newItem) {
    // 避免重复添加
    if (db.find(item => item.id === newItem.id)) return;
    db.unshift(newItem);
    filterAndRender();
}

// 处理实时更新
function handleRealtimeUpdate(updatedItem) {
    const index = db.findIndex(item => item.id === updatedItem.id);
    if (index !== -1) {
        db[index] = updatedItem;
        filterAndRender();
    }
}

// 处理实时删除
function handleRealtimeDelete(deletedItem) {
    const index = db.findIndex(item => item.id === deletedItem.id);
    if (index !== -1) {
        db.splice(index, 1);
        filterAndRender();
    }
}
function render(list) {
    if (!list.length) { DOM.results.innerHTML = '<div style="color:var(--muted);padding-top:20px;">暂无数据</div>'; return; }
    DOM.results.innerHTML = list.map(item => `
        <div class="list-item" onclick="toggleExpand(this)">
            <div class="item-header">
                <span class="title">${item.title}</span>
                <span class="tag">${item.tag || 'MISC'}</span>
            </div>
            <div class="content" onclick="event.stopPropagation()">${item.info}
                <button class="btn-delete" onclick="editItem(${item.id})">[ 编辑 ]</button>
            </div>
        </div>`).join('');
}
function toggleExpand(el) { el.classList.toggle('expanded'); }

// ==================== 密码弹窗控制 ====================
function showPasswordDialog() {
    return new Promise((resolve) => {
        passwordResolve = resolve;
        const overlay = document.getElementById('passwordOverlay');
        const input = document.getElementById('passwordInput');
        const error = document.getElementById('passwordError');

        input.value = '';
        error.style.display = 'none';
        overlay.classList.add('active');
        setTimeout(() => input.focus(), 100);
    });
}

function closePasswordDialog() {
    const overlay = document.getElementById('passwordOverlay');
    overlay.classList.remove('active');
    if (passwordResolve) {
        passwordResolve(null);
        passwordResolve = null;
    }
}

function confirmPassword() {
    const input = document.getElementById('passwordInput');
    const error = document.getElementById('passwordError');
    const password = input.value.trim();

    if (password === CONFIG.PASSWORD) {
        // 先保存 resolve 引用
        const resolveFunc = passwordResolve;
        passwordResolve = null;

        // 关闭弹窗
        const overlay = document.getElementById('passwordOverlay');
        overlay.classList.remove('active');

        // 执行 resolve
        if (resolveFunc) {
            resolveFunc(password);
        }
    } else {
        // 显示错误状态
        error.style.display = 'block';
        input.value = '';
        input.focus();

        // 添加输入框抖动动画
        input.style.animation = 'shake 0.3s';
        setTimeout(() => {
            input.style.animation = '';
        }, 300);
    }
}

function handlePasswordOverlayClick(e) {
    if (e.target === document.getElementById('passwordOverlay')) {
        closePasswordDialog();
    }
}

// 密码输入框回车键监听
document.addEventListener('DOMContentLoaded', () => {
    const passwordInput = document.getElementById('passwordInput');
    if (passwordInput) {
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmPassword();
            } else if (e.key === 'Escape') {
                closePasswordDialog();
            }
        });
    }
});

// ==================== 删除确认弹窗控制 ====================
let confirmResolve = null;

function showConfirmDialog() {
    return new Promise((resolve) => {
        confirmResolve = resolve;
        const overlay = document.getElementById('confirmOverlay');
        overlay.classList.add('active');
    });
}

function closeConfirmDialog() {
    const overlay = document.getElementById('confirmOverlay');
    overlay.classList.remove('active');
    if (confirmResolve) {
        confirmResolve(false);
        confirmResolve = null;
    }
}

function confirmDelete() {
    const resolveFunc = confirmResolve;
    confirmResolve = null;

    const overlay = document.getElementById('confirmOverlay');
    overlay.classList.remove('active');

    if (resolveFunc) {
        resolveFunc(true);
    }
}

function handleConfirmOverlayClick(e) {
    if (e.target === document.getElementById('confirmOverlay')) {
        closeConfirmDialog();
    }
}

// ==================== 面板控制 ====================
function togglePanel() {
    const active = DOM.overlay.classList.contains('active');
    if (active) {
        DOM.overlay.classList.remove('active');
        setTimeout(() => { if (!DOM.overlay.classList.contains('active')) clearForm(); }, 300);
    } else {
        DOM.overlay.classList.add('active');
        DOM.newTag.focus();
    }
}
window.handleOverlayClick = e => { if (e.target === DOM.overlay) togglePanel(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && DOM.overlay.classList.contains('active')) togglePanel(); });

function clearForm() {
    editingId = null;
    DOM.newTag.value = ''; DOM.newTitle.value = ''; DOM.newContent.value = '';
    DOM.lastModifiedDisplay.textContent = '';
    DOM.newContent.style.height = '120px';
}

// ==================== 保存与删除（乐观更新 + 实时同步） ====================
async function saveData() {
    const tag = DOM.newTag.value.trim().toUpperCase();
    const title = DOM.newTitle.value.trim();
    const content = DOM.newContent.value.trim();
    if (!title || !content) { alert('标题和内容不能为空'); return; }

    const pwd = await showPasswordDialog();
    if (!pwd) return;

    showLoading(editingId ? '正在更新...' : '正在保存...');

    try {
        if (editingId) {
            // 更新操作 - 添加超时控制
            const timeoutPromise = new Promise((_, reject) =>
                setTimeout(() => reject(new Error('请求超时')), 15000)
            );

            const updatePromise = supabase
                .from(CONFIG.TABLE_NAME)
                .update({ tag: tag || CONFIG.DEFAULT_TAG, title, info: content })
                .eq('id', editingId)
                .select('id, tag, title, info, created_at, updated_at');

            const { data, error } = await Promise.race([updatePromise, timeoutPromise]);

            if (error) throw error;

            // 立即更新本地数据
            if (data && data[0]) {
                const index = db.findIndex(item => item.id === editingId);
                if (index !== -1) {
                    db[index] = data[0];
                }
            }
        } else {
            // 插入操作 - 添加超时控制
            const timeoutPromise = new Promise((_, reject) =>
                setTimeout(() => reject(new Error('请求超时')), 15000)
            );

            const insertPromise = supabase
                .from(CONFIG.TABLE_NAME)
                .insert([{ tag: tag || CONFIG.DEFAULT_TAG, title, info: content }])
                .select('id, tag, title, info, created_at, updated_at');

            const { data, error } = await Promise.race([insertPromise, timeoutPromise]);

            if (error) throw error;

            // 立即添加到本地数据
            if (data && data[0]) {
                db.unshift(data[0]);
            }
        }

        // 更新缓存
        localStorage.setItem('sop_cache', JSON.stringify(db));
        localStorage.setItem('sop_cache_time', Date.now().toString());

        // 立即重新渲染
        filterAndRender();

        hideLoading();
        togglePanel();
        clearForm();
        DOM.input.focus();
    } catch (err) {
        hideLoading();
        alert('保存失败: ' + err.message + '\n\n请检查网络连接后重试');
    }
}

function editItem(id) {
    const item = db.find(i => i.id === id);
    if (!item) return;
    DOM.newTag.value = item.tag || '';
    DOM.newTitle.value = item.title;
    DOM.newContent.value = item.info;
    DOM.lastModifiedDisplay.textContent = formatDate(item.updated_at || item.created_at) ? `最后更新: ${formatDate(item.updated_at || item.created_at)}` : '';
    editingId = id;
    DOM.overlay.classList.add('active');
    DOM.newTag.focus();
    setTimeout(() => DOM.newContent.dispatchEvent(new Event('input')), 0);
}

async function deleteCurrentItem() {
    if (!editingId) { alert('没有正在编辑的条目'); return; }

    const confirmed = await showConfirmDialog();
    if (!confirmed) return;

    const pwd = await showPasswordDialog();
    if (!pwd) return;

    showLoading('正在删除...');

    try {
        // 添加超时控制
        const timeoutPromise = new Promise((_, reject) =>
            setTimeout(() => reject(new Error('请求超时')), 15000)
        );

        const deletePromise = supabase
            .from(CONFIG.TABLE_NAME)
            .delete()
            .eq('id', editingId);

        const { error } = await Promise.race([deletePromise, timeoutPromise]);

        if (error) throw error;

        // 立即从本地数据中删除
        const index = db.findIndex(item => item.id === editingId);
        if (index !== -1) {
            db.splice(index, 1);
        }

        // 更新缓存
        localStorage.setItem('sop_cache', JSON.stringify(db));
        localStorage.setItem('sop_cache_time', Date.now().toString());

        // 立即重新渲染
        filterAndRender();

        hideLoading();
        togglePanel();
        clearForm();
    } catch (err) {
        hideLoading();
        alert('删除失败: ' + err.message + '\n\n请检查网络连接后重试');
    }
}

// ==================== 其他辅助函数 ====================
function setupTextareaAutoResize() {
    const textarea = DOM.newContent;
    const minHeight = 120;
    const maxHeight = window.innerHeight * 0.6;
    const resize = () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.max(minHeight, Math.min(textarea.scrollHeight, maxHeight)) + 'px';
    };
    textarea.addEventListener('input', resize);
    resize();
}

function setupSearch() {
    DOM.input.addEventListener('input', () => filterAndRender());
}

function init() {
    initDOM();
    initDB();
    setupSearch();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
