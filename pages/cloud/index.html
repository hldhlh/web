<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                </svg>
                <span>私人云空间</span>
            </div>
            
            <ul class="nav-links">
                <li class="nav-item active" data-view="files">
                    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    我的文件
                </li>
                <li class="nav-item" data-view="shared">
                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    收藏
                </li>
                <li class="nav-item" data-view="tasks">
                    <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    传输列表
                    <span class="nav-badge" id="taskBadge" style="display:none">0</span>
                </li>
                <li class="nav-item" data-view="trash">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    回收站
                </li>
            </ul>

            <div class="storage-info">
                <div style="font-size: 0.85rem; display: flex; justify-content: space-between;">
                    <span>存储空间</span>
                    <span>∞</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%"></div>
                </div>
                <div style="font-size: 0.75rem; color: #888;">已用 0 B / ∞</div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <button class="mobile-menu-btn" id="menuBtn">
                    <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                
                <div class="search-bar">
                    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; color: #888;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="搜索文件...">
                </div>

            </header>

            <div class="content-area">
                <!-- File View -->
                <div id="fileView">
                    <div class="view-header">
                        <div class="header-left">
                             <h2 class="section-title">最近上传</h2>
                             <div id="breadcrumbNav" class="breadcrumb-nav"></div>
                        </div>
                        <div class="view-actions" id="trashActions" style="display: none;">
                            <button class="btn-text" id="restoreAllBtn">全部恢复</button>
                            <button class="btn-text danger" id="emptyTrashBtn">清空回收站</button>
                        </div>
                    </div>
                    <div class="file-grid" id="fileGrid">
                        <!-- Files will be injected here by JS -->
                    </div>
                </div>

                <!-- Task View (Hidden by default) -->
                <div id="taskView" style="display: none;">
                    <h2 class="section-title">传输列表</h2>
                    <div class="task-list-container">
                        <div class="task-list-header">
                            <span>任务名称</span>
                            <span>状态</span>
                            <span>操作</span>
                        </div>
                        <div id="taskList">
                            <!-- Tasks injected here -->
                        </div>
                    </div>
                    <div id="emptyTaskState" class="empty-state" style="display: none;">
                        <p>暂无传输任务</p>
                    </div>
                </div>
            </div>

            <button class="fab" id="uploadBtn">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </main>
        
        <!-- Overlay for mobile sidebar -->
        <div id="overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 90;"></div>
    </div>

    <div class="toast" id="toast">文件上传成功</div>
    
    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" id="newFolderAction">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
            新建文件夹
        </div>
        <div class="context-menu-item" id="renameAction">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            重命名
        </div>
        <div class="context-menu-separator" style="height: 1px; background: #eee; margin: 4px 0;"></div>
        <div class="context-menu-item" id="downloadAction">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            下载
        </div>
        <div class="context-menu-item" id="shareAction">
             <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span id="shareText">收藏</span>
        </div>
        <div class="context-menu-item" id="copyLinkAction" style="display: none;">
             <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            复制链接
        </div>
        <div class="context-menu-item" id="restoreAction" style="display: none;">
             <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
            恢复
        </div>
        <div class="context-menu-item" id="deleteAction">
             <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span id="deleteText">删除</span>
        </div>
    </div>

    <!-- Task Manager Removed (Integrated into main content) -->

    <!-- Hidden File Input -->
    <input type="file" id="fileInput" style="display: none">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tus Client for Resumable Uploads -->
    <script src="https://cdn.jsdelivr.net/npm/tus-js-client@3/dist/tus.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
