<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOP 终端数据库</title>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.5/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg: #111;
    --border: #333;
    --text: #eee;
    --highlight: #4af626;
    --muted: #666;
    --overlay-bg: rgba(0, 0, 0, 0.7);
    --panel-bg: #1a1a1a;
}
body { font-family: "Courier New", Courier, monospace, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.5; }
.container { max-width: 600px; margin: 0 auto; }

.top-bar { position: sticky; top: 0; background: var(--bg); z-index: 10; padding-bottom: 10px; border-bottom: 2px solid var(--border); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
.input-group { flex: 1; }
input { background: transparent; border: none; color: #fff; font-size: 18px; width: 100%; outline: none; font-family: inherit; }
input::placeholder { color: #555; }
.btn-icon { cursor: pointer; color: var(--muted); font-weight: bold; font-size: 20px; user-select: none; transition: color 0.2s; padding: 0 10px;}
.btn-icon:hover { color: var(--highlight); }

/* 编辑面板遮罩 */
#panelOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
    background-color: var(--overlay-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden; transition: all 0.2s ease-in-out;
}
#panelOverlay.active { opacity: 1; visibility: visible; }
.panel { 
    width: 90%; max-width: 550px; background: var(--panel-bg); border: 1px solid var(--highlight);
    box-shadow: 0 0 20px rgba(74, 246, 38, 0.1); padding: 20px; border-radius: 4px;
    transform: scale(0.95) translateY(10px); transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
#panelOverlay.active .panel { transform: scale(1) translateY(0); }

/* 全局加载遮罩 */
#loadingOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    opacity: 0; visibility: hidden; transition: opacity 0.3s;
    color: var(--highlight); font-size: 18px;
}
#loadingOverlay.active { opacity: 1; visibility: visible; }
.spinner {
    width: 60px; height: 60px; border: 5px solid rgba(74,246,38,0.2);
    border-top-color: var(--highlight); border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.form-row { margin-bottom: 12px; }
.form-label { font-size: 12px; color: var(--highlight); margin-bottom: 4px; display: block; }
.form-input { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 8px; font-family: inherit; box-sizing: border-box; caret-color: var(--highlight); }
.form-input:focus { border-color: var(--highlight); outline: none; }
textarea.form-input { min-height: 120px; max-height: 60vh; resize: vertical; overflow-y: auto; line-height: 1.5; }
.btn-save { background: var(--border); color: #fff; border: none; padding: 8px 20px; font-family: inherit; cursor: pointer; margin-top: 5px; transition: all 0.2s; }
.btn-save:hover:not(:disabled) { background: var(--highlight); color: #000; }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

.list-item { padding: 15px 0; border-bottom: 1px solid #222; cursor: pointer; transition: color 0.2s; }
.list-item:hover { color: var(--highlight); }
.item-header { display: flex; justify-content: space-between; align-items: baseline; }
.title { font-size: 16px; font-weight: bold; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
.content { display: none; margin-top: 10px; color: #bbb; font-size: 14px; padding-left: 10px; border-left: 2px solid var(--border); white-space: pre-wrap; }
.list-item.expanded .content { display: block; }
.list-item.expanded .title { color: var(--highlight); }
.btn-delete { float: right; font-size: 12px; color: #ff4444; margin-top: 10px; border: none; background: none; cursor: pointer; display: none; }
.list-item.expanded .btn-delete { display: inline-block; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--highlight); }
</style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="input-group">
            <input type="text" id="search" placeholder="> 输入关键词或简拼..." autofocus>
        </div>
        <div class="btn-icon" onclick="togglePanel()" title="Add New Entry">[ + ]</div>
    </div>
    <div id="results"></div>
</div>

<!-- 编辑面板遮罩 -->
<div id="panelOverlay" onclick="handleOverlayClick(event)">
    <div class="panel" id="addPanel">
        <div style="color: #666; font-size: 12px; margin-bottom: 10px;">
            数据编辑面板
            <span id="lastModifiedDisplay" style="float: right; color: #333; font-size: 10px;"></span>
        </div>
        <div class="form-row">
            <label class="form-label">> 分类</label>
            <input type="text" id="newTag" class="form-input" placeholder="例如: TYPE, SOP, TAG">
        </div>
        <div class="form-row">
            <label class="form-label">> 标题</label>
            <input type="text" id="newTitle" class="form-input" placeholder="例如: 前厅开早SOP">
        </div>
        <div class="form-row">
            <label class="form-label">> 内容详情</label>
            <textarea id="newContent" class="form-input" placeholder="在此输入详细配方或流程..."></textarea>
        </div>
        <div style="margin-top: 15px;">
            <button class="btn-save" id="btnSave" onclick="saveData()">[ 保存 ]</button>
            <button class="btn-save" style="background:transparent; color:#666;" onclick="togglePanel()">[ 取消 ]</button>
            <button class="btn-save" style="background:transparent; color:#882222; float:right;" id="btnDelete" onclick="deleteCurrentItem()">[ 删除 ]</button>
        </div>
    </div>
</div>

<!-- 全局加载遮罩 -->
<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">正在处理...</div>
</div>

<script>
// ==================== 拼音工具（只声明一次） ====================
const PinyinUtil = {
    isAvailable() { return typeof pinyinPro !== 'undefined'; },
    generate(text) {
        if (!text || !this.isAvailable()) return { pinyin: '', initial: '' };
        const pinyin = pinyinPro.pinyin(text, { toneType: 'none', type: 'array' }).join('');
        const initial = pinyinPro.pinyin(text, { pattern: 'first', toneType: 'none' }).replace(/\s+/g, '');
        return { pinyin, initial };
    },
    match(text, keyword) {
        if (!text) return false;
        const lowerText = text.toLowerCase();
        const lowerKey = keyword.toLowerCase();
        if (lowerText.includes(lowerKey)) return true;
        if (this.isAvailable()) {
            const { pinyin, initial } = this.generate(text);
            return pinyin.toLowerCase().includes(lowerKey) || initial.toLowerCase().includes(lowerKey);
        }
        return false;
    }
};

// ==================== 配置 ====================
const CONFIG = {
    SUPABASE_URL: 'https://fmxddvjgkykuqwmasigo.supabase.co',
    SUPABASE_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZteGRkdmpna3lrdXF3bWFzaWdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwNDMzMjcsImV4cCI6MjA1OTYxOTMyN30.XCU4-03oajGh6M2-PNiBotCZSIDn_nJXkIC0Thjjfqo',
    TABLE_NAME: 'sop_items',
    DEFAULT_TAG: 'MISC',
    PASSWORD: '654321'
};

const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

let db = [];
let editingId = null;

// ==================== 加载遮罩控制 ====================
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');

function showLoading(msg = '正在处理...') {
    loadingText.textContent = msg;
    loadingOverlay.classList.add('active');
    document.getElementById('btnSave').disabled = true;
    document.getElementById('btnDelete').disabled = true;
}
function hideLoading() {
    loadingOverlay.classList.remove('active');
    document.getElementById('btnSave').disabled = false;
    document.getElementById('btnDelete').disabled = false;
}

// ==================== DOM & 初始化 ====================
const DOM = {};
function initDOM() {
    DOM.input = document.getElementById('search');
    DOM.results = document.getElementById('results');
    DOM.overlay = document.getElementById('panelOverlay');
    DOM.panel = document.getElementById('addPanel');
    DOM.newTag = document.getElementById('newTag');
    DOM.newTitle = document.getElementById('newTitle');
    DOM.newContent = document.getElementById('newContent');
    DOM.lastModifiedDisplay = document.getElementById('lastModifiedDisplay');
    setupTextareaAutoResize();
}

function formatDate(dateString) {
    if (!dateString) return '';
    const d = new Date(dateString);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function initDB() {
    try {
        const { data, error } = await supabase.from(CONFIG.TABLE_NAME).select('*').order('created_at', { ascending: false });
        if (error) throw error;
        db = data || [];
        render(db);
        setupRealtimeSubscription();
    } catch (e) { console.error(e); alert('加载失败: '+e.message); }
}
function setupRealtimeSubscription() {
    supabase.channel(`${CONFIG.TABLE_NAME}_changes`)
        .on('postgres_changes', { event: '*', schema: 'public', table: CONFIG.TABLE_NAME }, () => loadData())
        .subscribe();
}
async function loadData() {
    const { data, error } = await supabase.from(CONFIG.TABLE_NAME).select('*').order('created_at', { ascending: false });
    if (error) throw error;
    db = data || [];
    render(db);
}
function render(list) {
    if (!list.length) { DOM.results.innerHTML = '<div style="color:#444;padding-top:20px;">_NO DATA FOUND</div>'; return; }
    DOM.results.innerHTML = list.map(item => `
        <div class="list-item" onclick="toggleExpand(this)">
            <div class="item-header">
                <span class="title">${item.title}</span>
                <span class="tag">${item.tag || 'MISC'}</span>
            </div>
            <div class="content" onclick="event.stopPropagation()">${item.info}
                <button class="btn-delete" onclick="editItem(${item.id})">[ 编辑 ]</button>
            </div>
        </div>`).join('');
}
function toggleExpand(el) { el.classList.toggle('expanded'); }

// ==================== 面板控制 ====================
function togglePanel() {
    const active = DOM.overlay.classList.contains('active');
    if (active) {
        DOM.overlay.classList.remove('active');
        setTimeout(() => { if (!DOM.overlay.classList.contains('active')) clearForm(); }, 200);
    } else {
        DOM.overlay.classList.add('active');
        DOM.newTag.focus();
    }
}
window.handleOverlayClick = e => { if (e.target === DOM.overlay) togglePanel(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && DOM.overlay.classList.contains('active')) togglePanel(); });

function clearForm() {
    editingId = null;
    DOM.newTag.value = ''; DOM.newTitle.value = ''; DOM.newContent.value = '';
    DOM.lastModifiedDisplay.textContent = '';
    DOM.newContent.style.height = '120px';
}

// ==================== 保存与删除（带加载动画） ====================
async function saveData() {
    const tag = DOM.newTag.value.trim().toUpperCase();
    const title = DOM.newTitle.value.trim();
    const content = DOM.newContent.value.trim();
    if (!title || !content) { alert('标题和内容不能为空'); return; }

    const pwd = prompt('请输入密码以保存：');
    if (pwd !== CONFIG.PASSWORD) { alert('密码错误！'); return; }

    showLoading(editingId ? '正在更新...' : '正在保存...');

    try {
        if (editingId) {
            const { error } = await supabase.from(CONFIG.TABLE_NAME)
                .update({ tag: tag || CONFIG.DEFAULT_TAG, title, info: content })
                .eq('id', editingId);
            if (error) throw error;
        } else {
            const { error } = await supabase.from(CONFIG.TABLE_NAME)
                .insert([{ tag: tag || CONFIG.DEFAULT_TAG, title, info: content }]);
            if (error) throw error;
        }
        await loadData();
        hideLoading();
        togglePanel();
        clearForm();
        DOM.input.focus();
    } catch (err) {
        hideLoading();
        alert('保存失败: ' + err.message);
    }
}

function editItem(id) {
    const item = db.find(i => i.id === id);
    if (!item) return;
    DOM.newTag.value = item.tag || '';
    DOM.newTitle.value = item.title;
    DOM.newContent.value = item.info;
    DOM.lastModifiedDisplay.textContent = formatDate(item.updated_at || item.created_at) ? `最后更新: ${formatDate(item.updated_at || item.created_at)}` : '';
    editingId = id;
    DOM.overlay.classList.add('active');
    DOM.newTag.focus();
    setTimeout(() => DOM.newContent.dispatchEvent(new Event('input')), 0);
}

async function deleteCurrentItem() {
    if (!editingId) { alert('没有正在编辑的条目'); return; }
    if (!confirm('确认永久删除此条目？')) return;

    const pwd = prompt('请输入密码以删除：');
    if (pwd !== CONFIG.PASSWORD) { alert('密码错误！'); return; }

    showLoading('正在删除...');

    try {
        const { error } = await supabase.from(CONFIG.TABLE_NAME).delete().eq('id', editingId);
        if (error) throw error;
        await loadData();
        hideLoading();
        togglePanel();
        clearForm();
    } catch (err) {
        hideLoading();
        alert('删除失败: ' + err.message);
    }
}

// ==================== 其他辅助函数 ====================
function setupTextareaAutoResize() {
    const textarea = DOM.newContent;
    const minHeight = 120;
    const maxHeight = window.innerHeight * 0.6;
    const resize = () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.max(minHeight, Math.min(textarea.scrollHeight, maxHeight)) + 'px';
    };
    textarea.addEventListener('input', resize);
    resize();
}

function setupSearch() {
    DOM.input.addEventListener('input', e => {
        const key = e.target.value.toLowerCase();
        const filtered = db.filter(i => PinyinUtil.match(i.title, key) || PinyinUtil.match(i.info, key));
        render(filtered);
    });
}

function init() {
    initDOM();
    initDB();
    setupSearch();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
