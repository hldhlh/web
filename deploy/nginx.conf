server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    etag on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /apps/vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        try_files $uri $uri/ =404;
    }
}
