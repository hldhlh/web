<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="theme-color" name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./favicon.svg">
  <title>应用导航</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('app-theme') || 'light';
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --app-primary-color: #0a84ff;
      --app-background: #f6f8fb;
      --app-surface: rgba(255, 255, 255, 0.72);
      --surface-border: rgba(15, 23, 42, 0.08);
      --control-shadow: 0 10px 30px rgba(30, 41, 59, 0.1);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --transition-speed: 0.25s;
      color-scheme: light;
    }

    [data-theme=dark] {
      --app-background: #07090e;
      --app-surface: rgba(20, 25, 34, 0.72);
      --surface-border: rgba(255, 255, 255, 0.1);
      --control-shadow: 0 12px 36px rgba(0, 0, 0, 0.34);
      --text-primary: #f4f6fa;
      --text-secondary: #8992a3;
      color-scheme: dark;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro SC', 'SF Pro Display', sans-serif;
      background: var(--app-background);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    /* 背景层：通过 opacity 变化实现平滑切换 */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-attachment: fixed;
      transition: opacity var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
    }

    .bg-layer.active {
      opacity: 1;
    }

    .bg-dark {
      background:
        radial-gradient(circle at 14% -8%, rgba(91, 116, 164, 0.26) 0, transparent 34%),
        radial-gradient(circle at 92% 2%, rgba(40, 66, 108, 0.18) 0, transparent 30%),
        linear-gradient(150deg, #151b27 0%, #0b0f17 50%, #07090e 100%);
    }

    .bg-light {
      background:
        radial-gradient(circle at 12% -8%, rgba(147, 197, 253, 0.28) 0, transparent 34%),
        radial-gradient(circle at 92% 2%, rgba(196, 181, 253, 0.14) 0, transparent 28%),
        linear-gradient(150deg, #f8fafc 0%, #ffffff 52%, #f3f6fa 100%);
    }

    /* 初始开场动画 */
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      animation: pageEnter 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .status-bar {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: flex-end;
    }

    .app-icons-wrapper {
      flex: 1;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 2.5rem;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      align-content: start;
    }

    .app-icon {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .app-icon-image {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      background: transparent;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .app-icon:hover .app-icon-image {
      transform: translateY(-8px) scale(1.1);
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.2));
    }

    [data-theme=dark] .app-icon:hover .app-icon-image {
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.5));
    }

    .app-icon-image svg,
    .app-icon-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .app-icon-fallback {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #2997ff, #0066cc);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .app-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      max-width: 100%;
      word-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.8;
      transition: color var(--transition-speed) ease;
      line-height: 1.3;
    }

    .version-footer {
      flex: 0 0 auto;
      padding: 0.75rem 1.25rem max(1rem, env(safe-area-inset-bottom));
      color: var(--text-secondary);
      font-size: 0.68rem;
      line-height: 1.4;
      letter-spacing: 0.02em;
      text-align: center;
      opacity: 0.72;
    }

    .theme-toggle,
    .clear-cache-btn {
      background: var(--app-surface);
      border: 1px solid var(--surface-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--control-shadow);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-primary);
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
    }

    .theme-icon {
      transition: opacity 0.2s ease, transform 0.3s ease;
    }

    .theme-icon-moon,
    [data-theme=dark] .theme-icon-sun {
      display: none;
    }

    [data-theme=dark] .theme-icon-moon {
      display: block;
    }

    .clear-cache-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      position: fixed;
      left: 2rem;
      bottom: 2rem;
      z-index: 1000;
    }

    .clear-cache-btn:hover {
      transform: translateY(-3px) rotate(-5deg);
      color: #ff3b30;
      box-shadow: 0 12px 25px rgba(255, 59, 48, 0.2);
    }

    @media (max-width: 768px) {
      .app-icons-wrapper {
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        padding: 1.2rem;
      }

      .app-icon-image {
        width: 60px;
        height: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="bg-dark" class="bg-layer bg-dark"></div>
  <div id="bg-light" class="bg-layer bg-light"></div>

  <div class="container">
    <div class="status-bar">
      <button id="theme-toggle" class="theme-toggle" title="切换到黑夜模式" aria-label="切换到黑夜模式"
        aria-pressed="false">
        <svg class="theme-icon theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
        <svg class="theme-icon theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
        </svg>
      </button>
    </div>
    <div class="app-icons-wrapper" id="app-container"></div>
    <footer id="version-footer" class="version-footer" aria-live="polite">版本信息读取中…</footer>
  </div>

  <button id="clear-cache-btn" class="clear-cache-btn" title="清理所有 App 本地缓存" aria-label="清理所有 App 本地缓存">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
    </svg>
  </button>

  <script type="module">
    import { getAppDirectories } from './apps.js';

    const Theme = {
      getTheme() { return localStorage.getItem('app-theme') || 'light' },
      updateBGLayers(t) {
        document.getElementById('bg-light').classList.toggle('active', t === 'light');
        document.getElementById('bg-dark').classList.toggle('active', t === 'dark');
      },
      setTheme(t) {
        const isDark = t === 'dark';
        const toggle = document.getElementById('theme-toggle');
        localStorage.setItem('app-theme', t);
        document.documentElement.setAttribute('data-theme', t);
        document.body.setAttribute('data-theme', t);
        document.getElementById('theme-color').content = isDark ? '#07090e' : '#f6f8fb';
        if (toggle) {
          const label = isDark ? '切换到白天模式' : '切换到黑夜模式';
          toggle.title = label;
          toggle.setAttribute('aria-label', label);
          toggle.setAttribute('aria-pressed', String(isDark));
        }
        this.updateBGLayers(t);
      },
      toggle() {
        const next = this.getTheme() === 'light' ? 'dark' : 'light';
        if (document.startViewTransition) {
          document.startViewTransition(() => this.setTheme(next));
        } else {
          this.setTheme(next);
        }
      },
      init() { this.setTheme(this.getTheme()) }
    };

    // 缓存管理
    const CACHE_PREFIX = 'app_icon_v2_';
    const APP_CACHE_KEY_PATTERN = /(?:^|[-_:])(cache|cached|icon-cache|cdn-manager)(?:[-_:]|$)/i;

    const isAppCacheKey = (key) => key.startsWith(CACHE_PREFIX) || APP_CACHE_KEY_PATTERN.test(key);

    const clearStorageCacheKeys = (storage) => {
      let cleared = 0;
      Object.keys(storage).forEach((key) => {
        if (!isAppCacheKey(key)) return;
        storage.removeItem(key);
        cleared += 1;
      });
      return cleared;
    };

    const clearAllAppCaches = async () => {
      let cleared = clearStorageCacheKeys(localStorage) + clearStorageCacheKeys(sessionStorage);

      if ('caches' in window) {
        const cacheNames = await caches.keys();
        const results = await Promise.all(cacheNames.map((name) => caches.delete(name)));
        cleared += results.filter(Boolean).length;
      }

      if ('indexedDB' in window && typeof indexedDB.databases === 'function') {
        const databases = await indexedDB.databases();
        const cacheDatabases = databases
          .map((database) => database.name)
          .filter((name) => name && isAppCacheKey(name));
        await Promise.all(cacheDatabases.map((name) => new Promise((resolve) => {
          const request = indexedDB.deleteDatabase(name);
          request.onsuccess = request.onerror = request.onblocked = () => resolve();
        })));
        cleared += cacheDatabases.length;
      }

      sessionStorage.setItem('force_clear_cache', 'true');
      return cleared;
    };

    const iconCache = {
      get(dir) {
        try {
          const item = localStorage.getItem(CACHE_PREFIX + dir);
          return item ? JSON.parse(item) : null;
        } catch (e) { console.error(e); return null; }
      },
      set(dir, data) {
        try {
          localStorage.setItem(CACHE_PREFIX + dir, JSON.stringify(data));
        } catch (e) {
          // 如果存储满了，清空旧缓存再试
          console.warn('LocalStorage full, clearing icons...');
          this.clear(false); // 不刷新页面
          try { localStorage.setItem(CACHE_PREFIX + dir, JSON.stringify(data)); } catch (e2) { }
        }
      },
      clear(reload = true) {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith(CACHE_PREFIX)) localStorage.removeItem(k);
        });
        sessionStorage.setItem('force_clear_cache', 'true');
        if (reload) location.reload();
      }
    };

    // 工具函数：计算哈希 (SHA-256)
    const computeHash = async (content) => {
      const msgBuffer = new TextEncoder().encode(content);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    // 工具函数：Blob 转 Base64
    const blobToBase64 = (blob) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    };

    const getDirFromPath = (p) => { if (!p) return ''; const i = p.indexOf('/'); return i === -1 ? p : p.slice(0, i); };

    // 首页日历只展示对当天有用的状态；2026 年日期依据国务院办公厅放假安排。
    const HOME_HOLIDAY_RANGES = [
      ['2026-01-01', '2026-01-03', '元旦'],
      ['2026-02-15', '2026-02-23', '春节'],
      ['2026-04-04', '2026-04-06', '清明节'],
      ['2026-05-01', '2026-05-05', '劳动节'],
      ['2026-06-19', '2026-06-21', '端午节'],
      ['2026-09-25', '2026-09-27', '中秋节'],
      ['2026-10-01', '2026-10-07', '国庆节']
    ];
    const HOME_ADJUSTED_WORKDAYS = new Set([
      '2026-01-04', '2026-02-14', '2026-02-28',
      '2026-05-09', '2026-09-20', '2026-10-10'
    ]);

    function localISODate(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function calendarDayStatus(date) {
      const key = localISODate(date);
      if (HOME_ADJUSTED_WORKDAYS.has(key)) return { label: '补班', detail: '调休工作日' };
      const holiday = HOME_HOLIDAY_RANGES.find(([start, end]) => key >= start && key <= end);
      if (holiday) return { label: holiday[2], detail: '法定节假日' };
      if (date.getDay() === 0 || date.getDay() === 6) return { label: '周末', detail: '周末休息日' };
      return { label: '工作日', detail: '普通工作日' };
    }

    // 获取并处理图标数据
    const fetchIconData = async (dir, url) => {
      try {
        const isForce = sessionStorage.getItem('force_clear_cache') === 'true';
        const fetchOptions = isForce ? { cache: 'reload' } : {};
        const fetchUrl = isForce ? `${url}?t=${Date.now()}` : url;
        const res = await fetch(fetchUrl, fetchOptions);
        if (!res.ok) return null;

        const etag = res.headers.get('ETag');
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        let content, type, hash;

        if (ct.includes('image/svg')) {
          type = 'svg';
          content = await res.text();
          hash = etag || await computeHash(content);
        } else {
          type = 'img';
          const blob = await res.blob();
          content = await blobToBase64(blob); // 转换为 Base64 本地存储
          hash = etag || await computeHash(content);
        }

        return { type, content, hash, url };
      } catch (e) { return null; }
    };

    // 尝试获取新图标（用于初始化和更新）
    const fetchAndCacheIcon = async (dir) => {
      // 针对 'calendar' 应用，生动态图标
      if (dir === 'calendar') {
        const now = new Date();
        const day = now.getDate();
        const month = now.getMonth() + 1;
        const weekdayCN = ['日', '一', '二', '三', '四', '五', '六'];
        const week = weekdayCN[now.getDay()];

        const svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cal-grad-dynamic" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#f9f9f9" />
              <stop offset="100%" style="stop-color:#e0e0e0" />
            </linearGradient>
          </defs>
          <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#cal-grad-dynamic)" stroke="#ccc" stroke-width="1" />
          <rect x="5" y="5" width="90" height="28" rx="18" fill="#FF3B30" />
          <rect x="5" y="20" width="90" height="13" fill="#FF3B30" />
          <text x="50" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">周${week}</text>
          <text x="50" y="78" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#333" text-anchor="middle">${day}</text>
        </svg>`;
        const data = { type: 'svg', content: svg, hash: 'dynamic-' + day + '-' + month, url: 'dynamic' };
        iconCache.set(dir, data);
        return data;
      }

      const noIconDirs = ['ppt'];
      if (noIconDirs.includes(dir)) return null;

      const candidates = [`./apps/${dir}/icon.svg`, `./apps/${dir}/icon`, `./apps/${dir}/icon.png`, `./apps/${dir}/icon.jpg`];

      for (const url of candidates) {
        const data = await fetchIconData(dir, url);
        if (data) {
          iconCache.set(dir, data);
          return data;
        }
      }
      return null;
    };

    // 检查更新
    const revalidateIcon = async (dir, currentHash, currentUrl) => {
      if (dir === 'calendar') return; // 动态图标不进行静默更新检查
      try {
        // 先尝试 HEAD 请求比对 ETag
        const headRes = await fetch(currentUrl, { method: 'HEAD', cache: 'no-cache' });
        if (headRes.ok) {
          const newEtag = headRes.headers.get('ETag');
          // 如果有 ETag 且一致，直接返回
          if (newEtag && newEtag === currentHash) return;
        }

        // 如果 ETag 不匹配或不存在，获取完整内容比对内容哈希
        const newData = await fetchIconData(dir, currentUrl);
        if (newData && newData.hash !== currentHash) {
          console.log(`Icon updated for ${dir}`);
          iconCache.set(dir, newData);
          updateIconInDOM(dir, newData);
        }
      } catch (e) {
        // 如果出错，或者 URL 失效，尝试重新完整寻找
        const newData = await fetchAndCacheIcon(dir);
        if (newData && newData.hash !== currentHash) {
          iconCache.set(dir, newData);
          updateIconInDOM(dir, newData);
        }
      }
    };

    // 更新 DOM 中的图标
    const updateIconInDOM = (dir, iconData) => {
      const imgContainer = document.querySelector(`.app-icon[data-dir="${dir}"] .app-icon-image`);
      if (!imgContainer) return;

      let inner = '';
      if (iconData) {
        inner = iconData.type === 'svg' ? iconData.content : `<img src="${iconData.content}" alt="icon">`;
      } else {
        // Fallback
        inner = `<div style="width:100%;height:100%;background:#0a84ff;border-radius:20px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:24px">${dir.charAt(0).toUpperCase()}</div>`;
      }

      // 添加淡入动画效果
      imgContainer.style.opacity = '0';
      setTimeout(() => {
        imgContainer.innerHTML = inner;
        imgContainer.style.opacity = '1';
      }, 200);
    };

    function loadApps() {
      const container = document.getElementById('app-container');
      const apps = getAppDirectories();
      const frag = document.createDocumentFragment();

      apps.forEach((app) => {
        const dir = getDirFromPath(app.path);
        const el = document.createElement('a');
        el.href = `./apps/${app.path}`;
        el.className = 'app-icon';
        el.title = app.name;
        el.setAttribute('data-dir', dir);

        let inner;
        let appDisplayName = app.name;
        if (dir === 'calendar') {
          const now = new Date();
          const month = now.getMonth() + 1;
          const day = now.getDate();
          const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
          const status = calendarDayStatus(now);
          appDisplayName = app.name;
          const calendarDescription = `${month}月${day}日周${week} · ${status.detail}`;
          el.title = `${app.name} · ${calendarDescription}`;
          el.setAttribute('aria-label', `${app.name}，${calendarDescription}`);
          inner = `<svg viewBox="0 0 100 100" role="img" aria-label="${calendarDescription}">
            <rect x="5" y="5" width="90" height="90" rx="18" fill="#f4f4f5" stroke="#d1d1d6"/>
            <path d="M23 5h54a18 18 0 0 1 18 18v10H5V23A18 18 0 0 1 23 5Z" fill="#ff3b30"/>
            <text x="50" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle">周${week}</text>
            <text x="50" y="78" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#1d1d1f" text-anchor="middle">${day}</text>
          </svg>`;
        } else if (app.icon) {
          inner = `<img src="./apps/${app.icon}" width="72" height="72" alt="" decoding="async">`;
        } else {
          inner = `<div class="app-icon-fallback" aria-hidden="true">${app.fallback || app.name.charAt(0)}</div>`;
        }

        el.innerHTML = `<div class="app-icon-image">${inner}</div><div class="app-name">${appDisplayName}</div>`;
        frag.appendChild(el);
      });
      container.replaceChildren(frag);
    }

    function formatVersionTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(date);
      const get = (type) => parts.find((part) => part.type === type)?.value || '';
      return `${get('year')}.${get('month')}.${get('day')} ${get('hour')}:${get('minute')}`;
    }

    async function loadVersion() {
      const footer = document.getElementById('version-footer');
      if (!footer) return;

      try {
        const response = await fetch('./version.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const build = await response.json();
        const time = formatVersionTime(build.updatedAt);
        const version = typeof build.version === 'string' ? build.version : '';
        footer.textContent = time ? `更新于 ${time}${version ? ` · ${version}` : ''}` : '版本信息不可用';
        footer.title = build.commit ? `部署版本 ${build.commit}` : footer.textContent;
      } catch (_) {
        footer.textContent = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
          ? '本地预览'
          : '版本信息暂不可用';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
      loadApps();
      loadVersion();
      document.getElementById('theme-toggle').onclick = () => Theme.toggle();
      document.getElementById('clear-cache-btn').onclick = async () => {
        const button = document.getElementById('clear-cache-btn');
        if (!confirm('将清理所有 App 的离线文件和本地缓存，不会删除账号、业务数据或云端数据。是否继续？')) return;
        button.disabled = true;
        button.title = '正在清理所有 App 缓存';
        try {
          await clearAllAppCaches();
          location.reload();
        } catch (error) {
          console.error('清理所有 App 缓存失败', error);
          button.disabled = false;
          button.title = '清理所有 App 本地缓存';
          alert('缓存未能完全清理，请稍后重试。');
        }
      };
    });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then((registration) => registration.update())
          .catch(() => {});
      }, { once: true });
    }
  </script>
</body>
