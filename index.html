<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应用导航</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --app-primary-color: #0a84ff;
      --app-background: #ffffff;
      --app-surface: rgba(255, 255, 255, 0.82);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --transition-speed: 0.6s;
    }

    [data-theme=dark] {
      --app-background: #000000;
      --app-surface: rgba(28, 28, 30, 0.82);
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro SC', 'SF Pro Display', sans-serif;
      background: var(--app-background);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    /* 背景层：通过 opacity 变化实现平滑切换 */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-attachment: fixed;
      transition: opacity var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
    }

    .bg-layer.active {
      opacity: 1;
    }

    .bg-dark {
      background-image: radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
    }

    .bg-light {
      background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(220, 100%, 99%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(280, 100%, 96%, 1) 0, transparent 50%);
    }

    /* 初始开场动画 */
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: scale(1.05) translateY(20px);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: pageEnter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .status-bar {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: flex-end;
    }

    .app-icons-wrapper {
      flex: 1;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 2.5rem;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      align-content: start;
    }

    .app-icon {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .app-icon-image {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      background: transparent;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .app-icon:hover .app-icon-image {
      transform: translateY(-8px) scale(1.1);
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.2));
    }

    .app-icon-image svg,
    .app-icon-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .app-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      max-width: 100%;
      word-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.8;
      transition: color var(--transition-speed) ease;
      line-height: 1.3;
    }

    .theme-toggle,
    .clear-cache-btn {
      background: var(--app-surface);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-primary);
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .clear-cache-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      position: fixed;
      left: 2rem;
      bottom: 2rem;
      z-index: 1000;
    }

    .clear-cache-btn:hover {
      transform: translateY(-3px) rotate(-5deg);
      color: #ff3b30;
      box-shadow: 0 12px 25px rgba(255, 59, 48, 0.2);
    }

    @media (max-width: 768px) {
      .app-icons-wrapper {
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        padding: 1.2rem;
      }

      .app-icon-image {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>

<body>
  <div id="bg-dark" class="bg-layer bg-dark"></div>
  <div id="bg-light" class="bg-layer bg-light"></div>

  <div class="container">
    <div class="status-bar">
      <button id="theme-toggle" class="theme-toggle" title="切换主题">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      </button>
    </div>
    <div class="app-icons-wrapper" id="app-container"></div>
  </div>

  <button id="clear-cache-btn" class="clear-cache-btn" title="强制刷新图标">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
    </svg>
  </button>

  <script type="module">
    import { getAppDirectories } from './apps.js';

    const Theme = {
      getTheme() { return localStorage.getItem('app-theme') || 'light' },
      updateBGLayers(t) {
        document.getElementById('bg-light').classList.toggle('active', t === 'light');
        document.getElementById('bg-dark').classList.toggle('active', t === 'dark');
      },
      setTheme(t) {
        localStorage.setItem('app-theme', t);
        document.body.setAttribute('data-theme', t);
        this.updateBGLayers(t);
      },
      toggle() {
        const next = this.getTheme() === 'light' ? 'dark' : 'light';
        if (document.startViewTransition) {
          document.startViewTransition(() => this.setTheme(next));
        } else {
          this.setTheme(next);
        }
      },
      init() { this.setTheme(this.getTheme()) }
    };

    // 缓存管理
    const CACHE_PREFIX = 'app_icon_v2_';
    const iconCache = {
      get(dir) {
        try {
          const item = localStorage.getItem(CACHE_PREFIX + dir);
          return item ? JSON.parse(item) : null;
        } catch (e) { console.error(e); return null; }
      },
      set(dir, data) {
        try {
          localStorage.setItem(CACHE_PREFIX + dir, JSON.stringify(data));
        } catch (e) {
          // 如果存储满了，清空旧缓存再试
          console.warn('LocalStorage full, clearing icons...');
          this.clear(false); // 不刷新页面
          try { localStorage.setItem(CACHE_PREFIX + dir, JSON.stringify(data)); } catch (e2) { }
        }
      },
      clear(reload = true) {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith(CACHE_PREFIX)) localStorage.removeItem(k);
        });
        if (reload) location.reload();
      }
    };

    // 工具函数：计算哈希 (SHA-256)
    const computeHash = async (content) => {
      const msgBuffer = new TextEncoder().encode(content);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    };

    // 工具函数：Blob 转 Base64
    const blobToBase64 = (blob) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    };

    const getDirFromPath = (p) => { if (!p) return ''; const i = p.indexOf('/'); return i === -1 ? p : p.slice(0, i); };

    // 获取并处理图标数据
    const fetchIconData = async (dir, url) => {
      try {
        const res = await fetch(url);
        if (!res.ok) return null;

        const etag = res.headers.get('ETag');
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        let content, type, hash;

        if (ct.includes('image/svg')) {
          type = 'svg';
          content = await res.text();
          hash = etag || await computeHash(content);
        } else {
          type = 'img';
          const blob = await res.blob();
          content = await blobToBase64(blob); // 转换为 Base64 本地存储
          hash = etag || await computeHash(content);
        }

        return { type, content, hash, url };
      } catch (e) { return null; }
    };

    // 尝试获取新图标（用于初始化和更新）
    const fetchAndCacheIcon = async (dir) => {
      // 针对 'calendar' 应用，生动态图标
      if (dir === 'calendar') {
        const now = new Date();
        const day = now.getDate();
        const month = now.getMonth() + 1;
        const weekdayCN = ['日', '一', '二', '三', '四', '五', '六'];
        const week = weekdayCN[now.getDay()];

        const svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cal-grad-dynamic" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#f9f9f9" />
              <stop offset="100%" style="stop-color:#e0e0e0" />
            </linearGradient>
          </defs>
          <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#cal-grad-dynamic)" stroke="#ccc" stroke-width="1" />
          <rect x="5" y="5" width="90" height="28" rx="18" fill="#FF3B30" />
          <rect x="5" y="20" width="90" height="13" fill="#FF3B30" />
          <text x="50" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">周${week}</text>
          <text x="50" y="78" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#333" text-anchor="middle">${day}</text>
        </svg>`;
        const data = { type: 'svg', content: svg, hash: 'dynamic-' + day + '-' + month, url: 'dynamic' };
        iconCache.set(dir, data);
        return data;
      }

      const noIconDirs = ['jlbj', 'ppt'];
      if (noIconDirs.includes(dir)) return null;

      const candidates = [`./apps/${dir}/icon.svg`, `./apps/${dir}/icon`, `./apps/${dir}/icon.png`, `./apps/${dir}/icon.jpg`];

      for (const url of candidates) {
        const data = await fetchIconData(dir, url);
        if (data) {
          iconCache.set(dir, data);
          return data;
        }
      }
      return null;
    };

    // 检查更新
    const revalidateIcon = async (dir, currentHash, currentUrl) => {
      if (dir === 'calendar') return; // 动态图标不进行静默更新检查
      try {
        // 先尝试 HEAD 请求比对 ETag
        const headRes = await fetch(currentUrl, { method: 'HEAD', cache: 'no-cache' });
        if (headRes.ok) {
          const newEtag = headRes.headers.get('ETag');
          // 如果有 ETag 且一致，直接返回
          if (newEtag && newEtag === currentHash) return;
        }

        // 如果 ETag 不匹配或不存在，获取完整内容比对内容哈希
        const newData = await fetchIconData(dir, currentUrl);
        if (newData && newData.hash !== currentHash) {
          console.log(`Icon updated for ${dir}`);
          iconCache.set(dir, newData);
          updateIconInDOM(dir, newData);
        }
      } catch (e) {
        // 如果出错，或者 URL 失效，尝试重新完整寻找
        const newData = await fetchAndCacheIcon(dir);
        if (newData && newData.hash !== currentHash) {
          iconCache.set(dir, newData);
          updateIconInDOM(dir, newData);
        }
      }
    };

    // 更新 DOM 中的图标
    const updateIconInDOM = (dir, iconData) => {
      const imgContainer = document.querySelector(`.app-icon[data-dir="${dir}"] .app-icon-image`);
      if (!imgContainer) return;

      let inner = '';
      if (iconData) {
        inner = iconData.type === 'svg' ? iconData.content : `<img src="${iconData.content}" alt="icon">`;
      } else {
        // Fallback
        inner = `<div style="width:100%;height:100%;background:#0a84ff;border-radius:20px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:24px">${dir.charAt(0).toUpperCase()}</div>`;
      }

      // 添加淡入动画效果
      imgContainer.style.opacity = '0';
      setTimeout(() => {
        imgContainer.innerHTML = inner;
        imgContainer.style.opacity = '1';
      }, 200);
    };

    async function loadApps() {
      const container = document.getElementById('app-container');
      const apps = await getAppDirectories();
      const frag = document.createDocumentFragment();

      // 并行处理所有 App
      await Promise.all(apps.map(async (app) => {
        const dir = getDirFromPath(app.path);

        // 1. 优先读取本地缓存
        let icon = iconCache.get(dir);
        let isCached = !!icon;

        // 2. 如果没有缓存，则进行请求
        if (!icon) {
          icon = await fetchAndCacheIcon(dir);
        }

        const el = document.createElement('a');
        el.href = `./apps/${app.path}`;
        el.className = 'app-icon';
        el.title = app.name;
        el.setAttribute('data-dir', dir); // 标记以便更新

        let inner = '';
        let appDisplayName = app.name;

        // 特殊处理 'calendar' 的显示名称，增加日期前缀
        if (dir === 'calendar') {
          const now = new Date();
          const month = now.getMonth() + 1;
          const day = now.getDate();
          appDisplayName = `${month}月${day}日 · ${app.name}`;
        }

        if (icon) {
          inner = icon.type === 'svg' ? icon.content : `<img src="${icon.content}" alt="${app.name}">`;
        } else {
          inner = `<div style="width:100%;height:100%;background:#0a84ff;border-radius:20px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:24px">${app.name.charAt(0)}</div>`;
        }

        el.innerHTML = `<div class="app-icon-image">${inner}</div><div class="app-name">${appDisplayName}</div>`;

        // 按原本顺序是不保证的，因为 Promise.all 是并行的。
        // 但为了保持 apps.js 的顺序，我们需要按 index 排序，或者简单的 for loop.
        // 为了简单且保持顺序，我们不直接 apply frag，而是收集 els
        return { el, index: apps.indexOf(app), dir, icon };
      })).then(results => {
        // 按原始顺序排序
        results.sort((a, b) => a.index - b.index).forEach(item => {
          frag.appendChild(item.el);

          // 3. 如果是读取的缓存，触发静默更新检查
          if (item.icon) {
            revalidateIcon(item.dir, item.icon.hash, item.icon.url);
          }
        });
        container.innerHTML = '';
        container.appendChild(frag);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
      loadApps();
      document.getElementById('theme-toggle').onclick = () => Theme.toggle();
      document.getElementById('clear-cache-btn').onclick = () => iconCache.clear();
    });
  </script>
</body>

</html>
