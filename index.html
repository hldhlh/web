<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应用导航</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --app-primary-color: #0a84ff;
      --app-background: #ffffff;
      --app-surface: rgba(255, 255, 255, 0.82);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --transition-speed: 0.6s;
    }

    [data-theme=dark] {
      --app-background: #000000;
      --app-surface: rgba(28, 28, 30, 0.82);
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro SC', 'SF Pro Display', sans-serif;
      background: var(--app-background);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    /* 背景层：通过 opacity 变化实现平滑切换 */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-attachment: fixed;
      transition: opacity var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
    }

    .bg-layer.active {
      opacity: 1;
    }

    .bg-dark {
      background-image: radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
    }

    .bg-light {
      background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(220, 100%, 99%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(280, 100%, 96%, 1) 0, transparent 50%);
    }

    /* 初始开场动画 */
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: scale(1.05) translateY(20px);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: pageEnter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .status-bar {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: flex-end;
    }

    .app-icons-wrapper {
      flex: 1;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 2.5rem;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      align-content: start;
    }

    .app-icon {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .app-icon-image {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      background: transparent;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .app-icon:hover .app-icon-image {
      transform: translateY(-8px) scale(1.1);
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.2));
    }

    .app-icon-image svg,
    .app-icon-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .app-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
      max-width: 100%;
      word-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      opacity: 0.8;
      transition: color var(--transition-speed) ease;
      line-height: 1.3;
    }

    .theme-toggle,
    .clear-cache-btn {
      background: var(--app-surface);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-primary);
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .clear-cache-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      position: fixed;
      left: 2rem;
      bottom: 2rem;
      z-index: 1000;
    }

    .clear-cache-btn:hover {
      transform: translateY(-3px) rotate(-5deg);
      color: #ff3b30;
      box-shadow: 0 12px 25px rgba(255, 59, 48, 0.2);
    }

    @media (max-width: 768px) {
      .app-icons-wrapper {
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        padding: 1.2rem;
      }

      .app-icon-image {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>

<body>
  <div id="bg-dark" class="bg-layer bg-dark"></div>
  <div id="bg-light" class="bg-layer bg-light"></div>

  <div class="container">
    <div class="status-bar">
      <button id="theme-toggle" class="theme-toggle" title="切换主题">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      </button>
    </div>
    <div class="app-icons-wrapper" id="app-container"></div>
  </div>

  <button id="clear-cache-btn" class="clear-cache-btn" title="强制刷新图标">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
    </svg>
  </button>

  <script type="module">
    import { getAppDirectories } from './apps.js';

    const Theme = {
      getTheme() { return localStorage.getItem('app-theme') || 'light' },
      updateBGLayers(t) {
        document.getElementById('bg-light').classList.toggle('active', t === 'light');
        document.getElementById('bg-dark').classList.toggle('active', t === 'dark');
      },
      setTheme(t) {
        localStorage.setItem('app-theme', t);
        document.body.setAttribute('data-theme', t);
        this.updateBGLayers(t);
      },
      toggle() {
        const next = this.getTheme() === 'light' ? 'dark' : 'light';
        // 使用现代 View Transition API 如果浏览器支持
        if (document.startViewTransition) {
          document.startViewTransition(() => this.setTheme(next));
        } else {
          this.setTheme(next);
        }
      },
      init() { this.setTheme(this.getTheme()) }
    };

    const iconCache = (() => {
      const memStore = new Map();
      return {
        get: (k) => memStore.get(k),
        set: (k, v) => memStore.set(k, v),
        clear: () => {
          memStore.clear();
          try { sessionStorage.clear(); localStorage.clear(); } catch (e) { }
          location.reload();
        }
      }
    })();

    const getDirFromPath = (p) => { if (!p) return ''; const i = p.indexOf('/'); return i === -1 ? p : p.slice(0, i); };

    const resolveIcon = async (dir) => {
      if (iconCache.get(dir)) return iconCache.get(dir);

      // 内部处理：已知没有图标的目录直接跳过，避免控制台产生 404 错误
      const noIconDirs = ['jlbj', 'ppt'];
      if (noIconDirs.includes(dir)) return null;

      const candidates = [`./pages/${dir}/icon.svg`, `./pages/${dir}/icon`];
      for (const url of candidates) {
        try {
          const res = await fetch(url, { cache: 'no-cache' });
          if (!res.ok) continue;
          const ct = (res.headers.get('content-type') || '').toLowerCase();
          const value = ct.includes('image/svg')
            ? { type: 'svg', content: await res.text() }
            : { type: 'img', url };
          iconCache.set(dir, value);
          return value;
        } catch (e) { }
      }
      return null;
    };

    async function loadApps() {
      const container = document.getElementById('app-container');
      const apps = await getAppDirectories();
      const frag = document.createDocumentFragment();

      for (const app of apps) {
        const dir = getDirFromPath(app.path);
        const icon = await resolveIcon(dir);
        const el = document.createElement('a');
        el.href = `./pages/${app.path}`;
        el.className = 'app-icon';
        el.title = app.name;

        let inner = '';
        if (icon) {
          inner = icon.type === 'svg' ? icon.content : `<img src="${icon.url}" alt="${app.name}">`;
        } else {
          inner = `<div style="width:100%;height:100%;background:#0a84ff;border-radius:20px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:24px">${app.name.charAt(0)}</div>`;
        }

        el.innerHTML = `<div class="app-icon-image">${inner}</div><div class="app-name">${app.name}</div>`;
        frag.appendChild(el);
      }
      container.appendChild(frag);
    }

    document.addEventListener('DOMContentLoaded', () => {
      Theme.init();
      loadApps();
      document.getElementById('theme-toggle').onclick = () => Theme.toggle();
      document.getElementById('clear-cache-btn').onclick = () => iconCache.clear();
    });
  </script>
</body>

</html>
