<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#EEF2FF" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Accent Tile Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Inner Border Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Soft Shadow for Depth -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Top Highlight Rim -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#strokeGrad)" stroke-width="1.5"/>

  <!-- Bento App Matrix Icons (Modern Minimalist 2x2 Grid) -->
  <g filter="url(#softShadow)">
    <rect x="14.5" y="14.5" width="15" height="15" rx="4.5" fill="url(#glassGrad)"/>
    <rect x="34.5" y="14.5" width="15" height="15" rx="4.5" fill="url(#glassGrad)" fill-opacity="0.9"/>
    <rect x="14.5" y="34.5" width="15" height="15" rx="4.5" fill="url(#glassGrad)" fill-opacity="0.9"/>
    <rect x="34.5" y="34.5" width="15" height="15" rx="4.5" fill="url(#accentGrad)"/>
  </g>
</svg>
